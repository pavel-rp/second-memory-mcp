name: CD Test

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: cd-test
  cancel-in-progress: false

env:
  REPO_DIR: /home/deploy/second-memory-mcp-test
  COMPOSE_DIR: /home/deploy/docker-services/second-memory-mcp
  COMPOSE_FILE: docker-compose.test.yml

jobs:
  deploy-test:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch != 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to test
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: SHA,REPO_DIR,COMPOSE_DIR,COMPOSE_FILE
          script: |
            set -e

            # Failure diagnostics trap — installed before any command that can fail
            # so `docker compose up`, `git`, and early `cd` failures also surface
            # diagnostics. Fires on both implicit set -e failures and explicit
            # `exit N` paths (ERR trap would miss the latter). Uses --format (never
            # raw `docker inspect <id>`) so env-var secrets are not leaked. Exit
            # status is preserved automatically by the EXIT trap.
            on_exit() {
              status=$?
              [ "$status" -eq 0 ] && return 0
              echo "::group::Deploy failure diagnostics"
              if [ -n "${CONTAINER:-}" ]; then
                echo "---- docker logs --tail 200 $CONTAINER ----"
                docker logs --tail 200 "$CONTAINER" || true
                echo "---- docker inspect state ----"
                docker inspect --format '{{json .State}}' "$CONTAINER" || true
                echo "---- docker inspect restart/healthcheck ----"
                docker inspect --format 'restart={{.RestartCount}} healthcheck={{json .Config.Healthcheck}}' "$CONTAINER" || true
              else
                echo "::warning::Deploy failed before container ID was resolved (status=$status)"
                echo "---- docker compose ps ----"
                ( cd "$COMPOSE_DIR" 2>/dev/null && docker compose -p second-memory-mcp-test -f "$COMPOSE_FILE" ps ) || true
              fi
              echo "::endgroup::"
            }
            trap on_exit EXIT

            cd "$REPO_DIR"
            git fetch origin
            git reset --hard "$SHA"
            git clean -fd

            cd "$COMPOSE_DIR"
            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "Error: $COMPOSE_FILE not found in $(pwd)"
              exit 1
            fi
            docker compose -p second-memory-mcp-test -f "$COMPOSE_FILE" up -d --build

            CONTAINER=$(docker compose -p second-memory-mcp-test -f "$COMPOSE_FILE" ps -q app)

            if [ -z "$CONTAINER" ]; then
              echo "Error: no app container ID returned by 'docker compose -p second-memory-mcp-test -f \$COMPOSE_FILE ps -q app'; the container may have failed to start"
              exit 1
            fi

            # Wait for sustained health: State.Status == "running" AND
            # State.Health.Status == "healthy" for 3 consecutive polls (6 s stable).
            # Fail fast on "restarting". Budget: 45 polls × 2 s ≈ 88 s worst case.
            consecutive=0
            last_status=""
            last_health=""
            for i in $(seq 1 45); do
              last_status=$(docker inspect --format '{{.State.Status}}' "$CONTAINER" 2>/dev/null || echo unknown)
              last_health=$(docker inspect --format '{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null || echo unknown)
              if [ "$last_status" = "restarting" ]; then
                echo "Container entered restarting state at poll $i/45 (health=$last_health); aborting"
                exit 1
              fi
              if [ "$last_status" = "running" ] && [ "$last_health" = "healthy" ]; then
                consecutive=$((consecutive + 1))
                if [ "$consecutive" -ge 3 ]; then
                  echo "Container healthy for 3 consecutive polls (after $i iterations)"
                  break
                fi
              else
                consecutive=0
              fi
              if [ "$i" -eq 45 ]; then
                echo "Health check timeout after 45 polls; last status=$last_status health=$last_health consecutive=$consecutive"
                exit 1
              fi
              sleep 2
            done
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO_DIR: ${{ env.REPO_DIR }}
          COMPOSE_DIR: ${{ env.COMPOSE_DIR }}
          COMPOSE_FILE: ${{ env.COMPOSE_FILE }}

  smoke-test:
    needs: [deploy-test]
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch != 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate smoke test config
        env:
          MCP_BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL }}
        run: |
          if [ -z "$MCP_BASE_URL" ]; then
            echo "::error::SMOKE_TEST_BASE_URL secret is not set — smoke tests would silently skip"
            exit 1
          fi

      - name: Fetch OAuth token
        id: auth
        env:
          TOKEN_URL: https://auth.neurasphere.ee/auth/v1/oidc/token
          CLIENT_ID: ${{ secrets.SMOKE_TEST_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SMOKE_TEST_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::SMOKE_TEST_CLIENT_ID or SMOKE_TEST_CLIENT_SECRET secret is not set"
            exit 1
          fi
          RESPONSE=$(curl -sS --connect-timeout 10 --max-time 30 --retry 2 --retry-delay 5 \
            -X POST "$TOKEN_URL" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET")
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to obtain OAuth token"
            echo "$RESPONSE" | jq '{error, error_description}' >&2 || true
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests
        env:
          MCP_BASE_URL: ${{ secrets.SMOKE_TEST_BASE_URL }}
          MCP_AUTH_TOKEN: ${{ steps.auth.outputs.token }}
        run: pnpm run test:smoke
