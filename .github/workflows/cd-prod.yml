name: CD Prod

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  REPO_DIR: /home/deploy/second-memory-mcp
  COMPOSE_DIR: /home/deploy/docker-services/second-memory-mcp

jobs:
  deploy-prod:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to prod
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: SHA,REPO_DIR,COMPOSE_DIR
          script: |
            set -e
            cd "$REPO_DIR"
            git fetch origin
            git reset --hard "$SHA"
            git clean -fd

            cd "$COMPOSE_DIR"
            docker compose up -d --build

            # Wait for health check
            CONTAINER=$(docker compose ps -q app)
            for i in $(seq 1 30); do
              if docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null | grep -q healthy; then
                echo "Container healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Health check timeout"
                exit 1
              fi
              sleep 2
            done

            # Run migrations
            docker exec "$CONTAINER" node dist/infrastructure/db/migrate.js
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO_DIR: ${{ env.REPO_DIR }}
          COMPOSE_DIR: ${{ env.COMPOSE_DIR }}
