name: CD Prod

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]

concurrency:
  group: cd-prod
  cancel-in-progress: false

env:
  REPO_DIR: /home/deploy/second-memory-mcp
  COMPOSE_DIR: /home/deploy/docker-services/second-memory-mcp

jobs:
  deploy-prod:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to prod
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT }}
          envs: SHA,REPO_DIR,COMPOSE_DIR
          script: |
            set -e
            cd "$REPO_DIR"
            git fetch origin
            git reset --hard "$SHA"
            git clean -fd

            export BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

            cd "$COMPOSE_DIR"
            BUILD_TIME="$BUILD_TIME" docker compose up -d --build

            # Wait for health check
            CONTAINER=$(docker compose ps -q app)
            for i in $(seq 1 30); do
              if docker inspect --format='{{.State.Health.Status}}' "$CONTAINER" 2>/dev/null | grep -q healthy; then
                echo "Container healthy"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "Health check timeout"
                exit 1
              fi
              sleep 2
            done

            # Run migrations
            docker exec "$CONTAINER" node dist/infrastructure/db/migrate.js
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO_DIR: ${{ env.REPO_DIR }}
          COMPOSE_DIR: ${{ env.COMPOSE_DIR }}

  smoke-test:
    needs: [deploy-prod]
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate smoke test config
        env:
          MCP_BASE_URL: ${{ secrets.SMOKE_PROD_BASE_URL }}
        run: |
          if [ -z "$MCP_BASE_URL" ]; then
            echo "::error::SMOKE_PROD_BASE_URL secret is not set — smoke tests would silently skip"
            exit 1
          fi

      - name: Fetch OAuth token
        id: auth
        env:
          TOKEN_URL: https://auth.neurasphere.ee/auth/v1/oidc/token
          CLIENT_ID: ${{ secrets.SMOKE_PROD_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.SMOKE_PROD_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::SMOKE_PROD_CLIENT_ID or SMOKE_PROD_CLIENT_SECRET secret is not set"
            exit 1
          fi
          RESPONSE=$(curl -s -X POST "$TOKEN_URL" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET")
          TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Failed to obtain OAuth token"
            echo "$RESPONSE" | jq '{error, error_description}' >&2 || true
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests
        env:
          MCP_BASE_URL: ${{ secrets.SMOKE_PROD_BASE_URL }}
          MCP_AUTH_TOKEN: ${{ steps.auth.outputs.token }}
        run: pnpm run test:smoke
