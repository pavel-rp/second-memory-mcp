name: CI

on:
  push:
  pull_request:
    branches: [develop]

jobs:
  build-test-lint:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: second_memory_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint code
        run: pnpm run lint

      - name: Check research citation paths
        run: pnpm run lint:citations

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/second_memory_test
        run: pnpm run db:migrate

      - name: Validate linter rule eligibility
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/second_memory_test
        run: pnpm run lint:validate

      - name: Type check
        run: pnpm run type-check

      - name: Build project
        run: pnpm run build

      - name: Run tests
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/second_memory_test
        run: pnpm run test:ci

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  version-bump:
    needs: build-test-lint
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    concurrency:
      group: version-bump
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Bump patch version
        run: pnpm version patch --no-git-tag-version

      - name: Create version bump PR and merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          BRANCH="chore/version-bump-${NEW_VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${BRANCH}"
          git add package.json
          git commit -m "chore: bump version to ${NEW_VERSION}"
          git push -u origin "${BRANCH}"
          gh pr create --title "chore: bump version to ${NEW_VERSION} [skip ci]" --body "Automated version bump to ${NEW_VERSION}" --base develop
          gh pr merge --auto --squash --delete-branch || gh pr merge --squash --delete-branch
