  - id: "cl-2.subtree-indexed-state-space"
    name: "Subtree-indexed state space"
    node_kind: "knowledge"
    cluster: "CL-2"
    role: "technique"
    summary: >-
      The state space whose subproblem is "the subtree rooted at v", and the two
      facts that make it the friendliest structured family: rooting the tree
      induces a containment order with no cycles for free, and a subtree's
      answer depends only on its children's — so the whole DP is one traversal
      and the evaluation-order problem that dominates interval DP disappears.
      What a learner acquires is that the tree IS the recursion, rather than a
      structure the recursion must be fitted to.
