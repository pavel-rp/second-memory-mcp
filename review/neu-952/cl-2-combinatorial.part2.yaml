  - id: "cl-2.matrix-chain-recurrence"
    name: "Matrix-chain multiplication recurrence"
    node_kind: "knowledge"
    cluster: "CL-2"
    role: "technique"
    summary: >-
      The canonical interval DP: parenthesize a chain of matrix products to
      minimize scalar multiplications, where a range's cost is the best split's
      two subcosts plus the cost of the final product, itself determined by the
      dimensions at the range's boundary. Its instructive property is that the
      joining cost depends only on the range's endpoints and the split — the
      simplest possible join, which is why the family is usually taught here
      first.
    prerequisites:
      intra_cluster:
        - "cl-2.interval-split-recurrence"
        - "cl-2.split-point-semantics"
      roots: []
      boundary_anchors: []
    cross_cluster_attachments: []
