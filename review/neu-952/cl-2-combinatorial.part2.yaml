    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6. S1 no, S2 no, S3 no (a requirement, not a symptom),
      S4 no, S5 no. S6 yes: recovering the structure requires deciding what to
      retain — the argmin split per range, or a re-derivation by comparison —
      and emitting a nested structure rather than a flat set, which is a
      judgment about this recurrence rather than a fixed routine.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Walk the table to emit the actual grouping — the parenthesization, the
      merge order, the BST — rather than only its cost, by recursing on the
      stored split of each range. The distinction from the knapsack witness is
      real and is why this is its own node: the output is a TREE recovered from
      a table indexed by ranges, not a subset, so the walk is recursive on both
      halves rather than a single back-chain.
