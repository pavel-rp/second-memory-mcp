  - id: "cl-2.interval-evaluation-order-by-length"
    name: "Interval DP is evaluated by increasing length"
    node_kind: "knowledge"
    cluster: "CL-2"
    role: "technique"
    summary: >-
      That the containment order which makes the recurrence acyclic is realized
      concretely by iterating ranges in increasing length, and that the natural
      row-major order over the endpoint table does NOT respect it — a range's
      dependencies are shorter ranges, which are scattered across the table
      rather than adjacent to it. This is the first place in the map where the
      evaluation order is not the obvious loop order, and knowing why is what
      generalizes to the tree and DAG families.
