  - id: "cl-2.implement-interval-dp-length-loop"
    name: "Implement an interval DP over a length-major loop"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6. S1 no, S2 no (making it run, not faster), S3 no, S4
      no, S5 no (the formulation is chosen). S6 rather than S7: the loop bounds
      must be derived from THIS formulation's endpoint convention and base-case
      span, and the split enumeration's range depends on whether the convention
      is closed or half-open — judgments about the specific recurrence, which is
      the schema §2.1 test for S6. Not S7: nothing here is a fixed idiom.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Realize the recurrence bottom-up: outer loop over span, inner over the
      left endpoint with the right derived, innermost over the split, with the
      base cases seeded at the smallest span. Or, equivalently and often more
      safely, realize it top-down and let recursion discover the order — a
      choice the learner should make deliberately rather than by habit.
    prerequisites:
      intra_cluster:
        - "cl-2.interval-evaluation-order-by-length"
        - "cl-2.formulate-interval-dp"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 5
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 0
      implementation_load: 3
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E5", "JS-E6"]
      severity: "performance"
      rationale: >-
        MATERIAL — this is the node that writes the n^2 table and the O(n^3) loop nest, and the
        container decision is JavaScript's to make. C++'s vector<vector<int>> gives unboxed
        contiguous rows for free; the direct JavaScript translation gives a boxed outer array of
        boxed inner arrays, read in the innermost loop of a cubic algorithm — the worst place to
        pay a pointer chase and an unboxing. The JavaScript idiom is a flat Int32Array with i *
        n + j addressing. Recorded here rather than on cl-2.interval-evaluation-order-by-length
        because the order is a dependency fact and the table is a written artifact (JS-D2).
        Deliberate non-claim on JS-E1: the length-major loop is ITERATIVE, so it is exactly the
        realization that sidesteps the recursion cap — which is worth stating, because the
        memoized top-down alternative a C++ author might reach for instead does not sidestep it.
        Directional, not quantified (JS-U2).
      uncertainty: "JS-U2"
    coverage:
      status: "unaudited"
      corpus_refs: ["C2", "C3"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"

  - id: "cl-2.debug-interval-order-violation"
    name: "Diagnose an interval DP that reads uncomputed states"
    node_kind: "skill"
    skill_type: "debugging"
    skill_type_rationale: >-
      Cascade stops at S3. S1 no, S2 no — the DP is wrong, not slow. S3 yes: it
      begins with a symptom (an answer built from base-case-valued or
      zero-valued states; a result that is right for small n and wrong for
      large; a top-down version that agrees and a bottom-up one that does not)
      and reasons back to an evaluation order that violates containment. Later
      tests unreached.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Recognize the specific signature of an order violation — the table is
      fully populated, no index is out of bounds, nothing crashes, and the
      answer is silently built on unfinished states — and localize it by
      comparing against a memoized version that cannot violate the order. The
      technique a learner acquires is the differential: an order bug is exactly
      the bug that top-down cannot have.
    prerequisites:
      intra_cluster:
        - "cl-2.implement-interval-dp-length-loop"
      roots:
        - "cl-1.root.memoization-vs-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 6
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 0
      implementation_load: 3
      recognition_load: 4
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E9", "JS-E5"]
      severity: "idiom-shift"
      rationale: >-
        MATERIAL — the symptom this node diagnoses has a container-dependent signature in
        JavaScript that has no C++ counterpart. The bug is reading a state not yet computed. In
        C++ the table is a zero-initialized vector, so the read returns 0 and the wrong answer
        is a too-small optimum — one signature, always. In JavaScript the signature DEPENDS ON
        THE CONTAINER CHOICE (JS-E5), which the author made for performance reasons and now
        discovers has changed their debugging: a plain Array yields undefined, so the arithmetic
        yields NaN and the wrongness SPREADS and is loud, visible immediately and traceable to
        the first bad read; an Int32Array yields a silent 0, indistinguishable from a
        legitimately computed zero, so the wrongness is quiet and looks like a modelling error
        rather than an ordering error. A downstream agent must teach both signatures and must
        teach that the container decides which one the learner will see. That is a
        JavaScript-specific differential the inherited C++ taxonomy does not contain.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    notes: >-
      Empty corpus_refs: systematic for `debugging` nodes — see
      cl-2.debug-item-reuse-from-loop-direction's note. D-F2 limitation.

