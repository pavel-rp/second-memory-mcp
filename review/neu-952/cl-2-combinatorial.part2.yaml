      — the recurrence is not correct-but-slow, it is WRONG, so there is nothing
      to accelerate. S3 no, and this rejection is the sharp one: this is not
      diagnosing a symptom, it is anticipating insufficiency AT FORMULATION time
      by asking whether the halves are independent. (Meeting it as a symptom is
      cl-2.debug-interval-order-violation's neighbour and not this node.) S4 no.
