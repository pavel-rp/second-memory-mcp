      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 4
      state_formulation_load: 3
      transition_derivation_load: 3
      proof_obligation_load: 1
      implementation_load: 2
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. The recurrence minimizes over split points; its costs are triple
        products of matrix dimensions, which the problems that pose it keep well inside 2^53.
        Deliberate non-claim: no JS-E2 assertion, because the dimensions are small by
        construction.
