      transitions are edges, and the requirement that the recurrence be
      well-founded is exactly the requirement that this graph be acyclic. Every
      family in every cluster is DP over a DAG — the item prefix, the interval
      containment order, and the rooted tree are all DAGs. What a learner
      acquires is the retro-reading that makes the evaluation-order problem one
      problem rather than one per family.
