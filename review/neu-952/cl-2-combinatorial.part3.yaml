  - id: "cl-2.implement-rerooting-two-pass-dfs"
    name: "Implement rerooting as two traversals"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6. S1 no, S2 no (realizing a chosen formulation, not
      accelerating an existing one), S3 no, S4 no, S5 no (applicability already
      decided). S6 yes: the second pass's argument — what the parent must hand
      each child — is derived from THIS problem's aggregate, and whether the
      prefix-suffix arrays or a subtraction is used follows from this fold's
      invertibility. Both are judgments about the specific recurrence, so S7 is
      rejected: nothing here is fixed across problems.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Write the two passes: a post-order pass computing every down-value, then a
      pre-order pass carrying each vertex's up-value to its children, combining
      the parent's up-value with the parent's other children's down-values. The
      per-vertex answer is the fold of its down-values with its up-value. The
      implementation risk is that both passes look plausible and only the
      up-value can be wrong.
    prerequisites:
      intra_cluster:
        - "cl-2.recognize-rerooting-applicability"
        - "cl-2.exclude-one-child-aggregate"
        - "cl-2.implement-tree-dp-post-order-dfs"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 7
      state_formulation_load: 2
      transition_derivation_load: 3
      proof_obligation_load: 0
      implementation_load: 4
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E1"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — rerooting is TWO traversals of the same tree, so it meets JS-E1
        twice, and the second pass is the harder conversion. The upward (post-order) pass has
        the same problem as any tree DP: depth 2e5 on a path-shaped tree against a ~1e4
        JavaScript cap, no raisable limit. The downward pass is worse: it carries a value from
        parent to child, so the explicit-stack rewrite must push the parent's contribution onto
        the stack alongside the vertex, whereas the recursion carried it implicitly in the frame
        as an argument. The C++ default writes both passes as plain recursion and never
        confronts this. In JavaScript both passes must be rewritten with explicit stacks, and
        the downward one's per-frame payload must be made explicit — a genuine acquisition, at
        exactly the tree sizes rerooting is FOR (rerooting exists to avoid the O(n^2) of
        re-running the DP from every root, so it is only reached for when n is large — precisely
        where the JavaScript stack fails).
      mapper_note: >-
        Observation only, NOT a verdict — OUT-5 (SUB-8) owns it. Rerooting is two full
        traversals, so the recursion-depth exposure noted on cl-2.debug-tree-dp-recursion-depth
        applies twice over. Recorded for SUB-8; this note is not a verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"

