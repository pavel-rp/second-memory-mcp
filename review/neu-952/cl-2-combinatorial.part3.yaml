  - id: "cl-2.exclude-one-child-aggregate"
    name: "Excluding one child from an aggregate"
    node_kind: "knowledge"
    cluster: "CL-2"
    role: "technique"
    summary: >-
      The technical core of rerooting, and the part that is not the idea: to
      pass a value down to child c, a vertex must aggregate all its children
      EXCEPT c, and doing that naively per child is quadratic in the degree —
      which on a star is quadratic overall and defeats the whole point. The two
      repairs are prefix-and-suffix aggregates over the child list (always
      available), or subtracting c's contribution when the aggregate is
      invertible (available for sums, not for maxima). Knowing WHICH applies is
      knowing whether the fold has an inverse, and that is the fact this node
      carries.
    prerequisites:
      intra_cluster:
        - "cl-2.rerooting-principle"
        - "cl-2.child-aggregation"
      roots: []
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 5
      state_formulation_load: 2
      transition_derivation_load: 4
      proof_obligation_load: 2
      implementation_load: 2
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. Excluding one child from an aggregate without recomputing it — by
        prefix/suffix folds, or by inverting the fold where an inverse exists — is an algebraic
        technique. The choice between them is decided by whether the aggregate has an inverse,
        not by the language.
    coverage:
      status: "unaudited"
      corpus_refs: ["C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    aliases: ["prefix-suffix child aggregates", "leave-one-out aggregate", "invertible merge"]
    notes: >-
      This node is NOT excluded to CL-4 despite being about cost, and the
      distinction is worth stating for the floor audit. T1 requires an
      already-correct recurrence whose cost is reduced. The exclude-one-child
      aggregate is not an acceleration of rerooting — it is a CONSTITUENT of it:
      without it the up-value cannot be computed at all in the invertible-free
      case, because the naive per-child recomputation is the thing rerooting
      exists to avoid. A technique whose absence leaves no correct recurrence is
      not an optimization of one.

