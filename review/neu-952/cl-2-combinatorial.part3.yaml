  - id: "cl-2.prove-tree-knapsack-quadratic-bound"
    name: "Prove the subtree-size-bounded merge runs in quadratic time"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1. The contribution is an ARGUMENT — the double counting
      that shows the merge loops, bounded by the two subtrees' sizes, total to
      the number of vertex pairs whose lowest common ancestor is the merge
      point, hence n choose 2 overall. S1 is asked first and answers yes; no
      later test is reached. Note the near-miss deliberately: S2 would fire if
      this node CHANGED the recurrence to make it cheaper, but it does not — it
      argues the bound of the natural recurrence, which is the difference
      between proving and optimizing.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Establish that the tree knapsack's merge — whose loops are bounded by the
      sizes of the two subtrees being merged rather than by the global capacity
      — costs quadratic time in total rather than the cubic a naive reading
      suggests. The argument is the acquisition: each pair of vertices is
      charged exactly once, at their lowest common ancestor. Without it a
      learner cannot tell a correct tree knapsack from one that is too slow,
      because the two differ only in a loop bound.
