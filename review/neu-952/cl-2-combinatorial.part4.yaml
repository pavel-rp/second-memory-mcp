  - id: "E9"
    technique: "Centroid-decomposition path counting"
    disposition: "scoped-out-with-rationale"
    owner_cluster: "none"
    owner_subtask: "unowned — flagged for OUT-7"
    cascade_test: "not run — outside the partition's domain"
    rationale: >-
      Excluded as not-DP: it is divide-and-conquer over a tree. It computes no
      recurrence over a state space and makes no optimal-substructure claim —
      it recursively splits at a centroid and counts paths through it, and the
      counting is combinatorial rather than a fold over subproblem optima.
    contested: true
    rival_reading: >-
      A rival reading takes the per-centroid-level subproblems as states over a
