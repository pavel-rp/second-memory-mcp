  - id: "E8"
    technique: "SOS DP / subset-sum convolution (zeta-Moebius transform)"
    disposition: "owned-by-sibling-cluster"
    owner_cluster: "CL-4"
    owner_subtask: "SUB-6 (NEU-937)"
    cascade_test: "T1"
    rationale: >-
      CONTESTED UPSTREAM and carried, not smoothed. D-F4 §4.2 adjudicates it to
      CL-4 by the order (it accelerates an already-correct subset-indexed
      transition) and records CL-3's live rival claim as a D-F4a provisional
