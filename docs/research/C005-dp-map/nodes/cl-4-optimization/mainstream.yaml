  # ===========================================================================
  # 6. CROSS-CUTTING: CHOOSING AMONG THE MAINSTREAM OPTIMIZATIONS
  # ===========================================================================

  - id: "cl-4.select-mainstream-optimization"
    name: "Selecting a mainstream optimization for a too-slow DP"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5. S1 no — nothing is argued. S2 no, and this is the file's most delicate
      typing call: per schema §2.1 the S2/S5 boundary asks whether a correct recurrence already
      exists, and here it does — which pulls toward S2. It is nonetheless S5, because S2's defining
      contribution is REDUCING the cost, and this node reduces nothing: it selects which of five
      sibling nodes will do the reducing. Typing it S2 would make it indistinguishable from the five
      techniques it chooses between. S3 no — a TLE symptom is a common trigger, but the contribution
      is the choice under a cost constraint, not the diagnosis from symptom to cause. S4 no — the
      candidate techniques are known, not hidden under an unfamiliar surface. S5 yes: choosing which
      technique to apply under a cost constraint is S5's defining contribution.
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Given a correct DP that is too slow, read the recurrence's structural signature and pick the
      optimization it admits — a line-shaped cost implies an envelope method, monotone argmin implies
      D&C or Knuth-Yao depending on whether the layers are partitions or intervals, a bounded window
      implies a monotonic queue, and a huge step count with a small fixed state implies matrix
      exponentiation. What a learner acquires is the decision itself, which is the ability that makes
      the other nodes reachable in a contest rather than in hindsight.
    prerequisites:
      intra_cluster:
        - "cl-4.convex-hull-trick-monotonic"
        - "cl-4.li-chao-tree-dp-application"
        - "cl-4.divide-and-conquer-optimization"
        - "cl-4.knuth-yao-optimization"
        - "cl-4.monotonic-queue-optimization"
        - "cl-4.matrix-exponentiation-dp"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors: []
    cross_cluster_attachments:
      - attachment_id: "xc.cl-4.select-mainstream-optimization->cl-1.formulate-1d-sequence-dp"
        from: "cl-4.select-mainstream-optimization"
        to_cluster: "CL-1"
        to_node: "cl-1.formulate-1d-sequence-dp"
        to_name: "Formulate a 1D sequence DP"
        relation: "requires"
        rationale: >-
          The choice is made about an already-correct DP; without the ability to formulate one there
          is nothing to select an optimization for. Declared against the base family rather than
          drawn, per D-F4 §3.1.
        confidence: "named"
        status: "declared"
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 6
      state_formulation_load: 1
      transition_derivation_load: 2
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 5
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. Which optimization a too-slow DP wants is decided by the STRUCTURE
        of its transition — envelope, monotone split, window, or linear — and that structure is
        a property of the recurrence, identical in every language. A deliberate non-claim,
        because a plausible argument runs the other way: several of this cluster's optimizations
        carry a JavaScript-specific tax (JS-E2's modmul and cross-multiplication rewrites,
        JS-E8's absent deque), so one could argue the selection calculus shifts. It does not
        shift enough to be material: the tax applies to the REALIZATION of whichever technique
        the structure already selected, and does not make a structurally-wrong optimization
        right or a structurally-right one wrong. Asserting otherwise would be an invented claim.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
