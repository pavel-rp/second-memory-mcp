  - id: "cl-4.matrix-exponentiation-dp"
    name: "Matrix-exponentiation DP"
    node_kind: "skill"
    skill_type: "optimization"
    skill_type_rationale: >-
      Cascade stops at S2. S1 no — associativity of matrix multiplication licenses the halving and is
      carried by anchor.linear-algebra's contract, not re-argued here. S2 yes — it takes an
      already-correct linear recurrence and reduces evaluation from O(n * k) to O(k^3 log n) by
      binary-exponentiating the transfer matrix, without changing what any state means. This is the
      defining CL-4 case where n is too large to iterate but the state is small.
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Collapse n sequential DP steps into log n matrix multiplications by exponentiating the transfer
      matrix, making a recurrence with n up to 10^18 affordable. What a learner acquires is the cost
      reduction: the recurrence, its states, and its answers are unchanged; only the number of times
      it must be stepped through moves from linear to logarithmic.
    prerequisites:
