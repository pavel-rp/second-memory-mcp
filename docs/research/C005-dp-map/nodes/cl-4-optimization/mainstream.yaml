      - "The exotic-optimization tail"
    note: >-
      CL-4 is ONE cluster. This split is a work split for one-PR sizing, per D-F4 §2.1 and the
      header of this file. manifest.yaml registers both files under the single CL-4 id and OUT-6
      counts four clusters, not five. Nothing in this file describes frontier.yaml as a cluster.

  # ---------------------------------------------------------------------------
  # The two prerequisite kinds, kept distinct — the NEU-937 defining requirement
  # ---------------------------------------------------------------------------
  prerequisite_disposition:
    drawn_onto_registered_boundary_anchors:
      - anchor: "anchor.convex-hull-envelope-geometry@1.0.0"
        drawn_from:
          - "cl-4.linear-transition-envelope-form"
          - "cl-4.convex-hull-trick-monotonic"
          - "cl-4.cht-monotonicity-precondition-proof"
          - "cl-4.li-chao-tree-dp-application"
      - anchor: "anchor.li-chao-tree@1.0.0"
        drawn_from:
          - "cl-4.li-chao-tree-dp-application"
      - anchor: "anchor.segment-tree@1.0.0"
        drawn_from:
          - "cl-4.li-chao-tree-dp-application"
      - anchor: "anchor.linear-algebra@1.0.0"
        drawn_from:
          - "cl-4.linear-recurrence-matrix-form"
          - "cl-4.matrix-exponentiation-dp"
          - "cl-4.construct-transfer-matrix"
          - "cl-4.implement-modular-matrix-power"
      - anchor: "anchor.modular-arithmetic@1.0.0"
        drawn_from:
          - "cl-4.matrix-exponentiation-dp"
          - "cl-4.implement-modular-matrix-power"
    declared_optimized_family_attachments:
      - to_name: "Formulate a 1D sequence DP"
        to_cluster: "CL-1"
        target_verified_present: true
        note: >-
          CL-1 (NEU-934) merged while this PR was open, so this target's id was checked against
          the real file rather than left as a prediction: CL-1 mints no single "Linear-sequence DP"
          node — it splits the shape into cl-1.linear-sequence-dp-1d (knowledge) and
          cl-1.formulate-1d-sequence-dp (skill), plus 2D counterparts. The skill node is the correct
          target: every rationale below asserts the learner must be ABLE TO FORMULATE the recurrence,
          which is that node exactly. STILL DECLARED, NOT DRAWN — a sibling cluster's node is a
          cross_cluster_attachment regardless of whether its file happens to exist yet (schema V-7
          prohibits any prerequisites.* target in a different non-root cluster, and edges are
          SUB-12's to realize in edges/cross-cluster.yaml). Verifying the id only makes SUB-12's
          resolution exact instead of fuzzy; it does not license drawing the edge.
        declared_by:
          - "cl-4.recognize-envelope-structured-transition"
          - "cl-4.convex-hull-trick-monotonic"
          - "cl-4.li-chao-tree-dp-application"
          - "cl-4.monotonic-queue-optimization"
          - "cl-4.matrix-exponentiation-dp"
          - "cl-4.select-mainstream-optimization"
      - to_name: "Interval DP"
        to_cluster: "CL-2"
        declared_by:
          - "cl-4.knuth-yao-optimization"
          - "cl-4.divide-and-conquer-optimization"
      - to_name: "Partition DP (splitting a sequence into k parts)"
        to_cluster: "CL-2"
        declared_by:
          - "cl-4.divide-and-conquer-optimization"
      - to_name: "Bounded knapsack DP"
        to_cluster: "CL-2"
        declared_by:
          - "cl-4.monotonic-queue-optimization"
      - to_name: "Automaton DP (including Aho-Corasick DP)"
        to_cluster: "CL-3"
        declared_by:
          - "cl-4.matrix-exponentiation-dp"
    assertion: >-
      Every sanctioned non-DP prerequisite above is DRAWN directly onto a registered anchor at its
      pinned version. Every optimized-family prerequisite is DECLARED as a cross-cluster attachment
      with status "declared". NO cross-cluster prerequisite and NO non-DP prerequisite is faked as a
      prerequisites.roots edge anywhere in this file. Root edges in this file are drawn only onto the
      eight frozen cl-1.root.* nodes, per D-S4.
    no_ar_1_requests_filed: >-
      Every non-DP prerequisite this file needed was already registered. Route AR-1 was not required
      and no anchor was invented locally.

  # ---------------------------------------------------------------------------
  # Coverage status (OUT-7 owns the verdict; this records the mapper's position)
  # ---------------------------------------------------------------------------
  coverage_status:
    per_node: "unaudited on every node — OUT-7 (SUB-9..11) owns the verdict."
    mapper_position: >-
      The five technique areas the NEU-937 spec enumerates are each mapped as MULTIPLE typed nodes
      rather than one node per technique name, per schema §1.1 — 23 nodes over 5 technique areas.
      Topic volume is not claimed as coverage: the claim this file makes is that each area's
      separately-acquired and separately-failed abilities are separate nodes, and that every chain
      bottoms out on the frozen floor or a registered anchor.
    skill_types_instantiated:
      - "optimization (S2) — 6 nodes: the cluster's defining type"
      - "implementation (S6) — 3 nodes"
      - "proof (S1) — 3 nodes"
      - "transfer (S4) — 3 nodes"
      - "procedural (S7) — 2 nodes"
      - "strategic (S5) — 1 node"
    knowledge_nodes: 5
    skill_types_not_instantiated_here:
      - "debugging (S3)"
      - "conceptual (S8)"
    skill_type_note: >-
      Recorded for SUB-9's eight-skill-type union-completeness check: this file does not instantiate
      S3 or S8, and does not claim to. Per the NEU-937 brief the union is completed across the map,
      with CL-1 (NEU-934) covering the types this cluster does not exercise. No node was retyped to
      manufacture a union — a forced type would be a worse defect than a recorded absence.

  # ---------------------------------------------------------------------------
  # Residual exclusions — every material one carries a rationale
  # ---------------------------------------------------------------------------
  residual_exclusions:

    - id: "RX-1"
      excluded: "SOS DP (sum-over-subsets / zeta-Moebius transform)"
      status: "contested — carried, not smoothed"
      contested_by: ["CL-3"]
      ledger_ref: "D-F4a (NEU-932), live per 04_family-cluster-partition.md §4.2"
      rationale: >-
        NOT mapped in this file, and NOT claimed. Two facts are in tension and both are recorded
        rather than reconciled locally. (a) D-F4 §3.2 row 79 and §4.2 adjudicate SOS DP to CL-4 by
        cascade order, logging it D-F4a PROVISIONAL with CL-3's counter-claim (the mask encoding is
        the real contribution) LIVE and challengeable by SUB-5 via U4. (b) The NEU-937 spec-of-record
        enumerates this sub-task's desired outcome as exactly five technique areas, and SOS DP is not
        among them; the current working assignment places it with CL-3 (NEU-936). This file therefore
        neither maps SOS DP nor asserts it is out of CL-4: mapping it would be a silent claim over a
        live dispute and a scope expansion beyond the spec, while asserting it away would smooth the
        dispute the charter forbids smoothing. The D-F4a dispute stands exactly as logged.
      owner: "D-F4a adjudication (NEU-932) — resolvable by SUB-5's U4 challenge or by SUB-12/OUT-7"
      action_if_unresolved: >-
        A coverage finding for OUT-7 if no cluster mapped it. Reported, never deleted.

    - id: "RX-2"
      excluded: "LIS in O(n log n) via a monotone structure"
      status: "excluded — assigned to CL-4 but not enumerated for SUB-6"
      rationale: >-
        D-F4 §3.2 row 70 assigns it to CL-4 and the file header lists it among this cluster's worked
        examples, but the NEU-937 spec-of-record does not enumerate it among SUB-6's five technique
        areas, and it is equally absent from SUB-13's frontier list. It is therefore a material
        residual exclusion of the CL-4 work split rather than of the cluster: the technique is
        CL-4's, but neither half's enumerated scope names it. Recorded with an owner rather than
        quietly absorbed into this file, because absorbing it would risk an id collision with
        SUB-13 in the shared CL-4 namespace and would exceed the spec's enumeration.
      owner: "SUB-12 / OUT-7 coverage audit — to assign to a CL-4 half or record as a gap"

    - id: "RX-3"
      excluded: "The family techniques these optimizations accelerate (CL-1/CL-2/CL-3 nodes)"
      status: "excluded by design — out of scope per the NEU-937 spec"
      rationale: >-
        Explicitly out of scope: the base DPs belong to sibling clusters by D-F4 §3.1's T1-first
        ordering. They are not excluded from the MAP — they are declared as cross-cluster attachment
        points (see prerequisite_disposition above) for SUB-12 to realize. Nothing is lost; the
        dependency is recorded as evidence, not dropped.

    - id: "RX-4"
      excluded: "The research-tier optimization frontier"
      status: "excluded by design — SUB-13 (NEU-938) owns it in frontier.yaml"
      rationale: >-
        Slope trick and variants, Lagrangian/Aliens trick, kinetic-segment-tree interplay,
        broken-profile / connection-profile DP, and the exotic tail are SUB-13's within the SAME
        cluster. Not a coverage gap and not a second cluster — a work split.

    - id: "RX-5"
      excluded: "Progression stages, difficulty values, JavaScript-materiality verdicts"
      status: "excluded by design — other sub-tasks own the values"
      rationale: >-
        difficulty_dimensions is {} on every node (the dimension SET itself is unresolved, INC-S3,
        owner SUB-7). javascript_materiality.assessed is false on every node; where this file has an
        observation it is recorded in `note` as an OBSERVATION and never as a verdict (owner SUB-8).
        coverage.status is "unaudited" on every node (owner OUT-7). Per schema §5.2 a consumer must
        not invent a value.

    - id: "RX-6"
      excluded: "Intra-cluster prerequisite edges from cl-4.select-mainstream-optimization into frontier.yaml's nodes"
      status: "excluded — unresolvable at map time, recorded as a gap"
      rationale: >-
        A complete selection skill would weigh slope trick and the Aliens trick alongside the five
        mainstream techniques. Those nodes are SUB-13's, being written concurrently, and per this
        file's header rule 2b they are INTRA-cluster (same CL-4 id) — so they may NOT be declared as
        cross-cluster attachments, and predicting their ids risks a namespace collision that the
        dependency audit would report. The edges are therefore omitted and recorded here rather than
        guessed. This is a named gap with an owner, not a defect to be discovered later.
      owner: "OUT-2 dependency audit / SUB-12 — to add the intra-cluster edges once both CL-4 files exist"

    - id: "RX-7"
      excluded: "Targeted prototypes of this cluster's graph structure"
      status: "excluded by design — charter Assumption #12"
      rationale: >-
        Prototypes run only where graph structure is genuinely uncertain, never on settled structure.
        The five mainstream optimizations are the Div1 canon: their prerequisite structure is
        well-attested across the D-F1 taxonomies and stable across references, and their cluster
        assignment is settled by D-F4's cascade with the single exception logged as RX-1. Prototyping
        settled structure is prohibited, so none was run. The genuinely uncertain claims in this file
        are the transfer nodes, and they carry that uncertainty per-node in `notes` rather than
        through a prototype that could not falsify them.

