  - id: "cl-4.linear-recurrence-matrix-form"
    name: "Linear recurrences in transfer-matrix form"
    node_kind: "knowledge"
    cluster: "CL-4"
    role: "technique"
    summary: >-
      The fact that a DP whose transition is a fixed linear combination of a bounded number of
      previous states can be written as repeated multiplication of a state vector by a constant
      transfer matrix, so the state after n steps is M^n applied to the initial vector. What a
      learner acquires is the identity between a recurrence and a matrix power — a true statement
      about the recurrence's algebraic shape, independent of any ability to exploit it.
    prerequisites:
