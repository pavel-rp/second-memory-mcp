  - id: "cl-4.implement-modular-matrix-power"
    name: "Implementing modular matrix exponentiation"
    node_kind: "skill"
    skill_type: "procedural"
    skill_type_rationale: >-
      Cascade stops at S7. S1 no. S2 no — the asymptotic win is established by
      cl-4.matrix-exponentiation-dp; this executes it. S3-S5 no. S6 vs S7 resolves to S7: binary
      exponentiation over a monoid — initialize to the identity, square the base, multiply when the
      bit is set — is a fixed routine whose steps do not vary with the problem. The matrix's contents
      vary; the exponentiation procedure does not, and it is the procedure this node names.
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Execute the standard binary-exponentiation routine over matrices under a modulus: identity
      initialization, square-and-multiply on the exponent's bits, and modular reduction inside the
      triple loop. What a learner acquires is a mechanical routine, performed identically every time,
      that turns a transfer matrix and an exponent into an answer.
    prerequisites:
      intra_cluster:
        - "cl-4.construct-transfer-matrix"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors:
        - "anchor.modular-arithmetic@1.0.0"
        - "anchor.linear-algebra@1.0.0"
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 6
      state_formulation_load: 1
      transition_derivation_load: 1
      proof_obligation_load: 0
      implementation_load: 2
      recognition_load: 1
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E2", "JS-E3", "JS-E5"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — this is the node that WRITES the modmul, and it is the densest
        concentration of JS-E2 in the map. The inner statement is `acc = (acc + a[i][k] *
        b[k][j]) % M`, executed O(d^3 log k) times. With M = 1e9+7 the product a[i][k] * b[k][j]
        reaches ~1e18, ~111x past 2^53, so in JavaScript it silently ROUNDS — returning a
        plausible wrong residue, on essentially every iteration, with no error. C++'s long long
        is exact and the line is written reflexively. Correct JavaScript needs one of two
        things, and the choice is a real trade-off a C++ author never makes: BigInt (correct,
        straightforward, and materially slower at d^3 log k multiplications in the hottest
        possible loop — JS-E3), or a SPLIT MULTIPLY that decomposes one operand around 2^26 so
        no partial product leaves the exact range, folding with Math.imul (fast, and easy to get
        subtly wrong). The addition fold is safe — accumulating d residues below M stays far
        under 2^53 IF reduced per step — so it is the multiplication alone that must be
        rewritten, which is exactly why the bug survives casual testing on small moduli. JS-E5
        also lands here: the matrix wants a flat Int32Array with i * d + j addressing rather
        than an array-of-arrays, in an O(d^3) loop. Directional on the performance component
        only (JS-U2); the correctness component is not directional.
      uncertainty: "JS-U2"
      mapper_note: >-
        Observation only: the inner multiply-accumulate requires exact products of two values
        below the modulus, which exceeds JavaScript's safe-integer range for typical 10^9+7
        moduli. Recorded for SUB-8; not a verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C2:R"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-937"
    aliases: ["binary exponentiation of matrices", "fast matrix power"]
    notes: >-
