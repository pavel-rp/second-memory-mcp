      transition_derivation_load: 2
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. That the optimal split point moves monotonically with the state
        index is a property of the cost function. Language-independent.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
