    - check: "4. No prerequisites.* entry points at a sibling cluster's node."
      result: "pass — every sibling-cluster prerequisite is in cross_cluster_attachments."
    - check: "5. No roots or boundary_anchors edge is a disguised cross-cluster or unregistered dependency."
      result: "pass — roots edges target only the eight frozen cl-1.root.* ids; anchor edges target only the five registered anchors at their pinned versions."
    - check: "6. Every cross_cluster_attachments entry has to_name, to_cluster, rationale, status declared."
      result: "pass — 11 attachments, all complete."
    - check: "7. attachment_id matches xc.<from>-><to_node>; from is the node's own id."
      result: "pass"
    - check: "8. difficulty_dimensions {}; javascript_materiality.assessed false; coverage.status unaudited."
      result: "pass on all 23 nodes"
    - check: "9. No node settled without a ledger entry; no node carries frozen: true."
      result: "pass — every node is provisional"
    - check: "10. All string enums quoted."
      result: "pass"
    - check: "11. Ids match the grammar and are cluster-namespaced; CL-4 shares a namespace with frontier.yaml."
