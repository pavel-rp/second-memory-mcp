        from: "cl-4.matrix-exponentiation-dp"
        to_cluster: "CL-1"
        to_node: "cl-1.formulate-1d-sequence-dp"
        to_name: "Formulate a 1D sequence DP"
        relation: "requires"
        rationale: >-
          The optimization is parasitic on an already-correct linear-sequence recurrence with a fixed
          transition; a learner cannot acquire it without first being able to formulate that
          recurrence. Per D-F4 §3.2 the base DP is CL-1's node and the acceleration is CL-4's, while
          its non-DP prerequisite terminates on a boundary anchor rather than a cluster.
        confidence: "named"
        status: "declared"
      - attachment_id: "xc.cl-4.matrix-exponentiation-dp->cl-3.automaton-dp"
        from: "cl-4.matrix-exponentiation-dp"
        to_cluster: "CL-3"
        to_node: "cl-3.automaton-dp"
        to_name: "Automaton DP (including Aho-Corasick DP)"
        relation: "requires"
        rationale: >-
          A second standard base, declared because it is materially different from the CL-1 case:
          counting length-n strings avoiding a pattern set is an automaton DP (CL-3 per D-F4 §3.2)
          whose transition matrix is the automaton's adjacency matrix, exponentiated to reach large n.
          Conjectured because this file cannot see whether SUB-5 mints the node under this name.
        confidence: "conjectured"
        status: "declared"
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 4
      state_formulation_load: 1
      transition_derivation_load: 5
      proof_obligation_load: 1
      implementation_load: 2
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E2", "JS-E3"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — matrix exponentiation is essentially always done UNDER A
        MODULUS, and that is where JavaScript breaks. The technique's whole purpose is advancing
        a recurrence 1e18 steps in O(d^3 log k) — and a count advanced 1e18 steps is
        astronomically large, so the answer is ALWAYS requested modulo a prime (typically
        1e9+7). Every cell of every matrix product is therefore a sum of d modular products, and
        each product of two residues below 1e9+7 reaches ~1e18: ~111x past 2^53. C++'s long long
        is exact there and the C++ author writes the triple loop without a thought. JavaScript
        silently rounds every one of them, so the matrix power is wrong from the first
        multiplication and stays plausible throughout. Note the compounding that makes this
        worse than a single modmul: the technique performs O(d^3 log k) multiplications, so
        there is no input small enough for the bug to hide — it fires on essentially every cell.
        Correct JavaScript requires BigInt (JS-E3, costly at d^3 log k multiplications) or a
        split multiply. The realization detail is on cl-4.implement-modular-matrix-power
        (JS-D2); recorded here too because the modulus is constitutive of THIS node — the
        technique does not exist in the map without it.
      mapper_note: >-
        Observation only: entries are multiplied under a modulus and products exceed 2^53, so
        JavaScript Numbers cannot hold intermediate results exactly. Recorded for SUB-8; not a
        verdict.
