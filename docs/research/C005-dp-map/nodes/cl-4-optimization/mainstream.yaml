    node_kind: "knowledge"
    cluster: "CL-4"
    role: "technique"
    summary: >-
      The property that the argmin of a transition, opt(i, j), is non-decreasing in j for a
      fixed layer i. What a learner acquires is the fact itself and what it licenses: that the
      search for the optimal split of one state constrains the search range of its neighbours,
      so the total work over a layer telescopes. The recurrence's meaning is untouched; this is
      a fact about where its optima sit.
