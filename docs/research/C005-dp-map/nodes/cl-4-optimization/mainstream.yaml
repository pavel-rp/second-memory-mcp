  - id: "cl-4.convex-hull-trick-monotonic"
    name: "Convex Hull Trick (monotonic slopes and queries)"
    node_kind: "skill"
    skill_type: "optimization"
    skill_type_rationale: >-
      Cascade stops at S2. S1 no — the monotonicity argument that licenses the deque pops
      is a real obligation but is a SEPARATE node (cl-4.cht-monotonicity-precondition-proof,
      typed "proof"); this node is the application, not the argument. S2 yes — it takes an
      already-correct O(n^2) linear-sequence recurrence and reduces evaluation to amortized
      O(n) by maintaining only the lower envelope, without changing what any dp state means.
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Maintain the lower envelope of the line family incrementally in a deque, discarding
      lines that can never again be optimal, so each transition is answered in amortized
      constant time when both the inserted slopes and the query points are monotone. What a
      learner acquires is the cost reduction itself — the recurrence, its states, and its
      answers are identical to the quadratic version.
    prerequisites:
      intra_cluster:
        - "cl-4.linear-transition-envelope-form"
        - "cl-4.recognize-envelope-structured-transition"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors:
        - "anchor.convex-hull-envelope-geometry@1.0.0"
    cross_cluster_attachments:
      - attachment_id: "xc.cl-4.convex-hull-trick-monotonic->cl-1.formulate-1d-sequence-dp"
        from: "cl-4.convex-hull-trick-monotonic"
        to_cluster: "CL-1"
        to_node: "cl-1.formulate-1d-sequence-dp"
        to_name: "Formulate a 1D sequence DP"
        relation: "requires"
        rationale: >-
          The optimization is parasitic on a linear-sequence DP that must already be
          correct; a learner cannot acquire it without first being able to formulate that
          recurrence. Per D-F4 §3.1 the base DP is CL-1's and the optimization is CL-4's.
          Declared, not drawn — SUB-3's technique nodes do not exist yet.
        confidence: "named"
        status: "declared"
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 5
      state_formulation_load: 1
      transition_derivation_load: 5
      proof_obligation_load: 1
      implementation_load: 3
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E2"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — CHT's correctness rests on a cross-multiplication that overflows
        2^53, and this is invisible unless stated. The hull is maintained by a 'bad' test that
        asks whether line 2 is ever optimal between lines 1 and 3. The division-free form — the
        one competitive code uses, precisely to avoid floating-point — is a
        CROSS-MULTIPLICATION: (b3 - b1) * (m1 - m2) vs (b2 - b1) * (m1 - m3). With slopes and
        intercepts at the 1e9 scale these problems are posed at, each product reaches ~1e18,
        which is ~111x past 2^53. C++ evaluates it in long long (exact to ~9.2e18) or reaches
        for __int128 when even that is tight — the C++ author's whole reason for writing the
        test this way is that integer arithmetic is EXACT, and in C++ it is. In JavaScript the
        identical expression silently ROUNDS, so the comparison returns the wrong boolean, so
        the wrong line is popped, so the hull is silently malformed and the DP returns a wrong
        answer with no error and no NaN. The irony is exact: the division-free form is chosen to
        escape floating point, and in JavaScript it lands back in it. A correct JavaScript CHT
        must do the comparison in BigInt, or split the products, or accept a floating-point test
        with an epsilon — a decision the C++ author never faces.
      mapper_note: >-
        Observation only: the "bad line" test compares cross-products that overflow 64-bit in
        adversarial cases; JavaScript's Number cannot represent those exactly and BigInt changes
        the constant factor. Flagged for SUB-8; not a verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C2:Z", "C6:line_add_get_min"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-937"
    aliases: ["CHT", "convex hull optimization", "monotone CHT"]
    notes: >-
      Its envelope-geometry prerequisite is DRAWN onto the registered anchor
      (anchor.convex-hull-envelope-geometry), while its optimized-family prerequisite is
      DECLARED. Neither is faked as a root edge. This node is therefore
      complete-but-pending-integration before SUB-12 runs, not broken.

  - id: "cl-4.cht-monotonicity-precondition-proof"
    name: "Proving the Convex Hull Trick's monotonicity preconditions"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1. S1 yes — the contribution is establishing by argument that a line
      popped from the envelope can never again be optimal, and that monotone slopes plus
      monotone queries make the pointer sweep amortized O(1). This is a correctness/optimality
      obligation discharged by argument, which is S1's defining contribution, and the cascade
      stops at the first match, so S2 is never reached even though the surrounding technique
      is an optimization.
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Argue that the deque maintenance is sound: that the discarded line is dominated on the
      whole remaining query range, that the envelope stays convex under insertion, and that
      monotonicity of the query sequence licenses a non-decreasing pointer rather than a
      binary search. What a learner acquires is the ability to justify the speedup, not to
      perform it — and to notice when the preconditions fail and Li Chao is required instead.
    prerequisites:
      intra_cluster:
        - "cl-4.linear-transition-envelope-form"
      roots:
        - "cl-1.root.optimal-substructure"
      boundary_anchors:
        - "anchor.convex-hull-envelope-geometry@1.0.0"
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-2"
      entry_gate: "gate-c"
      prerequisite_depth: 2
      state_formulation_load: 1
      transition_derivation_load: 2
      proof_obligation_load: 3
      implementation_load: 1
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. Proving that slopes are inserted monotonically and queries arrive
        monotonically is an argument about the DP's structure, discharged before any code
        exists. Deliberate boundary: the precondition being PROVEN does not stop JS-E2 from
        breaking the test that exploits it (cl-4.convex-hull-trick-monotonic) — a correct
        precondition and a correct implementation are different obligations and the map should
        keep them apart.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-937"
    notes: >-
      Split from cl-4.convex-hull-trick-monotonic per schema §1.1: a learner who can run the
      deque and a learner who can prove the pops sound are demonstrably different, and they
      fail separately. Typing one node both "optimization" and "proof" is prohibited.

  - id: "cl-4.li-chao-tree-dp-application"
    name: "Li Chao tree for non-monotone envelope DP"
    node_kind: "skill"
    skill_type: "optimization"
    skill_type_rationale: >-
      Cascade stops at S2. S1 no — the tree's correctness argument is standard and is carried
      by the anchor's contract, not re-argued here. S2 yes — it takes the same already-correct
      recurrence cl-4.convex-hull-trick-monotonic accelerates and reduces its cost to
      O(n log C) in the case where the monotonicity preconditions fail, without changing what
      any state means. Distinct node rather than a variant field, because it is acquired and
      failed separately from the deque form and rests on a different registered anchor.
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Answer envelope queries with a Li Chao segment tree when slopes arrive in arbitrary order
      or query points are not monotone — the case that defeats the deque. What a learner acquires
      is the ability to keep the cost reduction when the CHT's preconditions do not hold, paying
      a log factor to drop the monotonicity requirement.
    prerequisites:
      intra_cluster:
        - "cl-4.linear-transition-envelope-form"
        - "cl-4.cht-monotonicity-precondition-proof"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors:
        - "anchor.li-chao-tree@1.0.0"
        - "anchor.segment-tree@1.0.0"
        - "anchor.convex-hull-envelope-geometry@1.0.0"
    cross_cluster_attachments:
      - attachment_id: "xc.cl-4.li-chao-tree-dp-application->cl-1.formulate-1d-sequence-dp"
        from: "cl-4.li-chao-tree-dp-application"
        to_cluster: "CL-1"
        to_node: "cl-1.formulate-1d-sequence-dp"
        to_name: "Formulate a 1D sequence DP"
        relation: "requires"
        rationale: >-
          Same parasitism as the deque form: the Li Chao tree accelerates an already-correct
          linear-sequence recurrence, which is CL-1's node. Declared, not drawn.
        confidence: "named"
        status: "declared"
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 4
      state_formulation_load: 1
      transition_derivation_load: 4
      proof_obligation_load: 1
      implementation_load: 4
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E2"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — the same 2^53 ceiling as CHT, reached through a different door.
        Li Chao trees exist to drop CHT's monotonicity preconditions, and they do it by
        COMPARING LINE VALUES at a node's midpoint and endpoints: m * x + b, evaluated directly.
        With slopes at 1e9 and query coordinates at 1e9 — the scale these problems are posed at,
        because a Li Chao tree is reached for precisely when the coordinates are large and
        unsorted — the product m * x reaches ~1e18, ~111x past 2^53. C++ evaluates it in long
        long, exactly. JavaScript silently rounds, so the comparison at the midpoint returns the
        wrong answer, so the wrong line is kept in the subtree, so the tree is silently wrong.
        Note this is WORSE than CHT's case in one respect: Li Chao's whole selling point is that
        it needs no preconditions and is therefore the 'safe' choice a learner is told to reach
        for when CHT's assumptions are unclear — so the JavaScript author is steered toward it
        and then broken by it, silently. Correct JavaScript requires BigInt comparison or a
        split multiply for the line evaluation.
    coverage:
      status: "unaudited"
      corpus_refs: ["C6:line_add_get_min", "C6:segment_add_get_min"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-937"
    aliases: ["Li Chao segment tree", "LiChao tree"]
    notes: >-
      Draws onto THREE registered anchors. anchor.li-chao-tree is registered separately from
      anchor.segment-tree deliberately (boundary-register.yaml), and both are drawn because
      the structure's contract and its segment-tree substrate are distinct sanctioned
      terminals. None of the three is a cross-cluster declaration.

  - id: "cl-4.implement-cht-deque-and-li-chao"
    name: "Implementing CHT and Li Chao correctly"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6. S1 no — nothing is argued. S2 no — the cost reduction is already
      established by cl-4.convex-hull-trick-monotonic; this node makes the chosen form actually
      run, which schema §2's S2 exclusion ("making it run rather than run faster") routes away
      from S2. S3 no — it is not triggered by a symptom. S4 no, S5 no — the form is already
      chosen. S6 yes — and not S7, because the steps genuinely vary with the problem: whether
      the comparison can stay in integers, whether the query is min or max, and whether the
      envelope is upper or lower are judgments about THIS recurrence (schema §2.1).
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Turn a chosen envelope method into working code: the integer-safe "is this line
      unnecessary" comparison, min-vs-max and lower-vs-upper envelope orientation, deque
      boundary conditions at size 0/1, and Li Chao's coordinate range and recursion. What a
      learner acquires is the facility to realize the method without the off-by-one and
      precision defects that make it silently wrong on a subset of cases.
    prerequisites:
      intra_cluster:
        - "cl-4.convex-hull-trick-monotonic"
        - "cl-4.li-chao-tree-dp-application"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 6
      state_formulation_load: 1
      transition_derivation_load: 2
      proof_obligation_load: 0
      implementation_load: 5
      recognition_load: 1
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E2", "JS-E8", "JS-E5"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — the node that WRITES both structures, so it carries the full
        weight of both hazards plus a container one. JS-E2 is the blocking effect and it is
        described on cl-4.convex-hull-trick-monotonic (the hull's cross-multiplied bad test) and
        cl-4.li-chao-tree-dp-application (the midpoint line evaluation); both overflow 2^53 at
        the 1e9 operand scale these techniques are posed at, both silently round rather than
        wrapping, and both must be written in BigInt or a split multiply. JS-E8 is the second,
        independent finding and it is specific to this node: CHT's monotonic form is written in
        terms of a DEQUE — lines pushed at the back, popped from both ends — and JavaScript has
        no deque. Array.prototype.shift() is a front removal on a structure that is not a deque,
        so the C++ idiom deque.pop_front() has no faithful one-line translation; the JavaScript
        realization is a HEAD/TAIL INDEX PAIR over a preallocated typed array, which also
        collects JS-E5's payoff. C++ gets std::deque from the stdlib and writes the algorithm
        directly. A downstream agent must write the container before it can write the technique.
      mapper_note: >-
        Observation only: this is the node where a JavaScript materiality question is most
        likely to be real — the integer-safe comparison has no direct Number equivalent.
        Recorded for SUB-8; this file asserts no verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C6:line_add_get_min"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-937"

