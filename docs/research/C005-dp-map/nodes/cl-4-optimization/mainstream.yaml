  - id: "cl-4.monotonic-deque-maintenance"
    name: "Maintaining a monotonic deque"
    node_kind: "skill"
    skill_type: "procedural"
    skill_type_rationale: >-
      Cascade stops at S7. S1 no. S2 no — the deque routine reduces no DP's cost by itself; it is a
      subroutine that cl-4.monotonic-queue-optimization exploits, and typing it S2 would conflate
      the idiom with the acceleration it enables. S3-S5 no. S6 vs S7 is the live question and it
      resolves to S7: the routine — pop the back while it is dominated, push, pop the front while it
      is out of window — does not vary with the problem. Only the comparison direction changes, and
      that is a parameter of the idiom, not a judgment about this recurrence (schema §2.1).
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Execute the fixed routine that keeps a deque's contents monotone so its front is always the
      window's extremum: evict dominated elements from the back on insert, evict expired elements
      from the front on advance. What a learner acquires is a mechanical routine, executed the same
      way every time, whose amortized O(1) cost is what the surrounding optimization spends.
    prerequisites:
      intra_cluster:
        - "cl-4.sliding-window-transition-form"
      roots: []
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-2"
      entry_gate: "gate-c"
      prerequisite_depth: 2
      state_formulation_load: 1
      transition_derivation_load: 1
      proof_obligation_load: 0
      implementation_load: 3
      recognition_load: 1
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E8", "JS-E5"]
      severity: "idiom-shift"
      rationale: >-
        MATERIAL — the node is named for a container JavaScript does not have. Maintaining a
        monotonic deque means pushing at the back, popping dominated elements from the back, and
        evicting expired elements from the FRONT. C++'s std::deque does all three in O(1) and
        the algorithm is written directly in its terms. JavaScript has no deque:
        Array.prototype.shift() is a front removal, but on an Array — it is not a deque
        operation, it is a re-index of the backing store in the general case, and its behaviour
        is an engine optimization rather than a guaranteed O(1). So the faithful JavaScript
        realization is a RING BUFFER OR HEAD/TAIL INDEX PAIR over a preallocated typed array:
        head and tail integers, push/pop as index arithmetic, no allocation in the loop. That is
        a container the author must write before writing the technique. It is not merely faster
        than the shift()-based transcription — it is what makes the O(1) amortized bound the
        technique's whole analysis rests on actually hold. JS-E5 rides along: the buffer wants
        an Int32Array. Recorded as idiom-shift rather than performance because the ARTIFACT
        differs, not just its constant.
      mapper_note: >-
        Observation only: JavaScript has no native deque; array shift() is O(n) and would
        silently destroy the amortized bound, so an index-based ring buffer is typically
        required. Recorded as an observation for SUB-8 — this file asserts no materiality
        verdict.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-937"
    aliases: ["monotonic queue", "sliding-window maximum deque"]
    notes: >-
      This node's `roots` list is legitimately empty: it is a data-structure routine whose DP
      grounding is inherited through its intra-cluster prerequisite
      cl-4.sliding-window-transition-form, which draws onto the roots. The chain bottoms out on the
      frozen floor; it does not stop here. Recorded explicitly so the floor audit does not read the
      empty list as an unexplained jump.

