  - id: "cl-4.linear-transition-envelope-form"
    name: "Linear transitions as a line envelope"
    node_kind: "knowledge"
    cluster: "CL-4"
    role: "technique"
    summary: >-
      The structural fact that a transition of the form dp[i] = min_j (m_j * x_i + c_j)
      is a pointwise minimum over a family of lines, and is therefore the value of that
      family's lower envelope evaluated at x_i. What a learner acquires is the identity
      between an algebraic transition shape and a geometric object — the recurrence is
      unchanged and still means exactly what it meant; only its readability as geometry
      is new. This is the fact every Convex Hull Trick and Li Chao node stands on.
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors:
        - "anchor.convex-hull-envelope-geometry@1.0.0"
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-1"
      entry_gate: "gate-a"
      prerequisite_depth: 1
      state_formulation_load: 1
      transition_derivation_load: 3
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. That a transition of the form dp[j] + a[i]*b[j] is a line evaluated
        at a query point — and therefore that the family of transitions is a line envelope — is
        the geometric insight. Language-independent. The arithmetic that evaluates the envelope
        is where JavaScript binds, and that verdict is on the optimization and implementation
        nodes (JS-D2).
      mapper_note: >-
        Observation only: the envelope identity is language-neutral, but its exploitation in
        JavaScript inherits IEEE-754 doubles for slope/intercept comparisons where C++ solutions
        use 64-bit integers. Recorded as an observation for SUB-8; no verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C2:Z"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-937"
    aliases: ["line-envelope form of a DP transition"]
    notes: >-
      Knowledge node, so no skill_type — per schema §1, absent rather than null.
      This node exists separately from cl-4.convex-hull-trick-monotonic because the
      fact is acquirable and testable without any ability to exploit it (schema §1.1).

