  - id: "cl-4.slope-trick-convex-function-representation"
    name: "Slope-trick representation of a convex piecewise-linear DP value function"
    node_kind: "knowledge"
    cluster: "CL-4"
    role: "technique"
    summary: >-
      A convex piecewise-linear function on the integers is determined completely by
      its minimum value together with the multiset of its slope-change breakpoints —
      one breakpoint repeated k times means the slope steps by k there. This is the
      fact slope trick rests on: the DP's value function, which naively costs O(n) to
      store per state, collapses to two breakpoint multisets (left of the minimum,
      right of the minimum) plus a scalar. A learner acquires the representation and
      the correspondence between it and the function it denotes — not yet how to
      maintain it (cl-4.slope-trick-application) and not yet why the DP's transitions
      preserve convexity (cl-4.slope-trick-convexity-preservation-proof).
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors:
        - "anchor.convex-hull-envelope-geometry@1.0.0"
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-1"
      entry_gate: "gate-a"
      prerequisite_depth: 1
      state_formulation_load: 5
      transition_derivation_load: 2
      proof_obligation_load: 1
      implementation_load: 2
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: false
      note: >-
        Observation only, not a verdict: the representation is a multiset of integers;
        JavaScript has no built-in multiset or heap, so a realization must supply one.
        Recorded for SUB-8; no materiality claim made here.
    coverage:
      status: "unaudited"
      corpus_refs: ["C5"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-938"
    aliases: ["slope trick function representation", "breakpoint multiset representation"]
    notes: >-
      The boundary-anchor edge onto anchor.convex-hull-envelope-geometry@1.0.0 is
      drawn for the facts squarely inside that anchor's registered scope: a convex
      piecewise-linear function IS the upper/lower envelope of a family of lines, and
      the anchor's scope names "lower/upper envelopes of families of lines,
      convex-hull construction and its monotonicity properties". The SEPARATE fact
      that slope trick also needs — that (min,+)-convolving two convex piecewise-linear
      functions MERGES their breakpoint multisets — is NOT envelope geometry and is
      NOT registered. AR-1-b is filed for it (see `ar1_requests`); it is recorded here
      rather than laundered into this anchor edge or into a root edge.

  - id: "cl-4.recognize-hidden-convexity-for-slope-trick"
    name: "Recognizing hidden convexity that licenses slope trick"
    node_kind: "skill"
    skill_type: "transfer"
    skill_type_rationale: >-
      Cascade stops at S4. S1 no — the contribution is spotting the applicability, not
      arguing the convexity holds (that obligation is a separate node,
      cl-4.slope-trick-convexity-preservation-proof, typed "proof"). S2 no — nothing is
      made faster by the act of recognition itself; the acceleration is
      cl-4.slope-trick-application. S3 no — recognition runs before any symptom exists.
      S4 YES, and this is the defining feature of the node: slope trick's precondition
      is never stated in a problem. The statement says "minimise the total cost of
      making the sequence non-decreasing"; nothing in it mentions convexity, piecewise
      linearity, or a value function. The learner must see a known technique under a
      surface that looks unrelated to it — precisely S4's test — rather than choose
      among techniques whose applicability is already apparent (which would be S5).
      TRANSFER-TO-DP UNCERTAINTY IS EXPLICIT AND CARRIED (see `notes`).
    cluster: "CL-4"
    role: "technique"
    summary: >-
      The ability to look at a problem statement that mentions no convexity and
      recognize that its DP value function is convex piecewise-linear in the state
      parameter — the precondition slope trick needs and the reason slope trick is
      hard to reach for rather than hard to run. A learner acquires the cues (costs of
      the form |x - a|, monotonicity constraints being imposed on a sequence, an
      objective that is a sum of convex terms) and the counter-cues that mean the
      value function is not convex and slope trick is unavailable.
    prerequisites:
      intra_cluster:
        - "cl-4.slope-trick-convex-function-representation"
      roots:
        - "cl-1.root.recognize-optimal-substructure"
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
