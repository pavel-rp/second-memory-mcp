  # ---- KIND C: the exotic tail, bounded by NEU-887's materiality rule ----
  # These ARE SUB-13's on the partition (T1 fires, or would). They are excluded on
  # MATERIALITY. Each is the kind of name a maximalist file is tempted to list
  # without a chain — which is precisely the charter's #1 anti-goal, "topic volume is
  # never coverage". Listing them HERE, as bounded exclusions with rationales and
  # triggers, is the honest form of the maximalist claim; listing them as nodes with
  # no justified prerequisite chain would be the dishonest one.

  - id: "RX-7"
    technique: >-
      Slope-trick generalizations to L♮-convex / M-convex functions (discrete convex
      analysis, Murota's programme)
    kind: "exotic-tail"
    excluded_from: "CL-4 frontier (SUB-13)"
    rationale: >-
      This is the genuine mathematical frontier that slope trick sits at the foot of:
      slope trick is the one-dimensional convex piecewise-linear case of a much larger
      theory of discrete convexity, and the theory's higher-dimensional cases (L♮-convex
      and M-convex function minimisation) are real, published, and strictly more general.
      T1 would fire. It is not mapped.
      MATERIALITY: no instance exists in any D-F2 corpus (C1..C6). The theory's
      competitive-programming footprint IS the one-dimensional case, and that case is
      mapped in full here (six nodes). Mapping the general theory would add nodes that no
      learner path in this charter's audience line reaches, expanding the graph and the
      audit surface with material that is literature-real but learner-unreal — which is
      the charter's named High risk realized precisely. NEU-887's rule bounds the map to
      what the audience line makes material; this is where it bites hardest and where
      SUB-13 chose the bound over the breadth, explicitly, rather than by omission.
      This is the single most defensible place to draw the maximalist line, and it is
      drawn here deliberately: one step past slope trick's competitive instance and one
      step short of a mathematics curriculum.
    revision_trigger: >-
      A problem in C4 or C5 is found requiring L♮- or M-convex minimisation beyond the
      1-D convex piecewise-linear case. Then SUB-13's scope acquires it and the scope
      boundary takes a MINOR version bump.
    owner: "SUB-13; adjudicated by OUT-7 (the coverage audit)"

  - id: "RX-8"
    technique: >-
      Multi-parameter Lagrangian relaxation (two or more simultaneous penalty
      parameters / "multi-dimensional Aliens trick")
    kind: "exotic-tail"
    excluded_from: "CL-4 frontier (SUB-13)"
    rationale: >-
      The natural generalization of the mapped 1-D Aliens trick: relax k constraints at
      once and search a k-dimensional lambda. T1 would fire. It is not mapped.
      MATERIALITY: no instance in C1..C6. It is also materially harder in a way that is
      not a matter of degree — the convexity hypothesis the 1-D case rests on generalizes
      to a multi-dimensional convexity condition that is both harder to establish and
      routinely false, and the search is no longer a binary search. Mapping it would mean
      mapping a technique whose applicability conditions no corpus instance exercises.
      The 1-D case IS mapped in full (five nodes, including the tie-breaking and
      debugging nodes where the real difficulty lives).
    revision_trigger: "A C4/C5 problem requiring a multi-parameter relaxation is identified."
    owner: "SUB-13; adjudicated by OUT-7"

  - id: "RX-9"
    technique: >-
      Sub-quadratic (min,+) convolution results for NON-convex sequences — e.g. the
      O(n^2 / log n)-class bounds and the fine-grained-complexity conditional lower
      bounds around them
    kind: "exotic-tail"
    excluded_from: "CL-4 frontier (SUB-13)"
    rationale: >-
      T1 would fire — these accelerate an already-correct knapsack-style convolution
      transition. Not mapped.
      MATERIALITY: these are fine-grained-complexity RESEARCH RESULTS, not competitive
      techniques. Their constant factors and word-RAM assumptions make them unusable
      inside a contest, no D-F2 corpus contains an instance, and their practical content
      for this charter's audience is a NEGATIVE result (the conditional lower bound
      saying not to look for a fast general algorithm). Mapping them would import a
      complexity-theory frontier into a competitive-DP map — the clearest case in this
      register of breadth that expands the audit surface while reaching no learner.
      NOTE: this is distinct from AR-1-b, which requests an anchor for the (min,+)
      operator's CONVEX-case algebra — a fact slope trick genuinely needs. The convex
      case is mapped; the general-case fast algorithms are not.
    revision_trigger: >-
      A competitive instance appears, or NEU-887's audience line is widened to include
      complexity-theoretic content.
    owner: "SUB-13; adjudicated by OUT-7"

  - id: "RX-10"
    technique: >-
      Ranked-zeta / fast subset convolution machinery beyond SOS (Björklund–Husfeldt–
      Kaski–Koivisto subset convolution in O(2^n n^2))
    kind: "exotic-tail"
    excluded_from: "CL-4 frontier (SUB-13)"
    rationale: >-
      T1 would fire — it accelerates an already-correct subset-indexed transition.
      Not mapped, on two grounds. MATERIALITY: its competitive footprint is essentially
      the SOS/zeta–Möbius case, which is RX-3's contested node and in any case
      canon-adjacent rather than research-tier. The ranked-zeta refinement appears in
      no D-F2 corpus instance. SCOPE: it is also downstream of RX-3's unresolved D-F4a
      dispute — mapping a refinement of a node whose cluster is contested would compound
      the conflict rather than record it.
    revision_trigger: >-
      RX-3's D-F4a dispute is adjudicated AND a C4/C5 instance requiring ranked zeta is
      identified.
    owner: "SUB-13; adjudicated by OUT-7"

  - id: "RX-11"
    technique: >-
      Composed frontier techniques — e.g. Aliens trick wrapping a D&C-optimized inner
      DP; kinetic/Li Chao hybrids; offline-dynamic-connectivity-style DP rebuilds
    kind: "exotic-tail"
    excluded_from: "CL-4 frontier (SUB-13)"
    rationale: >-
      Not mapped as nodes, on a materiality ground that is structural rather than
      incidental: THESE ARE COMPOSITIONS, NOT TECHNIQUES. NEU-932's own finding F-C-4
      records that "frontier techniques appear in corpora predominantly as COMPOSITIONS
      with other techniques rather than in isolation", and draws the consequence for
      SUB-13 explicitly: "CL-4's mappers (SUB-6/SUB-13) should expect to DECOMPOSE
      compositions rather than find clean instances." SUB-13 did exactly that — the
      components are mapped (cl-4.aliens-trick-application, cl-4.smawk-application,
      cl-4.kinetic-segment-tree-dp, and mainstream.yaml's D&C optimization and CHT) and
      the compositions are not. Minting a node per observed composition is the
      combinatorial explosion the charter's High risk names, and it would be a node set
      that grows with the corpus rather than with the technique space.
    revision_trigger: >-
      A composition is identified that a learner cannot acquire from its components —
      i.e. it has genuinely emergent content. That is a real node and SUB-13's scope
      acquires it. (SUB-13 found none.)
    owner: "SUB-13; adjudicated by OUT-7"

  - id: "RX-12"
    technique: "Quantum, parallel/GPU, streaming, and approximate DP speedups"
    kind: "exotic-tail"
    excluded_from: "CL-4 frontier (SUB-13)"
    rationale: >-
      T1 fires on all of them in the abstract. Not mapped: they are outside the charter's
      technique space, which NEU-889 fixes as COMPETITIVE DP. The maximalist bar is "the
      maximal known COMPETITIVE DP technique space", not the maximal known DP-acceleration
      space — a distinction this register exists to make explicit rather than let a reader
      infer. Recorded to mark that the boundary was located deliberately, since a
      maximalist reading with no stated audience bound would have no principled reason to
      stop before them.
    revision_trigger: "NEU-887's audience line changes."
    owner: "SUB-13; adjudicated by OUT-7"

  - id: "RX-13"
    technique: "The open remainder of the exotic-optimization tail"
    kind: "exotic-tail-residual"
    excluded_from: "CL-4 frontier (SUB-13)"
    rationale: >-
      THE HONEST BOTTOM LINE OF THE MAXIMALIST CLAIM, recorded rather than implied.
      RX-7..RX-12 are the exotic-tail techniques SUB-13 CONSIDERED AND NAMED. They are
      not asserted to exhaust the tail. NEU-932's INC-D3 already records that the
      technique space does not exist as an enumerated object; the frontier is by
      construction open (Convention U contemplates techniques invented after the
      2026-07-16 cutoff), so an assertion that this file's exclusion list is COMPLETE
      would be unfalsifiable and false.
      WHAT IS ACTUALLY CLAIMED, precisely: (1) the four families NEU-938 names as
      in-scope are mapped node-by-node — with the documented exception of RX-1, which
      the settled partition assigns to CL-3 and which SUB-13 may not re-decide; (2) one
      un-enumerated technique reachable by Convention U (SMAWK/LARSCH) is mapped, giving
      the frontier a research-tier endpoint whose chain reaches the roots; (3) every
      exotic-tail technique SUB-13 considered and declined is named above with a
      rationale and a trigger. NOT claimed: that no further exotic technique exists.
      That gap has an owner and a route — it is OUT-7's coverage question, and Convention
      U1 already guarantees that any newly surfaced T1 technique is CL-4's without a
      partition change or a new cluster.
    revision_trigger: >-
      OUT-7 surfaces a material technique the cascade assigns to CL-4 that is neither
      mapped here nor in mainstream.yaml nor excluded above. That is a coverage finding
      against this file and a MINOR bump of the scope boundary — NOT a partition finding.
    owner: "SUB-13 for the mapped set; OUT-7 (SUB-9..11) adjudicates the residual"

residual_exclusion_count: 13

# =============================================================================
# SCOPE BOUNDARY — VERSIONED
# =============================================================================
# The charter's High risk is that maximalist breadth expands the graph indefinitely.
# A bound that is not versioned is not a bound — it drifts, and drift is invisible.
# This block makes the frontier's edge a dated, versioned, citable object so that
# widening it is an EVENT rather than an accident.
# =============================================================================
scope_boundary:
  version: "1.0.0"
  set_at_map_version: "0.1.0"
  set_by: "NEU-938 (SUB-13)"
  compiled: "2026-07-16"
  rule: >-
    A frontier technique is MAPPED node-by-node iff (a) the D-F4 §3 cascade assigns it
    to CL-4 (T1 fires), AND (b) it is in NEU-938's named in-scope list OR is the direct
    structural extension of a mapped CL-4 technique, AND (c) it is material under
    NEU-887's materiality rule to the charter's competitive-DP audience line — in
    practice, it has a real instance in a D-F2 corpus (C1..C6) or is the immediate
    strengthening of one that does. Otherwise it is recorded in `residual_exclusions`
    with a rationale, a revision trigger, and an owner. It is NEVER silently omitted.
  bump_policy: >-
    MINOR bump when a residual exclusion is promoted to a mapped node (the boundary
    widens). MAJOR bump when the rule itself changes — e.g. if NEU-887's audience line
    moves, or if a U4 challenge alters which techniques the cascade assigns to CL-4.
  what_this_bound_deliberately_excludes: >-
    Literature-real but learner-unreal material: results that exist in the algorithms
    literature and would satisfy T1, but that no competitive instance exercises. RX-7
    (discrete convex analysis beyond 1-D), RX-8 (multi-parameter relaxation), RX-9
    (general (min,+) fine-grained complexity), RX-10 (ranked zeta) are all of this
    kind. The bound is drawn one step past each mapped family's competitive instance —
    far enough to be maximalist, near enough to be auditable.
  honest_cost: >-
    RECORDED RATHER THAN HIDDEN. This bound is a JUDGMENT, made by one sub-task, on
    class-1 [literature] evidence, and it is the load-bearing judgment of NEU-938.
    Criterion (c) leans on "has a real instance in a D-F2 corpus", and SUB-13 CANNOT
    VERIFY that: CAP-2 makes Codeforces (C4) ids unverified, F-C-4 records that frontier
    techniques appear in corpora as compositions rather than clean instances, and no
    corpus in D-F2 is indexed by technique in a way that would let this file assert an
    instance exists. So criterion (c) is applied on SURVEY-LEVEL JUDGMENT, not on a
    checked instance. Consequence, stated plainly: every RX-7..RX-12 exclusion is
    falsifiable by OUT-7 finding one instance, and each one names that as its revision
    trigger. This is the weakest link in NEU-938's chain and it is named here rather
    than left for an audit to discover.

# =============================================================================
# CL-1 ATTACHMENT-ID RESOLUTION — verified against the merged CL-1 file
# =============================================================================
# NEU-934 (SUB-3) merged nodes/cl-1-foundational.yaml (PR #615) while this file was
# being written. That is a coordination WINDFALL, not a licence, and this block
# records exactly what SUB-13 did and did not do with it.
#
# WHAT CHANGED: the four CL-1 attachment targets carry looked-up ids and verbatim
#   to_names instead of grammar-predicted guesses. SUB-13's ORIGINAL prediction was
#   "cl-1.linear-sequence-dp" for all four — AND IT WAS WRONG. No such node exists.
#   This is the schema's own warning landing exactly as written
#   (03_per-node-record-template.md §3: "to_node is a PREDICTION... SUB-4 may name it
#   something else entirely. So SUB-12 resolves on to_name + to_cluster + rationale").
#   Recorded rather than quietly corrected, because it is live evidence FOR the
#   convention: had CL-1 not landed early, SUB-12 would have resolved these four on
#   to_name and rationale, and the id hint would have been a miss. That is the design
#   working, not failing.
#
# WHAT DID *NOT* CHANGE — the important half:
#   The four attachments are STILL `cross_cluster_attachments`, STILL
#   `status: "declared"`, and are NOT drawn as edges. The disposition table
#   (01_node-and-edge-schema.md §4.1) keys on WHAT THE TARGET IS — a sibling cluster's
#   node — not on whether the mapper could see it. V-7 forbids a drawn cross-cluster
#   edge with no visibility exception, and SUB-12 owns realization in
#   edges/cross-cluster.yaml. The one-line rule ("draw an edge to anything that
#   already exists; declare an attachment to anything that doesn't") is the RATIONALE
#   for the table, not an override of it — reading it as an override would have SUB-13
#   drawing CL-1 edges from a file it does not own, racing SUB-12, and producing
#   exactly the duplicate-edge corruption D-S4's X-S1 note warns about for root edges.
#   The conservative reading is taken deliberately.
# =============================================================================
cl1_id_resolution:
  cl1_merged_at: "PR #615 (NEU-934), merged to develop before this PR"
  original_prediction: "cl-1.linear-sequence-dp"
  prediction_outcome: "MISS — no such id exists in the merged CL-1 file."
  resolved:
    - from: "cl-4.slope-trick-application"
      to_node: "cl-1.linear-sequence-dp-2d"
      to_name: "2D linear/sequence DP (index-pair state)"
      confidence: "named"
      basis: >-
        The target's own summary names the shape slope trick optimizes: "a position
        paired with a resource count". Slope trick's base is the O(n * V) DP over
        (index, value) — precisely that.
    - from: "cl-4.aliens-trick-application"
      to_node: "cl-1.sequence-partition-dp"
      to_name: "Sequence partition DP (index-plus-count state)"
      confidence: "named"
      basis: >-
        Exact match. The target's defining second index IS the count the Aliens trick
        deletes.
    - from: "cl-4.smawk-application"
      to_node: "cl-1.sequence-partition-dp"
      to_name: "Sequence partition DP (index-plus-count state)"
      confidence: "named"
      basis: >-
        Corroborated FROM THE TARGET'S SIDE: cl-1.sequence-partition-dp's summary says
        it "makes this family the standard base for the divide-and-conquer and Knuth
        optimizations. Those optimizations are NOT this node and NOT this cluster (D-F4
        T1 -> CL-4; recorded as EXC-4)." SUB-3 anticipated CL-4's attachment and routed
        it out of CL-1 explicitly. SMAWK is the linear-time strengthening of the same
        exploitation.
    - from: "cl-4.kinetic-segment-tree-dp"
      to_node: "cl-1.sequence-partition-dp"
      to_name: "Sequence partition DP (index-plus-count state)"
      confidence: "conjectured"
      basis: >-
        DELIBERATELY DOWNGRADED to "conjectured" rather than asserted. The base this
        technique optimizes is the COUNT-FREE variant of the partition shape
        (dp[i] = min over j of dp[j] + cost(j,i)); the named target is the closest CL-1
        node but carries a count index the kinetic base does not have. Per
        03_…-template.md §3, "conjectured" means the target SHOULD exist but the mapper
        is unsure it is mapped — and a conjecture that resolves to nothing is a coverage
        finding for OUT-7, not a mapper's error. Flagging it is the honest move; naming
        it "named" would launder a real uncertainty into false precision.
  unchanged_deliberately: >-
    All four remain cross_cluster_attachments with status "declared". None is drawn.
    SUB-12 still resolves and realizes them; the verified ids are a hint that should
    make that cheap, not a substitute for it.
  cl2_resolution:
    cl2_merged_at: "PR #617 (NEU-935), merged to develop before this PR"
    original_prediction: "cl-2.tree-dp"
    prediction_outcome: "MISS — no such id exists in the merged CL-2 file."
    resolved:
      - from: "cl-4.slope-trick-on-trees"
        to_node: "cl-2.formulate-subtree-recurrence"
        to_name: "Formulate a subtree recurrence: decide what a subtree must summarize"
        confidence: "named"
        basis: >-
          Exact. SUB-4 mapped the tree family as a set of shapes rather than one "Tree
          DP" node, so the prediction had nothing to hit. The right target is the node
          this optimization's own rationale already named in prose — the ability to
          formulate the subtree recurrence. Its summary ("what a child must report so
          that the parent can decide without looking inside it") IS the contract whose
          representation slope trick makes cheap.
  prediction_scorecard: >-
    RECORDED BECAUSE IT IS EVIDENCE ABOUT THE CONVENTION, NOT ABOUT SUB-13. Five
    cross-cluster attachments, five grammar-derived predictions, all made blind:
    4 MISSES (cl-1.linear-sequence-dp x4 — no such node) and, counting the sibling CL-4
    file's intra-cluster ids, 1 HIT (cl-4.divide-and-conquer-optimization) and 1 MISS
    (cl-4.convex-hull-trick -> cl-4.convex-hull-trick-monotonic), plus this CL-2 MISS.
    THE ID PREDICTIONS WERE MOSTLY WRONG AND THE `to_name` + `rationale` WERE RIGHT
    EVERY TIME — which is exactly why 01_node-and-edge-schema.md §4.3 makes `to_name`
    required and `to_node` a hint, and why an exact-id-match-only resolver "would
    silently drop real dependencies". This file is a live confirmation of that design
    decision rather than a counterexample to it. SUB-12 should keep resolving on
    to_name + to_cluster + rationale even where an id now looks authoritative.
  note_for_sub12: >-
    ALL FIVE attachments now carry looked-up ids: CL-1 (#615), CL-2 (#617) and the
    sibling CL-4 file (#614) all merged before this PR. None is a blind prediction any
    more. They nevertheless remain DECLARED, status "declared", not drawn — SUB-12 still
    owns realization in edges/cross-cluster.yaml. Do not read a verified id as a licence
    to skip resolution; read it as a resolution that should now be cheap.

