      the technique is chosen. S6 YES: it is the realization — interleaving the
      REDUCE/INTERPOLATE recursion with the DP's own evaluation so that every matrix
      entry is demanded only after the dp value it depends on has been committed. S7
      rejected: the interleaving order depends on THIS recurrence's dependency
      structure, so steps vary with the problem (schema §2.1).
      CONVENTION S IS NOT INVOKED — the S2-vs-S6 call above is confident, not
      indeterminate, so no D-S1a entry is filed. Recorded explicitly because S2 is the
      plausible rival and a reviewer should see it was considered and rejected on the
      schema's own stated test rather than overlooked.
    cluster: "CL-4"
    role: "technique"
