  - id: "cl-4.kinetic-segment-tree-dp"
    name: "Kinetic segment tree ↔ DP interplay"
    node_kind: "skill"
    skill_type: "optimization"
    skill_type_rationale: >-
      Cascade stops at S2. S1 no — the amortization bound is a real obligation but it
      is a SEPARATE node (cl-4.kinetic-segment-tree-amortization-proof, typed "proof");
      this node applies the structure, it does not bound it. Split per schema §1.1. S2
      YES: it takes an already-correct DP whose transition is a maximum over linear
      functions of the current index — a transition a learner can already evaluate
      correctly in O(n) per state, giving O(n^2) — and reduces it to O(n log^2 n)
      amortized by evaluating that maximum with a kinetic segment tree as the index
      sweeps. No state changes meaning; the same maximum is taken, more cheaply. This
      is D-F4's T1, and D-F4 §3.2 assigns this technique to CL-4 on T1 and names it as
      SUB-13's research-tier example explicitly.
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Evaluate a DP transition that is a maximum (or minimum) over linear functions
      using a kinetic segment tree, so that the sweep over the DP's index doubles as the
      monotone advance of the structure's global parameter. A learner acquires the
      correspondence — DP index becomes kinetic time — and the precondition that makes
      it available: the parameter must advance MONOTONICALLY, which is what makes this
      reach the transitions the convex hull trick cannot, at the price of an
      amortization that a single non-monotone query destroys.
