  - id: "cl-4.slope-trick-convexity-preservation-proof"
    name: "Proving a DP's transitions preserve convexity (slope trick's licence)"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1, the first and most specific test. The contribution is
      ARGUING that a property holds: that each transition of the recurrence maps a
      convex piecewise-linear function to a convex piecewise-linear function — by
      induction over the transition order, using closure of convexity under pointwise
      addition, under prefix/suffix minimum, and under translation. Nothing downstream
      of S1 is reached. This is the obligation that LICENSES cl-4.slope-trick-application;
      it is split from it per schema §1.1 because a learner routinely acquires the
      application from a template and fails the proof entirely — they are different
      abilities that fail separately.
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Establish by argument that every transition in the target recurrence preserves
      convexity of the value function, which is exactly the precondition that makes
      slope trick sound rather than a heuristic that happens to pass the samples. A
      learner acquires the closure properties, the induction shape, and — critically —
      the ability to see when the argument FAILS, which is when slope trick silently
      produces a wrong answer rather than a slow one.
    prerequisites:
      intra_cluster:
        - "cl-4.slope-trick-convex-function-representation"
      roots:
        - "cl-1.root.optimal-substructure"
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors:
        - "anchor.convex-hull-envelope-geometry@1.0.0"
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-2"
      entry_gate: "gate-c"
      prerequisite_depth: 2
      state_formulation_load: 2
      transition_derivation_load: 3
      proof_obligation_load: 4
      implementation_load: 1
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C5"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-938"
    aliases: ["convexity preservation argument", "slope trick soundness proof"]
    notes: >-
      AR-1-b bears on this node too (see `ar1_requests`): the closure of convexity
      under (min,+) convolution is one of the properties the induction uses, and it is
      not registered. Recorded, not laundered. Node is `status: "provisional"`.

  - id: "cl-4.slope-trick-heap-implementation"
    name: "Realizing slope trick with two lazy heaps"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6. S1 no — no proof obligation; the soundness argument is
      cl-4.slope-trick-convexity-preservation-proof. S2 no — the asymptotic win is
      already secured by cl-4.slope-trick-application; this node makes the chosen
      formulation RUN, it does not make it run faster. S3 no — no symptom is the
      starting point. S4 no — nothing is hidden; the formulation is given. S5 no — the
      technique is already chosen. S6 YES: turning the chosen breakpoint-multiset
      formulation into working code — a max-heap for the left multiset, a min-heap for
      the right, lazy additive offsets on each rather than O(n) re-insertion, and a
      running accumulator for the minimum value. S7 rejected DELIBERATELY: the steps
      DO vary with the problem — which side takes the shift, whether the accumulator
      increments, and whether one side is discarded all depend on this recurrence's
      transition shape. Per schema §2.1 the S6/S7 line is exactly "does a step require
      a judgment about this specific problem", and here it does, so S7's stronger
      claim (that nothing varies) is false.
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Turn the breakpoint-multiset formulation into code that actually runs in
      O(n log n): two heaps facing each other across the minimum, lazy add-tags in
      place of bulk translation, and an accumulator carrying the minimum value that
      the heaps themselves do not store. A learner acquires the layout and the
      book-keeping that the mathematical description leaves out — which is where
      almost every slope-trick implementation is lost.
    prerequisites:
      intra_cluster:
        - "cl-4.slope-trick-application"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 5
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 0
      implementation_load: 5
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: false
      note: >-
        Observation only, not a verdict: two heaps with lazy offsets and an
        accumulator; JavaScript has no standard-library heap, and the accumulator can
        exceed Number.MAX_SAFE_INTEGER on large-coordinate instances. Recorded for
        SUB-8, which owns any verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C5", "C4"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-938"
    aliases: ["two-heap slope trick", "lazy-offset slope trick"]

  - id: "cl-4.slope-trick-on-trees"
    name: "Slope trick on trees (mergeable breakpoint multisets)"
    node_kind: "skill"
    skill_type: "optimization"
    skill_type_rationale: >-
      Cascade stops at S2. S1 no — the amortization argument for the merging is a real
      obligation, but it is the small-to-large / mergeable-heap bound, which is a
      general-algorithms fact this node uses rather than a DP-correctness argument this
      node establishes; no proof obligation is this node's defining contribution. S2
      YES: it takes an already-correct tree DP whose per-vertex value function is
      convex and reduces the cost of evaluating it from O(n * V) to O(n log^2 n) by
      merging children's breakpoint multisets instead of their value tables. The states
      still mean what they meant — the value function at each vertex — and only the
      cost of computing them moves. T1 fires exactly as it does for flat slope trick;
      per D-F4 §2.1 this variant's frontier/mainstream status is irrelevant to
