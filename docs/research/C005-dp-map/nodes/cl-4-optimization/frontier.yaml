      (index, count-used) — which a learner can write and which already answers
      correctly — and removes the count dimension entirely, giving O(n log C) via a
      binary search on the penalty. No state changes meaning: the unconstrained DP
      computes the same value function, penalised. This is D-F4's T1 exactly, and
      D-F4 §3.2 assigns the technique to CL-4 on T1.
