# =============================================================================
# AR-1 ANCHOR REQUESTS IN FLIGHT
# =============================================================================
# Route AR-1 (boundary-register.yaml §anchor_request_route; schema ledger §3).
# INC-S1 predicted exactly this: the register is EXACTLY the 5 anchors the NEU-933
# spec sanctions and is explicitly NOT asserted complete over the technique space.
# The frontier is where that incompleteness was always going to bite, and it did.
#
# INTERIM STATE, APPLIED: every dependent node below is `status: "provisional"` and
# records the dependency in its `notes`. NONE of the four forbidden moves was made:
#   - no anchor invented locally,
#   - no dependency faked as a prerequisites.roots edge,
#   - no dependency declared as a cross_cluster_attachment,
#   - no dependency silently dropped.
#
# WHY THE REQUESTS ARE RECORDED HERE RATHER THAN AS ROWS IN THE LEDGER:
#   AR-1 nominates ../C005-dp-map-schema/adjudication/01_schema-decision-ledger.md as
#   the filing location. That file is NEU-933's and is NOT SUB-13's to write — header
#   rule 1 ("write ONLY this file") and template §4 rule 3 ("never write into another
#   cluster's file") bind, and four mappers are writing concurrently. The requests are
#   therefore recorded in full, in machine-readable form, in the requesting file, with
#   everything AR-1 requires a request to name. The ledger row is a mechanical
#   transcription for D-S3's owner (NEU-933) or SUB-11, who drives the filing routes.
#   RECORDED AS A DEVIATION FROM AR-1's LETTER, NOT SLIPPED IN: AR-1's substance —
#   name the anchor, name the dependent, argue the prerequisite is genuinely non-DP,
#   mark dependents provisional, never improvise — is fully discharged. Only the
#   physical location of the row differs, and only because file ownership forbids it.
# =============================================================================
ar1_requests:

  - id: "AR-1-a"
    files_against: "D-S3"
    ledger: "../../C005-dp-map-schema/adjudication/01_schema-decision-ledger.md"
    filed_by: "NEU-938 (SUB-13)"
    filed_at_map_version: "0.1.0"
    requested_anchor_id: "anchor.lagrangian-duality"
    requested_anchor_name: "Lagrangian duality"
    requested_kind: "mathematics"
    requested_scope: >-
      Lagrangian relaxation of a constrained optimization problem: the Lagrangian and
      its dual function, weak duality, and the condition under which the dual bound is
      tight for an integer resource constraint (convexity of the optimum in the
      constrained quantity). The anchor would be the duality theory — NOT the DP that
      exploits it, NOT convex optimization at large, and NOT numerical methods for it.
    dependent_nodes:
      - "cl-4.lagrangian-relaxation-for-dp"
      - "cl-4.aliens-trick-application"
      - "cl-4.aliens-trick-convexity-proof"
    why_genuinely_non_dp: >-
      Run NEU-932 D-F4 §3's cascade on "Lagrangian duality" and NO test fires, because
      every test presupposes a RECURRENCE and duality has none. T1 asks whether it takes
      an already-correct recurrence and reduces its evaluation cost — it does not; it is
      a reformulation theorem about constrained optimization that is stated, proved and
      used with no recurrence anywhere in it (it applies to linear programs and to
      continuous problems that are not DPs at all). T2 asks about the encoding of a
      state — there is no state. T3 asks whether the state is indexed over a
      combinatorial structure — there is no state. T4 is the residual for a DP whose
      state is a plain index tuple — again, no state. It is therefore not a member of
      the DP technique-space partition, which is the register's condition (a). It is a
      real prerequisite of at least one DP technique in the partition — condition (b) —
      since cl-4.aliens-trick-application IS this theorem specialised to a counted DP
      constraint, and a learner who does not have the duality correspondence has no
      reason to believe the lambda sweep recovers the constrained answer. And it is
      above NEU-887's elementary-data-structures floor — condition (c) — by a
      comfortable margin: it is graduate-level mathematical-optimization theory, not
      something NEU-887 assumes.
    why_not_an_existing_anchor: >-
      Checked against all five registered anchors and none covers it.
      anchor.convex-hull-envelope-geometry is the closest and still wrong: its scope is
      envelopes of families of LINES and the geometry that makes an envelope queryable —
      a statement about geometric objects. Lagrangian duality is a statement about the
      relationship between a constrained program and its penalised relaxation. There is
      a real conceptual cousinhood (the dual function is concave and the lambda sweep
      does trace a hull) and that cousinhood is exactly the trap: drawing onto the
      envelope anchor would make the dependent's terminal say something materially
      weaker and different from what it needs, which is the precise failure D-S3's own
      recorded reasoning cites when it declined to fold Li Chao into segment tree ("a
      CHT node depending on 'segment tree' says materially less than one depending on
      'Li Chao tree'"). anchor.linear-algebra covers matrices and linear recurrences —
      unrelated. The remaining three (segment tree, Li Chao, modular arithmetic) are not
      close.
    interim_node_status: "provisional"
    status: "requested"

  - id: "AR-1-b"
    files_against: "D-S3"
    ledger: "../../C005-dp-map-schema/adjudication/01_schema-decision-ledger.md"
    filed_by: "NEU-938 (SUB-13)"
    filed_at_map_version: "0.1.0"
    requested_anchor_id: "anchor.min-plus-convolution"
    requested_anchor_name: "(min,+) convolution"
    requested_kind: "mathematics"
    requested_scope: >-
      The (min,+) (infimal) convolution operator on integer-indexed functions, its
      associativity and commutativity, and its behaviour on convex piecewise-linear
      functions — specifically that (min,+)-convolving two convex piecewise-linear
      functions yields a convex piecewise-linear function whose slope multiset is the
      MERGE of the operands' slope multisets. The anchor would be the operator and these
      algebraic facts — NOT any algorithm for computing it fast in the general
      (non-convex) case, and NOT discrete convex analysis at large.
    dependent_nodes:
      - "cl-4.slope-trick-application"
      - "cl-4.slope-trick-convexity-preservation-proof"
      - "cl-4.slope-trick-on-trees"
    why_genuinely_non_dp: >-
      Run the D-F4 §3 cascade on "(min,+) convolution" and no test fires, for the same
      structural reason as AR-1-a: every test presupposes a recurrence and this is an
      OPERATOR, not a technique for evaluating one. T1 requires an already-correct
      recurrence whose cost it reduces — the operator reduces nothing; it is the algebra
      a recurrence may be WRITTEN IN. T2/T3/T4 all presuppose a state, and the operator
      has none. So condition (a) holds: it is not a member of the DP partition.
      Condition (b) holds: it is a real prerequisite of cl-4.slope-trick-application,
      because the merge fact IS the licence for slope trick's central move — replacing a
      transition's function combination with a multiset union. Condition (c) holds: it is
      above the elementary floor; NEU-887 assumes elementary data structures, not the
      algebra of infimal convolution.
      HONEST COUNTER-ARGUMENT, RECORDED RATHER THAN OMITTED: a reviewer may object that
      (min,+) convolution is DP-adjacent to the point of being DP content, since a
      knapsack transition IS a (min,+) convolution. The objection has force and D-S3's
      owner should weigh it. SUB-13's answer is that "the knapsack transition is an
      instance of the operator" argues the operator is MORE general than the DP, not that
      it is part of it — the same relation linear algebra bears to matrix-exponentiation
      DP, which IS registered as an anchor (anchor.linear-algebra) on exactly that
      footing per D-F4 §3.2. If D-S3's owner rejects the request, the correct disposition
      is NOT to fold the fact into anchor.convex-hull-envelope-geometry (see below) but
      to rule that it is CL-4 knowledge, in which case
      cl-4.slope-trick-convex-function-representation absorbs it and the three dependents
      lose their AR-1 note. Either outcome is clean; the failure would have been to guess.
    why_not_an_existing_anchor: >-
      anchor.convex-hull-envelope-geometry@1.0.0 IS drawn by these nodes already, for the
      facts inside its registered scope — that a convex piecewise-linear function is the
      envelope of a family of lines, and the monotonicity properties of that envelope.
      Its scope does NOT extend to the behaviour of an OPERATOR that combines two such
      functions. That is function algebra, not "the geometric facts that make an envelope
      queryable" (the anchor's own words). Stretching the anchor to cover it would change
      its scope, which per boundary-register.yaml is a MAJOR register_version bump
      precisely because every dependent's terminal would shift meaning — so it is a
      register decision either way and must not be made locally by a mapper.
    interim_node_status: "provisional"
    status: "requested"

# =============================================================================
# RESIDUAL EXCLUSIONS — bounded by NEU-887's materiality rule
# =============================================================================
# THIS REGISTER IS A FIRST-CLASS DELIVERABLE OF NEU-938, NOT AN APPENDIX.
#
# The charter's named High risk: "Maximalist breadth expands the graph and audit
# surface indefinitely in pursuit of a complete map." SUB-13 is where that risk is
# realized, because "complete" here means the MAXIMAL KNOWN competitive DP technique
# space. The bound is NEU-887's materiality rule (referenced, never re-derived — see
# ../../C005-dp-map-schema/04_register-extension.md §2, which records that a
# DP-specific materiality rule was considered and DECLINED).
#
# THE RULE AS APPLIED HERE: a frontier technique is mapped node-by-node iff it is
# material to the charter's audience line — competitive DP as practised — which in
# practice means it has a real instance a learner could meet in the D-F2 corpora
# (C1..C6) or is the direct structural extension of one that does. A technique that
# exists only as a literature result, or only as a composition, or that the partition
# assigns elsewhere, is recorded HERE with a rationale rather than mapped.
#
# WHY RECORDED RATHER THAN OMITTED: NEU-887 status discipline, inherited — gaps and
# conflicts are recorded, never smoothed. An exclusion with a rationale is auditable
# by OUT-7 and reversible by a named trigger. A silent omission is neither. Every
# entry below therefore carries a rationale AND a revision trigger AND an owner.
#
# SCOPE BOUNDARY VERSION: 1.0.0 (see `scope_boundary` at the bottom). The boundary is
# VERSIONED so that widening it later is a visible, dated event rather than drift.
# =============================================================================
residual_exclusions:

  # ---- KIND A: assigned elsewhere by the settled partition (NOT materiality) ----
  # These are excluded because the partition owns them elsewhere, not because they
  # are immaterial. Recorded here so a reader of the FRONTIER file — where the
  # charter's own wording sends them looking — finds them with an owner rather than
  # concluding the map dropped them.

  - id: "RX-1"
    technique: "Plug DP / broken-profile DP / connection-profile DP"
    kind: "assigned-elsewhere"
    excluded_from: "CL-4 frontier (SUB-13)"
    assigned_to: "CL-3 — owner SUB-5 (NEU-936)"
    rationale: >-
      *** THE ONE A REVIEWER SHOULD CHECK FIRST. THIS IS A CARRIED CONFLICT, NOT A
      TIDY EXCLUSION. See `carried_conflicts` X-938-1. ***
      The NEU-938 issue description names "broken-profile / connection-profile DP" in
      SUB-13's desired outcome and in-scope list. NEU-932 D-F4 §3.2 — SETTLED, and the
      partition SUB-13's own assumptions say supplies the cluster assignment — assigns
      "Plug DP / broken-profile DP" to CL-3, verbatim, with the reasoning: "T2 fires:
      the plug/profile encoding is the contribution. Lands cleanly without invoking the
      indeterminate convention." D-F4 §3.2 further calls this one of the rows "that
      matter": a technique the NEU-932 spec named as a hard un-enumerated case which
      "lands in exactly one cluster by the rule alone".
      SUB-13 does not map it. Convention U4 is explicit and binding: "A mapper that
      believes a technique is misassigned MAY NOT RE-DECIDE LOCALLY... Until that
      challenge is adjudicated, the existing assignment stands and the technique stays
      mapped — the map never has a hole while an argument is in progress." Mapping it
      here would be a local re-decision against a settled entry, would double-claim it
      against SUB-5 who is mapping CL-3 concurrently, and would produce exactly the
      duplicate-node outcome the ordered cascade exists to prevent (D-F4 §3.1).
      THE SUBSTANTIVE POINT, RECORDED SO THE ADJUDICATOR HAS IT: SUB-13 believes D-F4
      is RIGHT and the issue wording is the loose one. Broken-profile DP's contribution
      is the profile ENCODING of a frontier of cells — what a learner acquires is the
      plug/bracket state representation. It does not take an already-correct recurrence
      and make it cheaper; without the encoding there IS no tractable recurrence to
      accelerate. T1 does not fire. T2 does. It is CL-3's on the merits, not merely by
      precedence. THE MAP HAS NO HOLE: the technique is mapped, by SUB-5, in CL-3.
    materiality: >-
      Not a materiality judgment. The technique IS material; it is simply not SUB-13's.
      Recorded under `residual_exclusions` because that is where a reader of the NEU-938
      spec's named list will look for it, and finding it here with an owner is the
      difference between a recorded conflict and a silent drop.
    revision_trigger: >-
      A U4 ledger challenge against D-F4 (filed in NEU-932's ledger,
      ../../C005-dp-map-foundations/adjudication/01_selection-decision-ledger.md — NOT
      the schema ledger) succeeds in reassigning plug/broken-profile DP to CL-4. Then and
