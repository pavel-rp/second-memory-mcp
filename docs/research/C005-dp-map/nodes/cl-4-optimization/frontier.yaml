  - id: "cl-4.aliens-trick-tie-breaking-implementation"
    name: "Aliens-trick tie-breaking and degenerate-segment handling"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6. S1 no — this is not an argument; the convexity argument is
      cl-4.aliens-trick-convexity-proof. S2 no — the asymptotic win is already secured
      by cl-4.aliens-trick-application; this node makes the chosen formulation produce
      the RIGHT answer, not a faster one. S3 no — this node is the forward-looking
      discipline that PREVENTS the failure; diagnosing the failure once it has occurred
      is cl-4.debug-aliens-trick-failure, typed "debugging". The two are split
      deliberately and the S3-vs-S6 line is the presence of a symptom as the starting
      point. S4 no. S5 no — the technique is chosen. S6 YES: memory/representation and
      book-keeping decisions in realizing a chosen formulation — whether to take the
      minimal or maximal optimal count at a tie, how to keep lambda integral, and how
      to handle f having a flat region so that no lambda yields exactly k. S7 rejected:
      every one of those choices depends on THIS problem's cost structure and tie
      pattern, so S7's claim that nothing varies is false (schema §2.1).
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Handle the part of the Aliens trick that the theorem does not cover: when f(k) is
      convex but not strictly convex, a range of counts is optimal at the critical
      lambda and no lambda selects k exactly. A learner acquires the tie-breaking
      discipline — track the minimal (or maximal) optimal count consistently, keep
      lambda integral where costs are, and reconstruct the answer at the boundary — which
      is the difference between an Aliens-trick solution that is correct and one that is
      correct on the samples.
