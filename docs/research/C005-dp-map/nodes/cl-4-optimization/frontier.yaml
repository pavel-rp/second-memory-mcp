  - id: "cl-4.lagrangian-relaxation-for-dp"
    name: "Lagrangian relaxation of a counted DP constraint"
    node_kind: "knowledge"
    cluster: "CL-4"
    role: "technique"
    summary: >-
      The fact that a DP constrained to use exactly k of something can be replaced by an
      unconstrained DP that charges a penalty lambda per use, and that if the constrained
      optimum f(k) is convex in k then sweeping lambda traces f's lower convex hull —
      so the constrained answer is recoverable from an unconstrained solve plus the
      count it happens to use. A learner acquires the reformulation and, inseparably,
      its precondition: the correspondence is a THEOREM ABOUT CONVEX f, and it is false
      without convexity. This is the knowledge; applying it is
      cl-4.aliens-trick-application and establishing convexity is
      cl-4.aliens-trick-convexity-proof.
    prerequisites:
      intra_cluster: []
