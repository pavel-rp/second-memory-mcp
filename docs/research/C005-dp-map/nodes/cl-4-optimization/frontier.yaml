  - id: "cl-4.total-monotonicity"
    name: "Total monotonicity of a DP cost matrix"
    node_kind: "knowledge"
    cluster: "CL-4"
    role: "technique"
    summary: >-
      The fact that a cost matrix can be TOTALLY MONOTONE — every 2x2 submatrix whose top
      row's minimum lies weakly left of its bottom row's has that ordering preserved — and
      that total monotonicity implies the ROW-MINIMUM POSITIONS are non-decreasing down
      the rows. This is the exact hypothesis SMAWK needs, and it is STRICTLY WEAKER than
      the Monge condition: Monge implies total monotonicity, not conversely. A learner
      acquires the property, the row-minima consequence, and the implication's DIRECTION —
      which is what lets them see that establishing Monge is a sufficient route to SMAWK's
      hypothesis rather than the hypothesis itself.
    prerequisites:
      intra_cluster:
        - "cl-4.quadrangle-inequality"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
        - "cl-1.root.optimal-substructure"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-3"
      entry_gate: "gate-c"
      prerequisite_depth: 3
      state_formulation_load: 2
      transition_derivation_load: 3
      proof_obligation_load: 2
      implementation_load: 1
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C5"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-938"
    aliases: ["totally monotone matrix", "total monotonicity", "row-minima monotonicity"]
    notes: >-
      X-938-2 RESOLVED — THIS NODE WAS NARROWED AFTER mainstream.yaml MERGED. SUB-13
      originally wrote this node as "Total monotonicity AND the Monge condition", which
      predicted a duplicate against SUB-6. That prediction landed: NEU-937 merged
      cl-4.quadrangle-inequality ("The quadrangle inequality (Monge condition)",
      aliases incl. "Monge condition"). Rather than ship two CL-4 knowledge nodes for the
      same fact, this node now states ONLY total monotonicity — the strictly weaker
      property SMAWK actually needs — and DRAWS the Monge condition from SUB-6's node via
      prerequisites.intra_cluster. That edge is intra-cluster and now RESOLVES against a
      real merged id (both CL-4 files share one cluster and one namespace, header rule 2b).
      THIS IS NOT A MERGE OF THE TWO NODES AND NOT A DELETION OF SUB-6's. It is the
      mathematically honest split, and the split is real rather than diplomatic: Monge
      implies total monotonicity but NOT conversely, and SUB-6's node states Monge's
      SPLIT-POINT-SANDWICH consequence (what Knuth-Yao and D&C optimization need) while
      SMAWK needs the ROW-MINIMA consequence of the weaker property. Two different facts,
      correctly two nodes, with the implication drawn as the edge it is.
      NO BOUNDARY ANCHOR IS DRAWN AND NO AR-1 IS FILED, deliberately. Total monotonicity
      is a property of a matrix, so one might argue it is non-DP and wants an anchor.
      Rejected: the register's rule (boundary-register.yaml §boundary) admits an anchor
      iff it is (a) NOT DP, (b) a real prerequisite of a DP technique, (c) above the
      elementary floor. (a) fails in the sense that matters — the object is THIS DP's
      cost matrix and the property is asserted OF the recurrence's own transition cost,
      which is DP content, not borrowed general-algorithms content. SUB-6 reached the
      same disposition independently for cl-4.quadrangle-inequality (no anchor, roots
      only), which is corroboration rather than coincidence.

