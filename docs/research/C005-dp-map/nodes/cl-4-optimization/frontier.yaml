  - id: "cl-4.kinetic-segment-tree-amortization"
    name: "Kinetic-segment-tree certificate amortization"
    node_kind: "knowledge"
    cluster: "CL-4"
    role: "technique"
    summary: >-
      The fact that a segment tree whose leaves hold linear functions of a global
      parameter t can maintain their maximum as t advances monotonically, by storing at
      each node a "certificate" — the value of t at which its winner would change — and
      rebuilding only the subtrees whose certificates expire; and that although a single
      advance can cascade, the TOTAL rebuild work over a monotone sweep is bounded
      (O(n log^2 n) amortized for the standard construction) because each rebuild
      permanently destroys a crossing that cannot recur. A learner acquires the
      certificate idea and the amortization CLAIM; arguing the bound is
      cl-4.kinetic-segment-tree-amortization-proof and using it is
      cl-4.kinetic-segment-tree-dp.
