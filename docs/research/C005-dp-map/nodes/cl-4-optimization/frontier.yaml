# =============================================================================
# PROTOTYPE DISPOSITION
# =============================================================================
# NEU-889 Assumption #12 / NEU-938 in-scope: "running a targeted prototype only where
# graph structure at the frontier is genuinely uncertain". NEU-938's constraints and
# verification evidence both add the converse, which is the binding half: "targeted
# prototypes run only where graph structure is genuinely uncertain, NEVER ON SETTLED
# STRUCTURE", and "confirmation that any in-charter prototype ran only against
# genuinely uncertain structure."
# =============================================================================
prototype_disposition:
  prototypes_run: 0
  rationale: >-
    NONE WAS RUN, AND THAT IS THE POSITIVE FINDING RATHER THAN AN OMISSION. The permission
    is conditional on genuine structural uncertainty, and SUB-13 did not find any in the
    graph structure it mapped. For all four families the D-F4 §3 cascade answered T1
    confidently and immediately — three of them (slope trick, Lagrangian/Aliens, kinetic
    segment tree) are pre-adjudicated by name in D-F4 §3.2's own worked table, so their
    structure is SETTLED and prototyping them is explicitly forbidden, not merely
    unnecessary. The fourth (SMAWK/LARSCH) is un-enumerated, but Convention U1 disposes of
    it without uncertainty: T1 fires confidently, so it is CL-4's, and its absence from the
    reference taxonomies is a coverage question for OUT-7, not a structural one. No node in
    this file invoked Convention S (indeterminate skill type) and no D-S1a entry is filed —
    every cascade in this file terminated on a confident match, and each rationale records
    the rejected rivals.
  the_uncertainty_that_did_arise: >-
    The real uncertainty SUB-13 hit was NOT graph structure. It was (a) ANCHOR
    REGISTRATION — two genuine non-DP prerequisites the register does not name — and (b)
    a SPEC-vs-PARTITION disagreement over broken-profile DP. Neither is a question a
    prototype could answer: (a) is owned by route AR-1 and is discharged as AR-1-a/AR-1-b,
    and (b) is owned by Convention U4 and is carried as X-938-1. Reaching for a prototype
    on either would have been running one against structure that is settled — the thing
    NEU-938 forbids — while the actual open question sat in a route that already exists.
  recorded_because: >-
    NEU-938's verification evidence asks for "confirmation that any in-charter prototype
    ran only against genuinely uncertain structure". Zero prototypes satisfies that
    vacuously, which is exactly why the reasoning is written down: an auditor should be
    able to see the permission was CONSIDERED AND DECLINED ON ITS OWN CONDITION, not
    forgotten.

