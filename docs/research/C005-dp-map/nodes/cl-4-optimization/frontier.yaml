  - id: "cl-4.debug-aliens-trick-failure"
    name: "Diagnosing an Aliens-trick solution that returns a wrong count or a wrong value"
    node_kind: "skill"
    skill_type: "debugging"
    skill_type_rationale: >-
      Cascade stops at S3. S1 no — the starting point is not an obligation to argue
      anything. S2 no — the DP is already fast; it is WRONG, and making a wrong DP
      right is not a cost reduction, so S2's precondition ("already-correct DP") is not
      met — which is precisely why S2 does not fire and S3 does. S3 YES: the node
      starts from a SYMPTOM — the binary search converges but the reported count is
      never k, or the answer is off by a multiple of lambda, or it is right on the
      samples and wrong on the tests — and works back to the cause, which is one of a
      short, known list: f is not actually convex, the tie-break picked the wrong end
      of a flat region, or the lambda-correction term was applied with the wrong sign
      or count. Split from cl-4.aliens-trick-tie-breaking-implementation per schema
      §1.1: preventing the failure and diagnosing it from its symptom are different
      abilities that fail separately, and the S3/S6 line is exactly whether a symptom
      is the starting point.
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Take an Aliens-trick implementation that produces a wrong answer and localize the
      cause from its symptom, distinguishing the three failures that look identical from
      the outside: a false convexity hypothesis, a mis-chosen tie-break on a flat region,
      and a mis-applied lambda correction. A learner acquires the symptom-to-cause map
      and the checks (brute-force f(k) on small inputs and test convexity directly) that
