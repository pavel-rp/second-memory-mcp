      CARRIED, NOT SMOOTHED, AND NOT RESOLVED BY SUB-13 — because it is not SUB-13's to
      resolve. Convention U4 binds: the existing assignment stands until adjudicated and
      a mapper may not re-decide locally. SUB-13 therefore does NOT map it, and records
      it as RX-1 with CL-3/SUB-5 named as owner, so the map has no hole while the
      disagreement stands.
      SUB-13's position, on the record for whoever adjudicates: D-F4 is right on the
      merits. Broken-profile DP's defining contribution is the profile ENCODING, not a
      cost reduction over an already-correct recurrence — without the encoding there is
      no tractable recurrence to accelerate, so T1 does not fire and T2 does. The
      NEU-938 wording appears to inherit the charter's grouping of "broken-profile DP"
      with the research-tier frontier by RARITY (it is certainly rare and research-tier)
      rather than by DEFINING CONTRIBUTION — and D-F4 §2.1's whole argument is that
      rarity is not a partition criterion, because it drifts.
    route: >-
      A U4 ledger challenge against D-F4, filed in NEU-932's ledger
      (../../C005-dp-map-foundations/adjudication/01_selection-decision-ledger.md), NOT
      the schema ledger. SUB-13 does not file it and does not believe it should succeed.
    affected_parties: ["SUB-5 (NEU-936, CL-3)", "OUT-7 coverage audit", "NEU-889 charter author"]
    visible_to: >-
      Named in this file's header note, in RX-1, and here — the three places a reader
      looking for broken-profile DP in the frontier file will actually look.

  - id: "X-938-2"
    conflict: >-
      Predicted DUPLICATE NODES across the two CL-4 files, which share one cluster id
      and one id namespace. SUB-13's cl-4.total-monotonicity and cl-4.verify-monge-
      condition were prerequisites of its SMAWK family AND of SUB-6's mainstream
      Knuth-Yao and D&C optimization; the per-node-record template's own worked example
      anticipates a "cl-4.quadrangle-inequality-proof" node in the mainstream file.
    disposition: >-
      *** RESOLVED BEFORE MERGE — THE PREDICTION LANDED, AND THE EVIDENCE ARRIVED IN
      TIME TO ACT ON IT. *** mainstream.yaml merged (NEU-937, PR #614) while this PR was
      in review, so SUB-13 rebased onto it and could finally SEE the sibling. It had
