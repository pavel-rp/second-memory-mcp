  - id: "cl-4.larsch-online-smawk-implementation"
    name: "Realizing online totally-monotone search (LARSCH) for a self-referential DP"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6. S1 no — no property is argued here; the hypothesis is
