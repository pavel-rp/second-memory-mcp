      Cascade stops at S1, the first and most specific test. The contribution is
      ARGUING that f(k) — the optimum subject to using exactly k — is convex in k,
      almost always by an exchange argument on two optimal solutions with counts k-1
      and k+1, showing they can be recombined into two solutions with count k of no
      greater total cost. Nothing downstream of S1 is reached. It is split from
      cl-4.aliens-trick-application per schema §1.1 because the application is a
      template a learner can copy while being wholly unable to produce this argument —
      and that gap is exactly why Aliens trick is notorious for silently wrong answers.
