      progression_stage: "PS-2"
      entry_gate: "gate-c"
      prerequisite_depth: 2
      state_formulation_load: 3
      transition_derivation_load: 2
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 5
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C5"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-938"
    aliases: ["spotting slope trick", "recognizing convex DP value functions"]
    notes: >-
      EXPLICIT PER-NODE TRANSFER-TO-DP UNCERTAINTY (NEU-938 constraint; NEU-887 R1 /
      X-D3 inherited). This node ASSERTS that hidden-convexity recognition is a
      distinct acquirable ability that a learner can hold while lacking
      cl-4.slope-trick-application, and vice versa. That assertion is a STRUCTURAL
