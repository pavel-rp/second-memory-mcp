  - id: "cl-4.slope-trick-application"
    name: "Slope trick"
    node_kind: "skill"
    skill_type: "optimization"
    skill_type_rationale: >-
      Cascade stops at S2. S1 no — the convexity-preservation argument is a real
      obligation but it is a SEPARATE node (cl-4.slope-trick-convexity-preservation-proof,
      typed "proof"); this node is the application, not the argument, split per schema
      §1.1 rather than typing one node twice. S2 YES: it takes an already-correct DP —
      the O(n * V) tabulation over (index, value) that a learner can already write and
      that already produces the right answer — and reduces it to O(n log n) by
      maintaining the value function's breakpoints instead of its values. No state
      changes meaning; the same function is computed, more cheaply. This is exactly
      NEU-932 D-F4's T1 test one level down, and the two agree by construction:
      D-F4 §3.2 assigns slope trick to CL-4 on T1.
    cluster: "CL-4"
    role: "technique"
    summary: >-
      Maintain a DP's convex piecewise-linear value function through the recurrence's
      transitions by operating on its breakpoint multisets rather than on its values:
      adding a convex cost term inserts breakpoints, a prefix/suffix minimum deletes
      the extremal breakpoints on one side, and a shift translates one side. A learner
      acquires the operation repertoire and which transition shapes map onto which
      operations — the whole of what makes an O(n * V) tabulation into an O(n log n)
      algorithm without changing what it computes.
    prerequisites:
      intra_cluster:
        - "cl-4.slope-trick-convex-function-representation"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors:
        - "anchor.convex-hull-envelope-geometry@1.0.0"
    cross_cluster_attachments:
      - attachment_id: "xc.cl-4.slope-trick-application->cl-1.linear-sequence-dp-2d"
        from: "cl-4.slope-trick-application"
        to_cluster: "CL-1"
        to_node: "cl-1.linear-sequence-dp-2d"
        to_name: "2D linear/sequence DP (index-pair state)"
        relation: "requires"
        rationale: >-
          THE DEFINING PREREQUISITE ONTO THE FAMILY THIS TECHNIQUE OPTIMIZES. Slope
          trick is parasitic on a linear-sequence DP over (index, value) that must
          already be correct before there is anything to accelerate — the canonical
          instance is the O(n * V) "make the sequence non-decreasing at minimum total
          |a_i - b_i| cost" tabulation. A learner cannot acquire slope trick without
          first being able to formulate that recurrence. Per D-F4 §3.1 the base DP is
          owned by the cluster the cascade assigns it (CL-1 by T4: a plain index tuple
          over a linear domain) and the OPTIMIZATION node is CL-4's — two nodes, not one
          contested node. DECLARED, never drawn — see `notes` on id resolution. This is
          NOT a root edge and must not be resolved into one; the roots are the four DP
          first principles, not the linear-sequence family.
        confidence: "named"
        status: "declared"
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 4
      state_formulation_load: 4
      transition_derivation_load: 5
      proof_obligation_load: 1
      implementation_load: 3
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: false
      note: >-
        Observation only, not a verdict: the operation repertoire needs two heaps with
        lazy offsets; JavaScript ships neither a heap nor a priority queue in its
        standard library. Recorded for SUB-8.
    coverage:
      status: "unaudited"
      corpus_refs: ["C5", "C4"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-938"
    aliases: ["slope trick", "the slope trick", "convex piecewise-linear DP optimization"]
    notes: >-
      AR-1-b IS IN FLIGHT FOR THIS NODE (see `ar1_requests`). Slope trick's transition
      repertoire rests on a genuinely non-DP fact that the boundary register does not
