    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    aliases: ["Grundy value", "nimber", "minimum excludant"]

  - id: "cl-3.sprague-grundy-theorem"
    name: "The Sprague-Grundy theorem"
    node_kind: "knowledge"
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Every impartial game under normal play is equivalent to a single Nim heap whose
      size is the position's Grundy value, and the Grundy value of a SUM of
      independent games is the XOR of their Grundy values. This is the theorem that
      converts an intractable product state space into a tractable one: k independent
      subgames need not be a k-dimensional state, because XOR composes them. What a
      learner acquires is the equivalence and its two preconditions — impartial (both
      players have the same moves) and normal play (last to move wins) — each of which
      is routinely violated by problems that look like they qualify.
    prerequisites:
      intra_cluster:
        - "cl-3.grundy-number-and-mex"
        - "cl-3.win-lose-position-semantics"
      roots: []
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C3:K"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    aliases: ["Sprague-Grundy", "Nim equivalence", "game sum theorem"]

