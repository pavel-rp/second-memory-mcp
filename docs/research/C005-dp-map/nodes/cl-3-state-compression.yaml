  - id: "cl-3.probability-vs-expectation-dp-semantics"
    name: "Probability DP vs expectation DP"
    node_kind: "knowledge"
    cluster: "CL-3"
    role: "technique"
    summary: >-
      What the VALUE in the table means, and why the two readings are different
      techniques wearing one name. A probability DP's value is P(state is reached),
      accumulates FORWARD from a base case of 1 at the start, and its transitions
      push mass outward. An expectation DP's value is E[future cost | in this state],
      accumulates BACKWARD from a base case of 0 at the terminal, and its transitions
      pull mass inward. The direction reversal is not a stylistic choice — it follows
      from what the value asserts, and mixing the two is the family's defining
      confusion.
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C2:I", "C2:J", "C3:J"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    aliases: ["probability DP", "expected-value DP", "randomized-process DP"]

  - id: "cl-3.linearity-of-expectation-in-dp"
    name: "Linearity of expectation as a DP-licensing property"
    node_kind: "knowledge"
    cluster: "CL-3"
    role: "technique"
    summary: >-
      E[X + Y] = E[X] + E[Y] holds WITHOUT independence, and this is precisely what
      licenses an expectation DP to sum over transitions the way an optimizing DP
      sums over subproblems. This is the family's analogue of optimal substructure:
      it is the property that makes the decomposition valid at all. Its most
      consequential corollary is negative — because linearity needs no independence,
      a learner may correctly decompose dependent events, which is exactly the step
      that looks illegal and is not.
    prerequisites:
      intra_cluster:
        - "cl-3.probability-vs-expectation-dp-semantics"
      roots:
        - "cl-1.root.optimal-substructure"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C2:J"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"

  - id: "cl-3.formulate-expectation-dp"
    name: "Formulate an expectation DP"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5: it is CHOOSING the state and the direction — what the
      random process's state must capture, whether the value is a probability pushed
      forward or an expectation pulled backward, and what the base case asserts. S1
      no (well-definedness is a real obligation but is the separate node
      cl-3.expectation-dp-well-definedness, per §1.1). S2 no (nothing exists to
      accelerate). S3 no (no symptom). S4 no (a problem that says "find the expected
      number of steps" states its own mapping).
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Turn a random process into a concrete correct expectation recurrence: identify
      the state the process is memoryless over, choose the direction the value
      accumulates in, write E[state] as the probability-weighted sum over successors
      plus the step cost, and fix the terminal base case at zero. The choice that
      matters is the direction — and it is forced by what the value means, not free.
    prerequisites:
      intra_cluster:
        - "cl-3.linearity-of-expectation-in-dp"
        - "cl-3.probability-vs-expectation-dp-semantics"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
        - "cl-1.root.recognize-optimal-substructure"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C2:I", "C2:J", "C3:J"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"

  - id: "cl-3.resolve-expectation-dp-self-loops"
    name: "Resolve self-loops and cyclic dependencies in an expectation DP"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6: the recurrence is chosen and the work is making it
      EVALUABLE — a DP whose state depends on itself has no evaluation order, and
      this node supplies the realization that repairs that. S1 no (that the resulting
      system has a unique solution is a real claim, but it is the separate node
      cl-3.expectation-dp-well-definedness). S2 no — the close call: rearranging
      E = p*E + r into E = r / (1 - p) LOOKS like a speedup but it is not; without
      it the DP does not terminate at all, so this makes it RUN, not run faster. The
      root cl-1.root.implement-memoization-and-tabulation draws exactly this line.
      S3 no (this is anticipated at formulation time, not diagnosed from a symptom).
      S4 no. S5 no (the formulation is given). Not S7: whether a self-loop yields to
      one line of algebra or requires assembling and solving a linear system is a
      judgment about THIS recurrence's cycle structure.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Make a cyclic expectation recurrence evaluable. The two realizations a learner
      acquires: algebraic rearrangement when a state's only cycle is a self-loop
      (E = p*E + r becomes E = r / (1 - p), and 1 - p != 0 is the condition to check),
      and assembling the states into a linear system solved by Gaussian elimination
      when the cycles are genuine and multi-state. Recognizing which case is in front
      of you, and what each costs, is the substance.
    prerequisites:
      intra_cluster:
        - "cl-3.formulate-expectation-dp"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors:
        - "anchor.linear-algebra@1.0.0"
        - "anchor.modular-arithmetic@1.0.0"
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: >-
        Observation, not a verdict: competitive expectation problems usually demand
        the answer as a modular rational (p * q^-1 mod 998244353), so the elimination
        runs over a finite field, not over floats. JS has no native modular inverse
        and its numbers cannot hold the intermediate products, so BigInt or a
        Montgomery-style routine is forced where C++ uses `long long` directly. SUB-8
        owns the verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C3:J"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    aliases: ["self-loop elimination", "Gaussian elimination on DP states", "cyclic expectation DP"]
    notes: >-
      DRAWN ANCHOR, NOT A JUMP. Two boundary anchors terminate this node's non-DP
      prerequisites: anchor.linear-algebra@1.0.0 (the linear system, its matrix form,
      and the vector-space facts that make elimination valid) and
      anchor.modular-arithmetic@1.0.0 (the modular-rational answer convention, whose
      inverses the elimination runs over). Both are registered at 1.0.0 and version-
      pinned. Per boundary-register.yaml and template §4 these are SANCTIONED
      TERMINALS drawn directly from this file — not cross-cluster attachments (an
      anchor is not a sibling node), not faked root edges, and not unexplained jumps.
      The register's own why_an_anchor for linear-algebra ("matrices, matrix
      multiplication and its associativity, linear recurrences and their matrix form")
      covers this use, and its terminates_chains_from lists CL-4 only — informative
      only, explicitly "NOT ownership, NOT a coverage claim", so a CL-3 chain
      terminating here is in scope and needs no register amendment. Recorded because a
      reader checking terminates_chains_from may expect otherwise.

  - id: "cl-3.expectation-dp-well-definedness"
    name: "Argue an expectation DP is well-defined"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1 — the first test, firing cleanly: the contribution is
      ESTABLISHING BY ARGUMENT that the expectation exists and the recurrence has a
      unique solution. An infinite process CAN have a finite expectation, and it can
      also fail to (an absorbing state unreachable with probability 1 gives an
      infinite answer, and the DP will happily return a finite number anyway). This
      is an argument obligation, not a judgment, which is why it is S1 and not S8.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Establish that the answer the DP computes is the answer that exists: that the
      process reaches an absorbing state with probability 1, that the expectation is
      therefore finite, and that the linear system the states induce is nonsingular
      so its solution is unique. What a learner acquires is the obligation itself —
      knowing that a finite number coming out of the table is not evidence the
      expectation was finite.
    prerequisites:
      intra_cluster:
        - "cl-3.formulate-expectation-dp"
        - "cl-3.linearity-of-expectation-in-dp"
      roots:
        - "cl-1.root.optimal-substructure"
      boundary_anchors:
        - "anchor.linear-algebra@1.0.0"
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    notes: >-
      DRAWN ANCHOR, NOT A JUMP. anchor.linear-algebra@1.0.0 terminates the
      nonsingularity half of the argument (the vector-space facts that make a unique
      solution a meaningful claim). Sanctioned terminal per template §4; version-
      pinned; not a cross-cluster attachment and not a faked root.

  # ===========================================================================
  # FAMILY 4 — GAME / GRUNDY / COMBINATORIAL-GAME DP
  #            (D-F4 §3.2: T2 — specialized domain semantics)
  # ===========================================================================

  - id: "cl-3.win-lose-position-semantics"
    name: "Winning and losing position semantics"
    node_kind: "knowledge"
    cluster: "CL-3"
    role: "technique"
    summary: >-
      What it means for a position to be losing under optimal play, stated as the
      mutual recursion it actually is: a position is losing (P-position) iff EVERY
      move leads to a winning position, and winning (N-position) iff SOME move leads
      to a losing one. This is a DP over the game graph whose value is a boolean and
      whose base case is the terminal position — losing, because the player to move
      cannot move. The quantifier alternation is the whole content, and it is where
      the technique's difficulty lives.
