        from: "cl-3.implement-steiner-tree-dp"
        to_cluster: "CL-2"
        to_node: "cl-2.tree-dp"
        to_name: "Tree DP"
        relation: "requires"
        rationale: >-
          The merge transition composes two partial trees at a shared root — the
          same subtree-combination reasoning tree DP is built on. A learner cannot
          acquire the Steiner recurrence without first being able to formulate a DP
          over a tree's subtrees. Named rather than conjectured: D-F4 §3.2 lists
          "Tree DP / rerooting" as a worked CL-2 example, so the target's existence
