  - id: "cl-3.recognize-digit-dp-under-unfamiliar-surface"
    name: "Recognize a digit DP under an unfamiliar surface"
    node_kind: "skill"
    skill_type: "transfer"
    skill_type_rationale: >-
      Cascade stops at S4: the contribution is recognizing a KNOWN technique under a
      surface that does not announce it — a problem about lucky tickets, about sums
      of digit functions, about counting binary strings avoiding a pattern, or about
      base-k representations, none of which say "count numbers <= N with property P".
      S1 no (no argument). S2 no (nothing correct exists yet). S3 no (no symptom).
      S4 YES, and this is exactly the "obvious from the statement" test failing: when
      the statement DOES say "count numbers in [L, R] with property P", the mapping is
      stated and the skill is cl-3.formulate-digit-dp (S5). This node is the case where
      the numeral is hidden inside the problem's own vocabulary.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      See the numeral walk under a surface that never mentions one: recognize that a
      constraint over a base-k representation, a digit-sum property, or a
      pattern-avoidance count over strings-as-numbers is the same prefix-tree walk
      with the same flags. What a learner acquires is the recognition, which is what
      the technique's real difficulty consists of once the mechanics are known.
    prerequisites:
