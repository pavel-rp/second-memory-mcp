  - id: "cl-3.grundy-number-and-mex"
    name: "Grundy number and the mex operator"
    node_kind: "knowledge"
    cluster: "CL-3"
    role: "technique"
    summary: >-
      The Grundy value of a position is the minimum excludant (mex) of its successors'
      Grundy values — the smallest non-negative integer not among them. What this
      buys over a boolean: Grundy 0 is exactly a losing position, so the Grundy value
      strictly refines win/lose, and the refinement is what makes games COMPOSABLE.
      The mex is not an arbitrary choice of aggregator; it is forced by the
      requirement that a position's value behave like a Nim-heap size.
    prerequisites:
      intra_cluster:
        - "cl-3.win-lose-position-semantics"
      roots: []
      boundary_anchors: []
