  - id: "cl-3.diagnose-bitmask-state-blowup"
    name: "Diagnose a bitmask DP that TLEs or MLEs"
    node_kind: "skill"
    skill_type: "debugging"
    skill_type_rationale: >-
      Cascade stops at S3: it starts from a SYMPTOM — TLE, MLE, or a wrong answer
      that appears only at large n — and works back to a cause (a redundant state
      dimension, a 3^n loop where 2^n*n was intended, an unnecessary popcount
      recomputation, a mask carried that the transition never reads). S1 no (no proof
      obligation). S2 no — the close call, and the cascade order settles it: S2
      presupposes a correct DP and asks for less cost; this node presupposes a
      SYMPTOM and asks for its cause. Diagnosis precedes any optimization decision,
      and the optimization that follows may well be CL-4's node, not this one.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Work back from the characteristic failure signatures of a bitmask DP to their
      causes: distinguish a state space genuinely too large from one carrying a
      dimension the transition never reads; recognize 3^n submask enumeration where
      the intended complexity was 2^n * n; spot the redundant popcount in the inner
      loop. What a learner acquires is the symptom-to-cause map, which is separately
      acquired from — and separately failed from — the ability to write the DP.
