  - id: "cl-3.steiner-tree-dp-state-encoding"
    name: "Steiner-tree DP state encoding"
    node_kind: "knowledge"
    cluster: "CL-3"
    role: "technique"
    summary: >-
      The minimum Steiner tree over a small terminal set is computable by a DP whose
      state is (subset of terminals connected, current root vertex) — a mask crossed
      with a vertex. What the encoding asserts: a partial Steiner tree is fully
      summarized by WHICH terminals it spans and WHERE it is currently anchored, and
      the two ways to extend it are the two transitions — merge two disjoint terminal
      subsets at a shared root, or grow the current tree along a graph edge. The mask
      over terminals, not the tree structure, is what makes the state space finite.
    prerequisites:
      intra_cluster:
        - "cl-3.bitmask-state-encoding"
        - "cl-3.subset-cover-transition-correctness"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
        - "cl-1.root.optimal-substructure"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C3:S"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    aliases: ["Dreyfus-Wagner", "Steiner tree DP", "minimum Steiner tree"]
    contested_by: ["CL-2"]
    notes: >-
      D-F4a ADJUDICATED ASSIGNMENT, CARRIED IN-BAND. This node answers BOTH T2 (the
      terminal-subset mask encoding) and T3 (it is a DP over a graph/tree structure).
      D-F4 §3.2 adjudicates it to CL-3 because T2 fires first in the cascade, and
      states plainly that "its tree structure (T3) loses to T2 by order — CL-2 may
      link, not own." The D-F4a ledger row records it alongside SOS DP as a
      provisional placement. contested_by CL-2 records that competing claim at the
      point of use so a reader meets it here rather than only in the ledger, per the
      charter's carry-don't-smooth discipline. NOT resolved locally. If CL-2's mapper
      disagrees the route is a U4 challenge against D-F4a, not a local re-decision;
      until adjudicated this assignment stands and the technique stays mapped here, so
      the map has no hole while the argument runs.

  - id: "cl-3.implement-steiner-tree-dp"
    name: "Implement a Steiner-tree DP"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6: the formulation is chosen and the work is realizing the
      two-phase loop — for each terminal mask, first merge over submask pairs, then
      relax over graph edges until the layer is stable. S1 no. S2 no (making it run,
      not faster; the relaxation is part of the recurrence's definition, not an
      acceleration bolted onto a correct one). S3 no. S4 no. S5 no (the state is
      chosen upstream). Not S7: interleaving the merge phase and the relaxation phase
      correctly — and knowing the relaxation must run to fixpoint WITHIN a mask layer
      before the next layer reads it — is a judgment about this recurrence's
      dependency structure, not a fixed routine.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Realize the Dreyfus-Wagner recurrence: iterate terminal masks in increasing
      order, perform the submask-pair merge for each root vertex, then relax the whole
      layer along graph edges to fixpoint before advancing. What a learner acquires is
      the two-phase realization and the layer-ordering judgment that makes it correct.
    prerequisites:
      intra_cluster:
        - "cl-3.steiner-tree-dp-state-encoding"
        - "cl-3.implement-bitmask-dp"
        - "cl-3.submask-enumeration"
      roots:
