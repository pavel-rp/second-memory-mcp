  # ===========================================================================
  # FAMILY 2 — DIGIT DP    (D-F4 §3.2: T2 — specialized domain, numeral
  #                         representation, with its own state semantics)
  # ===========================================================================

  - id: "cl-3.digit-dp-state-semantics"
    name: "Digit DP state semantics"
    node_kind: "knowledge"
    cluster: "CL-3"
    role: "technique"
    summary: >-
      What a digit-DP state means: a prefix of the numeral is fixed, and the rest of
      the number is free subject to flags that summarize the prefix's relationship to
      the bound. The three canonical flags and what each asserts — `tight` (the prefix
      equals the bound's prefix, so the next digit is capped), `started` (a nonzero
      digit has appeared, distinguishing a leading zero from a real zero), and the
      problem-specific carry of whatever property is being counted. The insight the
      encoding rests on: the set of numbers <= N is not an interval the DP can iterate,
      but it IS a prefix tree the DP can walk, and the flags are exactly the finite
      summary that makes the walk's states collide.
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
        - "cl-1.root.overlapping-subproblems"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: >-
        Observation, not a verdict: digit DP bounds routinely exceed 2^53, so JS
        number-typed bounds lose precision where C++ `long long` does not; BigInt or
        string-typed bounds are the realistic carrier. SUB-8 owns the verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C3:E"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    aliases: ["digit DP", "numeral-prefix DP", "counting-with-bound DP"]

  - id: "cl-3.formulate-digit-dp"
    name: "Formulate a digit DP"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5: it is CHOOSING what the state must carry — which flags are
      needed, what the property-specific dimension must remember, and (critically)
      what may safely be FORGOTten so states collide at all. S1 no (correctness of the
      bound handling is a real obligation but it is the separate node
      cl-3.digit-dp-bound-correctness, per §1.1). S2 no (nothing to accelerate yet).
      S3 no (no symptom). S4 no (given a stated "count numbers in [L, R] with property
      P", the mapping to digit DP is stated, not hidden — the hidden case is the
      separate transfer node).
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Turn a "count the numbers in a range satisfying P" statement into a concrete
      digit-DP formulation: decide the digit order, decide which flags the state
      carries, decide the finite summary of P that the state must remember, fix the
      base case at the numeral's end, and reduce a two-sided range to two one-sided
      counts by f(R) - f(L-1). The choice that matters is what to forget.
    prerequisites:
      intra_cluster:
        - "cl-3.digit-dp-state-semantics"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
        - "cl-1.root.recognize-overlapping-subproblems"
      boundary_anchors: []
    cross_cluster_attachments:
      - attachment_id: "xc.cl-3.formulate-digit-dp->cl-1.counting-dp"
        from: "cl-3.formulate-digit-dp"
        to_cluster: "CL-1"
        to_node: "cl-1.counting-dp"
        to_name: "Counting DP (summing over transitions rather than optimizing)"
        relation: "requires"
        rationale: >-
          A digit DP is a counting DP wearing a numeral's clothes: its value is a
          count and its transition SUMS over successors rather than taking a min or
          max. A learner cannot acquire it without first having the counting-DP
          formulation — the shift from "best" to "how many", which is where the
          additive base case and the sum-over-transitions habit come from. Declared,
          not drawn: CL-1's family block is being written concurrently by SUB-3 and
          its ids are not visible from here. Named rather than conjectured: counting
          DP is squarely CL-1's plain-index-tuple residual (T4) and every selected
          reference's ordered corpus reaches it early (C2 ramps through it before any
          CL-3 material).
        confidence: "named"
        status: "declared"
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C3:E"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"

  - id: "cl-3.implement-digit-dp"
    name: "Implement a digit DP"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6: the formulation is chosen; the work is realizing it. S1 no.
      S2 no (making it run, not faster). S3 no. S4 no. S5 no (the flags are already
      chosen). Not S7: the memo table must be keyed only on the dimensions that are
      genuinely free — memoizing across the `tight` flag is the canonical bug, and
      deciding which states are safe to share is a judgment about THIS problem, not a
      fixed routine.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Realize a chosen digit-DP formulation: convert the bound to a digit array,
      write the recursion over position with the flags, key the memo table on exactly
      the free dimensions (and NOT on `tight`, whose states are visited once each),
      and keep the count under the modulus. What a learner acquires is the realization
      and the memo-keying judgment that makes it correct and fast at once.
    prerequisites:
      intra_cluster:
        - "cl-3.formulate-digit-dp"
        - "cl-3.digit-dp-state-semantics"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors:
        - "anchor.modular-arithmetic@1.0.0"
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: >-
        Observation, not a verdict: the natural top-down realization recurses to
        numeral length, which is shallow, so JS's fixed stack is not the constraint
        here that it is elsewhere. Recorded because a reader may expect the root's
        recursion-depth observation to propagate, and here it does not. SUB-8 owns
        the verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C3:E"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"

  - id: "cl-3.digit-dp-bound-correctness"
    name: "Argue a digit DP's bound handling is exact"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1: the contribution is ESTABLISHING BY ARGUMENT that the
      walk enumerates exactly the numbers in [0, N] — no more, no fewer. The argument
      is a case split on the `tight` flag (the tight branch is a single path tracking
      the bound; the free branch is a full subtree) plus an induction on position.
      Separated from cl-3.implement-digit-dp per §1.1: a learner who writes a
      plausible digit DP that is off by exactly one at the bound is the standard
      failure, and it is a failure of the argument, not of the code.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Establish that the flag machinery is exact: that `tight` correctly caps the
      next digit and releases forever once released, that `started` distinguishes
      leading zeros from real zeros without double-counting the number zero, that the
      inclusive/exclusive boundary at N is what the problem asked for, and that
      f(R) - f(L-1) is the correct reduction of a two-sided range.
    prerequisites:
      intra_cluster:
        - "cl-3.digit-dp-state-semantics"
        - "cl-3.formulate-digit-dp"
      roots:
        - "cl-1.root.optimal-substructure"
