  - id: "cl-3.bitmask-state-encoding"
    name: "Bitmask state encoding"
    node_kind: "knowledge"
    cluster: "CL-3"
    role: "technique"
    summary: >-
      A subset of a small ground set is representable as the bits of a single
      integer, and that integer is usable as a DP state index. What the encoding
      asserts: set membership is bit position, set union is bitwise OR, the state
      space is exactly 2^n, and the whole subset lattice is addressable by ordinary
      integer arithmetic. The exponential state count is not a defect of the
      encoding — it is the honest size of the subset lattice, and it is why the
      technique is bounded to roughly n <= 20-22 in practice.
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments:
      - attachment_id: "xc.cl-3.bitmask-state-encoding->cl-4.sos-dp"
        from: "cl-3.bitmask-state-encoding"
        to_cluster: "CL-4"
        to_node: "cl-4.sos-dp"
        to_name: "SOS DP (sum-over-subsets / zeta-Moebius transform)"
        relation: "required-by"
        rationale: >-
          SOS DP is inseparable from the subset-mask encoding — it transforms a
          function over the subset lattice and its every step is stated in mask
          terms. A learner cannot acquire SOS DP without first knowing what a mask
          state means. Declared "required-by" from CL-3's own side only: this node
          is the prerequisite, CL-4's SOS DP node is the dependent. THIS IS THE
          PERMITTED LINK IN THE LIVE X-D1 DISPUTE — D-F4 §4.2 adjudicates SOS DP to
          CL-4 by cascade order and states CL-3 "may link to it". CL-3's claim (that
          this encoding, not the 3^n -> 2^n*n speedup, is SOS DP's defining
          contribution) remains live via the U4 route against D-F4a. This
          declaration does not assert the claim is won; it records the dependency
          that is true under EITHER assignment.
        confidence: "named"
        status: "declared"
      - attachment_id: "xc.cl-3.bitmask-state-encoding->cl-2.subset-sum-knapsack-counting"
        from: "cl-3.bitmask-state-encoding"
        to_cluster: "CL-2"
        to_node: "cl-2.subset-sum-knapsack-counting"
        to_name: "Subset-sum / knapsack counting DP"
        relation: "requires"
        rationale: >-
          Before a learner can see why a subset must be addressed by an explicit
          mask, they need the experience of a subset-indexed DP that does NOT need
          one — knapsack, where the subset is summarized by a scalar capacity. The
          mask encoding is motivated by the failure of that summary: when the
          subset's identity, not just its aggregate, drives the transition, no
          scalar suffices. Conjectured because CL-2's partition of counting DP is
          not visible from here and the target may be named or split differently.
        confidence: "conjectured"
        status: "declared"
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: >-
        Observation only, not a verdict (OUT-5/SUB-8 owns that): JavaScript's
        bitwise operators coerce to signed 32-bit, so a mask over n > 30 elements
        silently misbehaves in a way it does not in the C++ competitive default the
        selected references assume. BigInt or a two-word split is the workaround and
        both change the cost model. SUB-8 must reach its own verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C2:O", "C2:U", "C3:I"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    aliases: ["subset DP state", "mask DP", "state compression"]
    contested_by: ["CL-4"]
    notes: >-
      X-D1 CARRIED IN-BAND. contested_by CL-4 records the live SOS DP dispute at the
      point a reader meets it. The disputed object is SOS DP's cluster assignment,
      which touches this node because CL-3's whole U4 argument is that SOS DP's
      defining contribution IS this encoding. Standing state: SOS DP -> CL-4 by
      D-F4 §4.2 cascade order (T1 before T2), logged D-F4a PROVISIONAL. CL-3's U4
      challenge — that the mask encoding, not the speedup, is the defining
      contribution — is LIVE and NOT adjudicated by this file. Per U4 the existing
      assignment stands and the technique stays mapped (by CL-4), so the map has no
      hole while the argument runs. NOT resolved locally. Re-adjudication trigger
      per the D-F4a row: SUB-5 files the U4 challenge; owners SUB-5 / SUB-6.
  - id: "cl-3.recognize-bitmask-state-applicability"
    name: "Recognize that a problem wants a bitmask state"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5: it is CHOOSING the state representation under a joint
      correctness-and-cost constraint — the learner must see that the subset's
      identity (not merely its size or sum) drives the transition, and simultaneously
      that n is small enough for 2^n to fit. S1 no (no proof obligation — this is a
      selection, not an argument). S2 no (no recurrence exists yet to accelerate;
      this is the exact boundary that keeps CL-4 distinct — see schema §2.1). S3 no
      (no symptom; nothing is broken yet). S4 no — and this is the close call: the
      n <= 20 constraint is a LOUD, conventional signal that the references state
      openly, so the mapping is stated rather than hidden. Where the surface really
      is unfamiliar the recognition is a different acquisition; see the transfer
      nodes in the digit and game families.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Given a problem statement, judge that a subset must be carried in the state and
      that a mask is the right carrier — and, equally, judge when it is NOT: when a
      scalar summary suffices, when n is too large and the subset lattice is the wrong
      lattice, or when the problem's structure admits a polynomial formulation the
      mask would obscure. Includes reading the n <= 20-22 constraint as the signal it
      conventionally is, without treating that heuristic as a substitute for seeing
      why the subset's identity matters.
    prerequisites:
      intra_cluster:
        - "cl-3.bitmask-state-encoding"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
        - "cl-1.root.recognize-optimal-substructure"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C2:O", "C2:U"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    notes: >-
      TRANSFER-TO-DP UNCERTAINTY (X-D3, carried undiminished from NEU-932). This node
      is typed S5 rather than S4, but it sits on the transfer boundary and the
      distinction is not evidenced: no selected reference (T1-T5) offers evidence that
      recognizing bitmask applicability is separately acquirable from knowing the
      encoding, rather than an epiphenomenon of it. The node asserts the distinction
      is real; it does NOT assert the distinction is evidenced. If OUT-7 or SUB-7 finds
      the two are never separately assessed, merging this node into
      cl-3.bitmask-state-encoding is the correct response.
  - id: "cl-3.submask-enumeration"
    name: "Submask enumeration"
    node_kind: "skill"
    skill_type: "procedural"
    skill_type_rationale: >-
      Cascade stops at S7: `for (s = m; s; s = (s - 1) & m)` is a FIXED idiom whose
      steps do not vary with the problem — the schema names this exact loop as its
      worked example of the S6/S7 boundary (§2.1). S1 no (executing it proves
      nothing; that each submask is visited exactly once is a real claim, but it is
      the SEPARATE node cl-3.subset-cover-transition-correctness, per §1.1 —
      splitting rather than typing one node twice). S2 no (the idiom is how the
      3^n sum is computed, not an acceleration of an existing correct recurrence —
      the acceleration of THAT is SOS DP, which is CL-4's; see E1/E4). S3 no. S4 no.
      S5 no (nothing is chosen). S6 no — and this is the deliberate call: no step
      requires a judgment about the specific problem. The mask is given, the loop is
      verbatim. S7 is the stronger, more falsifiable claim and it holds here.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Execute the standard idiom that enumerates every submask of a given mask in
      descending order, and the paired idiom for iterating supersets. What a learner
      acquires is the routine itself plus its termination behaviour (why the empty
      submask needs separate handling, why the loop cannot be written with a naive
      decrement) — not the argument for why it is exhaustive, which is a separate
      node.
    prerequisites:
      intra_cluster:
        - "cl-3.bitmask-state-encoding"
      roots: []
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: >-
        Observation, not a verdict: the idiom relies on `&` and `-` over a machine
        integer. JavaScript's signed-32-bit bitwise coercion bounds it identically to
        the encoding node's observation. SUB-8 owns the verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C2:U"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    aliases: ["submask iteration", "subset-of-subset enumeration", "3^n enumeration"]

  - id: "cl-3.implement-bitmask-dp"
    name: "Implement a bitmask DP"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6: the formulation is chosen and the work is realizing it as
      code. S1 no. S2 no (making it RUN is not making it FASTER — the root
      cl-1.root.implement-memoization-and-tabulation draws this same boundary, and it
      is what keeps CL-4 a separate cluster). S3 no (no symptom yet). S4 no. S5 no
      (the state is already chosen — that is
      cl-3.recognize-bitmask-state-applicability). Not S7: the evaluation order is a
      judgment about THIS recurrence — masks must be visited in an order where every
      transition's source is already final, which is popcount order for some
      formulations and plain ascending integer order for others precisely because
      submask < mask numerically. Choosing between them is not a fixed routine.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Turn a chosen bitmask formulation into working code: lay the 2^n table out,
      establish an evaluation order that respects the transition's dependencies,
      handle the popcount-driven index arithmetic, and keep the answer under the
      problem's modulus. What a learner acquires is the realization, including the
      memory layout decisions that make 2^n * n fit at all.
    prerequisites:
      intra_cluster:
        - "cl-3.recognize-bitmask-state-applicability"
        - "cl-3.submask-enumeration"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
        - "cl-1.root.memoization-vs-tabulation"
      boundary_anchors:
        - "anchor.modular-arithmetic@1.0.0"
    cross_cluster_attachments:
      - attachment_id: "xc.cl-3.implement-bitmask-dp->cl-4.bitset-word-parallel-optimization"
        from: "cl-3.implement-bitmask-dp"
        to_cluster: "CL-4"
        to_node: "cl-4.bitset-word-parallel-optimization"
        to_name: "Bitset / word-parallel optimization"
        relation: "required-by"
        rationale: >-
          Word-parallel acceleration takes an already-correct bitmask DP and reduces
          its cost by a constant factor without changing what any state means — T1,
          so CL-4 owns it (residual exclusion E4 in this file's header). It cannot be
          acquired without first being able to implement the unaccelerated DP.
          Declared "required-by" from CL-3's own side. Conjectured: CL-4's mappers may
          not carve this out as its own node, and if they do not, that is a coverage
          finding for OUT-7 rather than an error here (template §3).
        confidence: "conjectured"
        status: "declared"
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: >-
        Observation, not a verdict: a 2^20-entry typed array is routine in JS, but the
        signed-32-bit bitwise coercion caps n at 30 and `Math.clz32`/popcount have no
        native primitive, so the index arithmetic differs materially from the C++
        default the references assume. SUB-8 owns the verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C2:O", "C2:U", "C3:I"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"

  - id: "cl-3.subset-cover-transition-correctness"
    name: "Argue a subset-partition transition covers each subset exactly once"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1 — the FIRST test, and it fires cleanly: the contribution is
      ESTABLISHING BY ARGUMENT that the transition partitions the subset lattice
      without double-counting and without omission. This is the classic
      fix-the-lowest-set-bit argument that makes a set-partition DP correct rather
      than merely plausible. It is separated from cl-3.submask-enumeration (which
      EXECUTES the loop) per schema §1.1: enumerating and arguing exhaustiveness are
      different acquisitions that fail differently — a learner who can write the loop
      and still double-counts every partition is the common case, not a hypothetical.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Establish that a subset-indexed transition is a genuine partition: that every
      subset is reached exactly once, that the canonical-representative trick (fix the
      lowest set bit into one part) is what removes the overcount, and that omitting
      it counts each partition k! times. What a learner acquires is the argument, not
      the loop.
