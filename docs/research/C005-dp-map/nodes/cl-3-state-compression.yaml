  - id: "cl-3.prove-game-decomposition-via-grundy"
    name: "Argue a game decomposes and its Grundy composition is valid"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1, the first test: the contribution is ESTABLISHING BY
      ARGUMENT that Sprague-Grundy's preconditions hold for THIS game and that the
      subgames are genuinely independent — that no move in one component constrains
      another. The mex/XOR machinery is licensed by that argument and is invalid
      without it, which is why a learner who can compute Grundy values (S7, the
      separate node) may still apply them to a game that does not decompose. Two
      nodes, per §1.1.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Establish that the Grundy machinery applies: argue the game is impartial (the
      move set depends on the position, not on whose turn it is), that normal play
      holds (or that misere changes the answer and how), and that the components are
      independent so their XOR is meaningful. What a learner acquires is the
      obligation — including recognizing misere Nim as the standard case where the
      preconditions fail and the naive XOR answer is wrong.
    prerequisites:
