        from: "cl-3.formulate-automaton-dp"
        to_cluster: "CL-1"
        to_node: "cl-1.string-sequence-dp"
        to_name: "String / sequence DP (DP indexed by a position in a string)"
        relation: "requires"
        rationale: >-
          Before a learner can see why a state must be an automaton node, they need
          the ordinary string DP indexed by position — edit distance, LCS — and the
          experience of its failure when the constraint is a pattern SET rather than
          a second string. The automaton state is motivated as the replacement for a
          position index that cannot summarize enough. Conjectured: CL-1 may split
          string DP by problem rather than as one node, or name it differently. If it
          resolves to nothing, that is a coverage finding for OUT-7 (template §3),
          not an error here.
        confidence: "conjectured"
        status: "declared"
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C3:N"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    notes: >-
      *** AR-1/a ANCHOR REQUEST IN FLIGHT — THIS IS INC-S1. ***
