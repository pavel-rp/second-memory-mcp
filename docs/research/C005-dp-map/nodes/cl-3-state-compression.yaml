    name: "Formulate a game DP: choose what a position is"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5: it is CHOOSING the state — what a "position" is, what the
      legal-move relation is over it, whether the game decomposes into independent
      subgames, and whether the value should be a boolean, a Grundy number, or a
      score. S1 no (the decomposition's validity is the separate proof node). S2 no
      (nothing to accelerate). S3 no (no symptom). S4 no (a problem that says "two
      players alternate, who wins?" states its own mapping; the hidden case is the
      separate transfer node).
    cluster: "CL-3"
    role: "technique"
