  - id: "cl-3.broken-profile-state-encoding"
    name: "Broken-profile state encoding"
    node_kind: "knowledge"
    cluster: "CL-3"
    role: "technique"
    summary: >-
      A DP over a grid can advance CELL BY CELL rather than row by row, carrying a
      "broken" profile — a mask describing the frontier between decided and undecided
      cells, which mid-row is a boundary that steps down one column. What the encoding
      asserts: the frontier is a complete separator, so everything behind it is
      forgettable and everything ahead depends on the grid only through it. This is
      what cuts a row-by-row profile DP's transition cost from enumerating all
      compatible row pairs to a constant per cell.
    prerequisites:
      intra_cluster:
        - "cl-3.bitmask-state-encoding"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
        - "cl-1.root.optimal-substructure"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C3:L", "C5"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    aliases: ["broken profile DP", "profile DP", "frontier DP", "contour DP"]
    notes: >-
      The frontier-as-separator insight is the load-bearing knowledge; the cost
      reduction it produces is a CONSEQUENCE of the encoding, not an acceleration of
      an existing correct recurrence, so T1 does not fire and the node stays CL-3.
      Contrast E7 in this file's header: hashing the profile to shrink the table IS
      a T1 acceleration and is excluded to CL-4. The line is whether the state's
      MEANING changes — here it does.

  - id: "cl-3.plug-dp-connectivity-encoding"
    name: "Plug DP connectivity encoding"
    node_kind: "knowledge"
    cluster: "CL-3"
    role: "technique"
    summary: >-
      When a grid DP must maintain CONNECTIVITY — closed loops, Hamiltonian paths,
      spanning structures — the frontier mask is not enough, because two cells being
      occupied says nothing about whether they belong to the same component. The plug
      encoding carries, per frontier cell, which component its dangling edge belongs
      to: as a bracket sequence when the components are planar and cannot interleave,
      or as a minimal representation under a canonical relabeling in general. What a
      learner acquires is why a plain mask FAILS here — the specific failure that
      motivates the whole encoding — and what the bracket sequence's non-crossing
      property buys.
    prerequisites:
      intra_cluster:
        - "cl-3.broken-profile-state-encoding"
        - "cl-3.bitmask-state-encoding"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C5"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    aliases: ["plug DP", "connection profile DP", "bracket-sequence profile", "Chinese: cha-tou DP"]
    notes: >-
      X-D2 (naming instability across references) is why `aliases` is unusually long
      here: this technique entered the canon through the Chinese olympiad tradition
      (corpus C5 is the only selected corpus reaching it) and the selected taxonomies
      name it inconsistently. Recorded so OUT-7 does not read a naming difference as
      a coverage gap.

  - id: "cl-3.implement-plug-dp"
    name: "Implement a plug / broken-profile DP"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6: the encoding is chosen and the work is realizing it —
      hashing the frontier states that actually occur, handling the end-of-row shift,
      writing the case analysis per cell, and canonicalizing component labels. S1 no
      (the case analysis's exhaustiveness is arguable but the DEFINING contribution
      here is getting it to run). S2 no (making it run, not faster — E7 excludes the
      acceleration). S3 no. S4 no. S5 no (the encoding is chosen upstream). Not S7:
      the per-cell case analysis is a judgment about THIS problem's connectivity rules
      — how many cases exist depends on what is being counted.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Realize a chosen plug/profile formulation: enumerate the reachable frontier
      states rather than all 4^n of them, write the per-cell case analysis over the
      incoming plugs, merge component labels and canonicalize them so equivalent
      frontiers collide, and perform the end-of-row shift correctly. What a learner
      acquires is the realization — this is the family where implementation, not
      formulation, is the wall.
    prerequisites:
      intra_cluster:
        - "cl-3.plug-dp-connectivity-encoding"
        - "cl-3.broken-profile-state-encoding"
        - "cl-3.implement-bitmask-dp"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors: []
    cross_cluster_attachments:
      - attachment_id: "xc.cl-3.implement-plug-dp->cl-2.grid-dp"
        from: "cl-3.implement-plug-dp"
        to_cluster: "CL-2"
        to_node: "cl-2.grid-dp"
        to_name: "Grid DP (DP over a two-dimensional cell lattice)"
        relation: "requires"
        rationale: >-
          A plug DP is a grid DP whose frontier has been re-encoded; a learner cannot
          acquire it without first being able to formulate an ordinary DP over a grid
          with a row-major evaluation order. The plug encoding is motivated entirely
          by the ordinary grid DP's failure to carry connectivity. Conjectured rather
          than named: grid DP may land in CL-1 as a plain index tuple over a
          rectangular domain (T4) rather than in CL-2 as a nontrivial combinatorial
          structure (T3) — the cascade is genuinely close here and the target's cluster
          is not visible from this file. If it resolves to nothing in CL-2, SUB-12
          should retry against CL-1 before reporting a gap; an unresolvable
          declaration is a coverage finding for OUT-7, never a deletion (template §3).
        confidence: "conjectured"
        status: "declared"
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: >-
        Observation, not a verdict: reachable frontier states are sparse and are
        conventionally held in a hash map keyed by the profile. JS `Map` boxes keys and
        its iteration order/allocation behaviour differ materially from the
        `unordered_map` the references assume; a 4-bit-per-cell profile also exceeds
        the 32-bit bitwise window fast. SUB-8 owns the verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C3:L", "C5"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"

