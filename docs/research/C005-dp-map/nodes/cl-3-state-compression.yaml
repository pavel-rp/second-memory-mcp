    name: "Compute Grundy values over a game graph"
    node_kind: "skill"
    skill_type: "procedural"
    skill_type_rationale: >-
      Cascade stops at S7: given a game graph, computing Grundy values is a FIXED
      routine whose steps do not vary — enumerate successors, collect their values,
      take the mex, memoize, recurse. S1 no (executing it argues nothing — the
      theorem that licenses it is the separate node
      cl-3.prove-game-decomposition-via-grundy). S2 no. S3 no. S4 no. S5 no (nothing
      is chosen; the graph is given). S6 no — the deliberate call: once the game graph
      is fixed, no step requires a judgment about the specific problem. The judgment
      lives upstream in cl-3.formulate-game-dp, which decides what a position IS. That
      split is what makes S7 defensible here rather than a default.
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Execute the mex-and-memoize routine over a given game graph: compute each
      position's Grundy value from its successors', handle the terminal base case at
      0, and XOR independent components to get a compound position's value. What a
      learner acquires is the routine, including the small-case tabulation habit that
      exposes a periodic pattern.
