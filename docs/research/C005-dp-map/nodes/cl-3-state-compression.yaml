  - id: "cl-3.automaton-state-dp-semantics"
    name: "Automaton-state DP semantics"
    node_kind: "knowledge"
    cluster: "CL-3"
    role: "technique"
    summary: >-
      A DP's state can be a NODE OF AN AUTOMATON rather than an index into the input.
      What the encoding asserts: the automaton's state is a complete summary of
      everything the prefix consumed so far that can still affect the future, so the
      DP indexes over "where the recognizer currently is" and the automaton's
      transition function IS the DP's transition. This is the encoding insight —
      counting strings that avoid a pattern becomes a walk over the pattern's
      recognizer, and the pattern's structure disappears into the automaton.
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
        - "cl-1.root.overlapping-subproblems"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C3:N"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-936"
    aliases: ["automaton DP", "DP on a recognizer", "DP over KMP/Aho-Corasick states"]
    notes: >-
      This node is deliberately anchor-free: it is the SEMANTIC claim (a DP state may
      be an automaton node), which stands on the DP roots alone and needs no
      string-matching machinery. The dependency on an actual automaton construction
      appears one level up, at cl-3.formulate-automaton-dp, and is routed via AR-1/a.
      Splitting it this way keeps the unregistered dependency confined to the two
      nodes that genuinely have it, rather than smearing a provisional status across
      the family.

  - id: "cl-3.formulate-automaton-dp"
    name: "Formulate a DP over an automaton's states"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5: it is CHOOSING the state space — deciding that the right
      state is a node of a recognizer built from the pattern set, and deciding which
      recognizer (KMP automaton for one pattern, Aho-Corasick for many, a subsequence
      automaton for subsequence constraints). S1 no (no argument). S2 no (nothing to
      accelerate — the automaton IS the formulation, not a speedup of a naive
      recurrence; if it were, T1 would fire and this would be CL-4's node, which is
      exactly the boundary D-F4 §3.2 adjudicates by putting automaton DP in CL-3).
      S3 no. S4 no (a problem naming its forbidden substrings states the mapping).
    cluster: "CL-3"
    role: "technique"
    summary: >-
      Turn a pattern-constrained counting or optimization problem into a DP over a
      recognizer: choose the automaton that summarizes the constraint, take its node
      set as the state space (usually crossed with a length and the problem's own
      dimensions), mark the accepting/forbidden nodes as absorbing or excluded, and
      fix the base case at the automaton's root. The choice that matters is WHICH
      recognizer — and that choice is forced by the constraint's shape.
    prerequisites:
      intra_cluster:
        - "cl-3.automaton-state-dp-semantics"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
        - "cl-1.root.recognize-overlapping-subproblems"
      boundary_anchors: []
    cross_cluster_attachments:
