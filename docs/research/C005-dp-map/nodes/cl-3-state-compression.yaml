  # FAMILY 1 — BITMASK / SUBSET DP        (D-F4 §3.2: T2 fires before T3)
  # ===========================================================================
  # Six nodes. The mask IS the contribution; that masks describe subsets is
  # incidental to what a learner acquires (D-F4 §3.1).
