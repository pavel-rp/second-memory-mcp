  - id: "cl-2.counting-vs-optimizing-objective"
    name: "Counting versus optimizing over one state space"
    node_kind: "knowledge"
    cluster: "CL-2"
    role: "technique"
    summary: >-
      That the state space and the transition graph of a counting DP and an
      optimizing DP can be identical and only the AGGREGATION differs — sum over
      incoming transitions instead of min/max — and what changes as a
      consequence: base cases become 1 rather than 0 or infinity, unreachable
      states become 0 rather than a sentinel, and every transition must now be
      counted exactly once rather than merely considered. The last clause is
      where counting DP gets hard, and it is what the loop-order node below is
      about.
