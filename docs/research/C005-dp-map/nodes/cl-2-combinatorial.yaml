  - id: "cl-2.rerooting-principle"
    name: "Rerooting principle"
    node_kind: "knowledge"
    cluster: "CL-2"
    role: "technique"
    summary: >-
      That the answer for EVERY vertex as root is obtainable in one pass more
      than the answer for one, because a vertex's view of the tree splits into
      its own subtree (already computed downward) and everything else (derivable
      from its parent's corresponding value). The decomposition — down-value plus
      up-value — is the whole idea, and it converts a quadratic
      recompute-per-root into two traversals.
