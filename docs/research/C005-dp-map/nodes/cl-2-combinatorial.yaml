  - id: "cl-2.implement-tree-dp-post-order-dfs"
    name: "Implement a tree DP as a post-order DFS"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6. S1 no, S2 no (making it run, not faster), S3 no, S4
      no, S5 no (the contract is chosen). S6 rather than S7: the accumulator's
      initial value must be the fold's identity for THIS aggregation (zero for a
      sum, negative infinity for a max, one for a product) and the parent must
      be excluded from the child list in a way that depends on the chosen
      representation — judgments about this recurrence. Contrast
      cl-2.root-an-unrooted-tree, which really is invariant and is typed S7.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Realize the recurrence: recurse into each child, fold the returned values
      into the accumulator, apply the vertex's own contribution, return. The
      base case is not written separately — it is what the fold produces on the
      empty child list, and seeing that is part of the acquisition.
    prerequisites:
      intra_cluster:
        - "cl-2.formulate-subtree-recurrence"
        - "cl-2.root-an-unrooted-tree"
        - "cl-2.child-aggregation"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 4
      state_formulation_load: 1
      transition_derivation_load: 2
      proof_obligation_load: 0
      implementation_load: 2
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E1"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — the flagship recursion finding of this audit. This node writes
        the post-order DFS, and the post-order DFS is exactly the shape JavaScript cannot run at
        competitive sizes. C++'s recursive post-order on a tree of n = 2e5 reaches depth 2e5 on
        a path-shaped tree; the default 8 MB stack absorbs it, and judges raise the limit for
        the cases that need more. JavaScript throws RangeError: Maximum call stack size exceeded
        at a depth on the order of 1e4 — an order of magnitude BELOW the input sizes this
        technique routinely meets — and a submitted program cannot raise the limit. So the
        recursive realization is not slow in JavaScript, it does not run at all on the standard
        adversarial input. The JavaScript realization must convert to an EXPLICIT STACK, which
        is materially harder than the recursion it replaces: post-order specifically requires
        either a two-phase visit marker or an iterator-position-per-node scheme, because a
        child's value must be folded into the parent AFTER all children are done. That
        conversion is a real acquisition a C++ learner never makes. A downstream agent that
        inherits the C++ default here ships an exercise that crashes.
    coverage:
      status: "unaudited"
      corpus_refs: ["C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"

  - id: "cl-2.debug-tree-dp-recursion-depth"
    name: "Diagnose a tree DP that dies on a path-shaped tree"
    node_kind: "skill"
    skill_type: "debugging"
    skill_type_rationale: >-
      Cascade stops at S3. S1 no, S2 no — the program CRASHES, which is neither
      a correctness argument nor a cost reduction. S3 yes: the work starts from
      a symptom that carries almost no information (a stack overflow, a
      segmentation fault, a silent non-zero exit on the largest test and nothing
      on the samples) and reasons back to a cause — the tree is a path, so the
      recursion is n deep. Later tests unreached.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Recognize the shape of the failure — passes every sample, dies only at
      full n, and the failing tree is degenerate — and repair it by converting
      the traversal to an explicit stack or by processing vertices in a
      precomputed reverse-BFS order, which needs no recursion at all. What a
      learner acquires is that the worst case of a tree is a path, and that
      "trees are shallow" is an assumption their code makes silently.
    prerequisites:
      intra_cluster:
        - "cl-2.implement-tree-dp-post-order-dfs"
      roots:
        - "cl-1.root.memoization-vs-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 5
      state_formulation_load: 1
      transition_derivation_load: 1
      proof_obligation_load: 0
      implementation_load: 3
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E1"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — this node IS the recursion-depth node, and both its threshold
        and its signature are language-specific. It diagnoses a tree DP that dies on a
        path-shaped tree. In C++ that death is a SEGFAULT (or a silent stack smash) at a depth
        on the order of 1e5-1e6, and the standard fix is to raise the stack limit — an option
        that exists. In JavaScript it is a NAMED, CATCHABLE RangeError: Maximum call stack size
        exceeded at a depth on the order of 1e4, and raising the limit IS NOT AN OPTION for a
        submitted program, so the only fix is the explicit-stack rewrite
        (cl-2.implement-tree-dp-post-order-dfs). Three things a downstream agent must therefore
        write differently: the threshold is ~10x lower, the diagnosis is easier (a named error
        naming its own cause, versus a segfault that names nothing), and the remedy set is
        strictly smaller (one option, not two). The node's C++-derived form would teach a fix
        JavaScript does not have.
      mapper_note: >-
        Observation only, NOT a verdict — OUT-5 (SUB-8) owns it. Recorded because this node is
        where the root-level observation on cl-1.root.implement-memoization-and-tabulation
        (recursion depth is language-material in JavaScript) becomes acute rather than
        theoretical: a path-shaped tree of 2*10^5 vertices is a routine constraint and is far
        beyond JavaScript's default stack, which — unlike the C++ that every selected reference
        assumes — has no standard tunable equivalent. The explicit-stack rewrite may therefore
        be mandatory in JavaScript where it is optional in the references. SUB-8 must reach its
        own verdict; this note is not one.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    notes: >-
      Empty corpus_refs: systematic for `debugging` nodes. See
      cl-2.debug-item-reuse-from-loop-direction's note. D-F2 limitation.

