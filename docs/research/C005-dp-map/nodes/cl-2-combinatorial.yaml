  - id: "cl-2.debug-interval-order-violation"
    name: "Diagnose an interval DP that reads uncomputed states"
    node_kind: "skill"
    skill_type: "debugging"
    skill_type_rationale: >-
      Cascade stops at S3. S1 no, S2 no — the DP is wrong, not slow. S3 yes: it
      begins with a symptom (an answer built from base-case-valued or
      zero-valued states; a result that is right for small n and wrong for
      large; a top-down version that agrees and a bottom-up one that does not)
      and reasons back to an evaluation order that violates containment. Later
      tests unreached.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Recognize the specific signature of an order violation — the table is
      fully populated, no index is out of bounds, nothing crashes, and the
      answer is silently built on unfinished states — and localize it by
      comparing against a memoized version that cannot violate the order. The
      technique a learner acquires is the differential: an order bug is exactly
      the bug that top-down cannot have.
    prerequisites:
      intra_cluster:
        - "cl-2.implement-interval-dp-length-loop"
      roots:
        - "cl-1.root.memoization-vs-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 6
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 0
      implementation_load: 3
      recognition_load: 4
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E9", "JS-E5"]
      severity: "idiom-shift"
      rationale: >-
        MATERIAL — the symptom this node diagnoses has a container-dependent signature in
        JavaScript that has no C++ counterpart. The bug is reading a state not yet computed. In
        C++ the table is a zero-initialized vector, so the read returns 0 and the wrong answer
        is a too-small optimum — one signature, always. In JavaScript the signature DEPENDS ON
        THE CONTAINER CHOICE (JS-E5), which the author made for performance reasons and now
        discovers has changed their debugging: a plain Array yields undefined, so the arithmetic
        yields NaN and the wrongness SPREADS and is loud, visible immediately and traceable to
        the first bad read; an Int32Array yields a silent 0, indistinguishable from a
        legitimately computed zero, so the wrongness is quiet and looks like a modelling error
        rather than an ordering error. A downstream agent must teach both signatures and must
        teach that the container decides which one the learner will see. That is a
        JavaScript-specific differential the inherited C++ taxonomy does not contain.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    notes: >-
      Empty corpus_refs: systematic for `debugging` nodes — see
      cl-2.debug-item-reuse-from-loop-direction's note. D-F2 limitation.

  - id: "cl-2.prove-interval-dp-correctness"
    name: "Prove an interval DP correct by induction on span"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1. The contribution is the argument: strong induction on
      the span, with the inductive step supplied by the last-operation
      decomposition (some operation is last; it partitions the range into two
      strictly shorter ones; those are optimal by hypothesis; the enumeration
      considers every candidate for last). No later test is reached.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Argue that enumerating splits yields the optimum: establish that every
      solution HAS a last operation (an exhaustiveness claim about the solution
      space, and the step that is usually skipped), that it induces the split,
      and that the halves are independent given it. Independence is where real
      interval problems fail this argument — and recognizing the failure is what
      forces an augmented state, which is the boundary-context node below.
    prerequisites:
      intra_cluster:
