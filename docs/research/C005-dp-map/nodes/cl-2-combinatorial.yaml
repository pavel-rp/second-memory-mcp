      Decide whether a tree DP can be rerooted at all. Two conditions, both
      easily assumed rather than checked: the problem must actually want a
      per-root answer, and the child aggregate must be re-computable with one
      child withheld. A learner acquires the check for the second — is the fold
      invertible; if not, are prefix-suffix aggregates affordable — before
