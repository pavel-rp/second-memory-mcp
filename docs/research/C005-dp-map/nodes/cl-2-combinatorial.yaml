  - id: "cl-2.implement-interval-dp-length-loop"
    name: "Implement an interval DP over a length-major loop"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6. S1 no, S2 no (making it run, not faster), S3 no, S4
      no, S5 no (the formulation is chosen). S6 rather than S7: the loop bounds
      must be derived from THIS formulation's endpoint convention and base-case
      span, and the split enumeration's range depends on whether the convention
      is closed or half-open — judgments about the specific recurrence, which is
      the schema §2.1 test for S6. Not S7: nothing here is a fixed idiom.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Realize the recurrence bottom-up: outer loop over span, inner over the
      left endpoint with the right derived, innermost over the split, with the
      base cases seeded at the smallest span. Or, equivalently and often more
      safely, realize it top-down and let recursion discover the order — a
      choice the learner should make deliberately rather than by habit.
    prerequisites:
      intra_cluster:
        - "cl-2.interval-evaluation-order-by-length"
        - "cl-2.formulate-interval-dp"
      roots:
