  - id: "cl-2.pseudo-polynomial-complexity"
    name: "Pseudo-polynomiality"
    node_kind: "knowledge"
    cluster: "CL-2"
    role: "technique"
    summary: >-
      That O(n·W) is polynomial in the VALUE of the capacity, not in its
      encoding length, and what follows: the knapsack DP is efficient exactly
      when W is small, and the same DP is useless when W is a 64-bit number even
      though n is tiny. The fact a learner needs in order to know when the table
      is the wrong tool — and the reason 0/1 knapsack is NP-hard and yet
      routinely solved.
    prerequisites:
      intra_cluster:
        - "cl-2.item-selection-state-space"
      roots: []
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-2"
      entry_gate: "gate-c"
      prerequisite_depth: 2
      state_formulation_load: 1
      transition_derivation_load: 1
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E5", "JS-E6"]
      severity: "performance"
      rationale: >-
        MATERIAL — pseudo-polynomiality is precisely the property that makes the CONSTANT FACTOR
        decide feasibility, so this is the one complexity-knowledge node where the language's
        performance envelope is part of the content rather than a footnote. The whole point of
        the node is that the O(nW) bound is not polynomial in the input SIZE, so whether a
        solution passes turns on how large an nW product the runtime clears — a quantity that is
        language-dependent by definition. The nW a JavaScript solution clears is smaller than
        the C++ default's, and JS-E5 (a flat typed array for the capacity table rather than a
        boxed Array) is what recovers most of the gap. A downstream agent who inherits a C++
        author's intuition for 'W up to about this much is fine' will state a threshold that
        does not hold. Recorded per JS-D1's exception: this is not blanket JS-E6 dilution, it is
        the node whose subject IS the constant-factor boundary. DIRECTIONAL ONLY — the audit
        does not and may not quantify the ratio (JS-U2, benchmarking out of scope).
      uncertainty: "JS-U2"
    coverage:
      status: "unaudited"
      corpus_refs: ["C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    aliases: ["pseudo-polynomial time", "weakly polynomial DP"]

  - id: "cl-2.descending-vs-ascending-capacity-loop"
    name: "Capacity-loop direction determines item multiplicity"
    node_kind: "knowledge"
    cluster: "CL-2"
    role: "technique"
    summary: >-
      When the two-axis table is collapsed to a single capacity array, the
      direction of the capacity loop decides WHICH RECURRENCE is computed:
      descending reads only values from the previous item's row and computes
      0/1; ascending reads values already updated for the current item and
      computes unbounded. The direction is not a detail of the same DP — it is
      the selector between two different DPs that share one line of code.
    prerequisites:
      intra_cluster:
        - "cl-2.zero-one-knapsack-recurrence"
        - "cl-2.unbounded-knapsack-recurrence"
      roots:
        - "cl-1.root.memoization-vs-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-3"
      entry_gate: "gate-c"
      prerequisite_depth: 3
      state_formulation_load: 2
      transition_derivation_load: 3
      proof_obligation_load: 2
      implementation_load: 2
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. That loop direction decides item multiplicity is a fact about which
        states are already overwritten when read. Identical in every language with in-place
        arrays.
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    contested_by: ["CL-4"]
    notes: >-
      contested_by CL-4, and the argument is worth stating because it is the
      closest call in this cluster. A T1 reading says: the 1D collapse takes a
      correct 2D recurrence and reduces its memory, therefore CL-4 (optimization)
      owns it. T1 is rejected here on T1's OWN wording — it requires the
      reduction leave "what the states MEAN" unchanged, and the ascending loop
      changes the recurrence from 0/1 to unbounded. A transformation that
      selects between two different semantics is not a cost reduction of one of
      them. The pure space-saving reading (descending only, semantics fixed) IS
      a live CL-4 claim and is carried, not smoothed. Route: D-F4a challenge (U4).

  - id: "cl-2.implement-knapsack-in-place-capacity-loop"
    name: "Implement a knapsack over a single in-place capacity array"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6. S1 no — no argument is constructed. S2 no — see the
      note on cl-2.descending-vs-ascending-capacity-loop: the loop direction
      selects the recurrence rather than accelerating a fixed one, so this is
      making it RUN, not run faster (the schema's own S2/S6 boundary, §2.1). S3
      no — no symptom is being diagnosed. S4 no. S5 no — the formulation and the
      variant are already chosen. S6 yes: realizing the chosen recurrence
      demands a judgment about THIS recurrence's dependencies (which previous
      state each write must still be able to read), which is precisely the
      S6/S7 line the schema draws — it is not a fixed idiom that does not vary.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Write the collapsed loop correctly for the chosen variant: pick the
      direction from the recurrence's read/write dependency rather than from
      memory, set the array's initial values to encode the base case
      (zero-initialised for "any capacity may be unfilled", minus-infinity or a
      sentinel for "exact capacity required"), and keep the bound arithmetic
      from underflowing. The base-case initialisation is a second, independent
      failure point that a learner meets here and nowhere else.
    prerequisites:
      intra_cluster:
        - "cl-2.descending-vs-ascending-capacity-loop"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 4
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 0
      implementation_load: 3
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E5", "JS-E6"]
      severity: "performance"
      rationale: >-
        MATERIAL — this is the canonical performance-bound DP table in the map, and it is the
        node that writes it. The C++ default is vector<int> dp(W+1): contiguous, unboxed, 4
        bytes a cell, chosen without deliberation. The direct JavaScript translation, new
        Array(W+1).fill(0), is a boxed polymorphic object whose packed-SMI representation is an
        engine optimization rather than a guarantee, and is lost on a single non-SMI write. The
        JavaScript idiom that matches the C++ default's actual behaviour is an explicit
        Int32Array(W+1) — a decision the C++ author never makes. The in-place single-array form
        makes this sharper, not softer: the whole technique exists to collapse the table to one
        row for memory, so the per-element overhead of the container is exactly what the
        technique is optimizing, and choosing the wrong container gives the memory back.
        NEU-935's observation on this node adds the interaction the audit confirms and that
        makes the choice non-obvious: THE SENTINEL CONSTRAINS THE CONTAINER. A knapsack that
        must distinguish 'unreachable' from 'reachable with value 0' seeds -Infinity, and
        -Infinity CANNOT LIVE IN AN Int32Array — it coerces to 0, silently turning every
        unreachable state into a legitimate-looking zero. So the typed-array choice forces
        either a Float64Array (which keeps -Infinity but doubles the memory the technique was
        collapsing the table to save) or an explicit integer sentinel with its own guard. C++'s
        single number type does not exist; its int and its INT_MIN are the same width and the
        question never arises. Directional, not quantified (JS-U2).
      uncertainty: "JS-U2"
      mapper_note: >-
        Observation only, NOT a verdict — OUT-5 (SUB-8) owns the verdict. A typed-array
        (Int32Array/Float64Array) capacity row behaves very differently from a plain JS array
        here, and the sentinel choice interacts with JavaScript's single number type in a way
        the C++ that every selected reference assumes does not surface. Recorded for SUB-8.
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    contested_by: ["CL-4"]

