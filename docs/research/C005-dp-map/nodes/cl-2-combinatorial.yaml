  - id: "cl-2.impose-topological-evaluation-order"
    name: "Impose a topological evaluation order on a DAG DP"
    node_kind: "skill"
    skill_type: "procedural"
    skill_type_rationale: >-
      Cascade runs to S7, asserted deliberately (schema §2.1 warns S7 is the
      stronger claim). S1 no, S2 no, S3 no, S4 no, S5 no — WHICH topological
      order is used does not matter, and where there is no choice there is no
      strategy. S6 no: the routine does not vary with the problem — compute a
      topological order, iterate it, relax outgoing edges. Every DAG DP runs the
      identical steps. That invariance is the S7 test, and it is what separates
      this node from cl-2.implement-interval-dp-length-loop, where the loop
      bounds are derived from the specific recurrence.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Give a DAG DP a valid evaluation order by computing a topological order of
      the state graph and processing states along it — or, equivalently, by
      memoizing and letting the recursion discover the order. What a learner
      acquires is that the two are the same act: topological order is what
      memoization computes implicitly, which is why top-down needs no ordering
      step and bottom-up does.
    prerequisites:
      intra_cluster:
        - "cl-2.dp-on-an-explicit-dag"
      roots:
        - "cl-1.root.memoization-vs-tabulation"
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-3"
      entry_gate: "gate-c"
      prerequisite_depth: 3
      state_formulation_load: 1
      transition_derivation_load: 1
      proof_obligation_load: 1
      implementation_load: 3
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E1"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING, and it changes WHICH ALGORITHM is chosen — the sharpest form the
        recursion cap takes. There are two standard ways to impose a topological order: a
        recursive DFS with post-order emission, and Kahn's iterative in-degree BFS. In C++ they
        are interchangeable and the DFS one is often preferred for brevity. In JavaScript they
        are NOT interchangeable: the DFS recurses to the DAG's longest path, which on a
        2e5-vertex DAG is up to 2e5 frames against a ~1e4 cap, so it does not run — while Kahn's
        is a queue loop with O(1) stack depth and runs fine. So a choice that is stylistic in
        C++ is a FEASIBILITY choice in JavaScript: the iterative algorithm is not merely the
        safer option, it is the option. A downstream agent inheriting the C++ default's
        indifference between the two would present a broken one as an equal alternative. (A
        recursive DFS with an explicit stack is the third option and is also fine; the point is
        that the naive recursion is not.)
    coverage:
      status: "unaudited"
      corpus_refs: ["C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    aliases: ["topological sort DP", "processing states in topological order"]
    notes: >-
      *** AR-1 REQUEST IN FLIGHT — anchor.topological-order ***
      This node has a genuine NON-DP prerequisite that is NOT in
      boundary-register.yaml: topological ordering of a directed graph (Kahn's
      algorithm / DFS finish order) and its correctness. Per route AR-1 the
      dependency is recorded here and `status` is "provisional". It is NOT
      invented as a local anchor, NOT faked as a `prerequisites.roots` edge, and
      NOT declared as a cross_cluster_attachment — all three are AR-1-forbidden.
      Why it is genuinely non-DP: it computes no recurrence and has no
      optimal-substructure claim; the D-F4 §3 cascade does not own it (T1..T3
      all reject; it is not a DP technique at all). Why it is above NEU-887's
      elementary floor: unlike a bare DFS (see cl-2.root-an-unrooted-tree, where
      SUB-4 judged the traversal to be AT the floor and did NOT open a request),
      topological order is a named algorithm with a correctness argument that
      the DP's validity rests on directly.
      LEDGER: the D-S3 request belongs in
      ../C005-dp-map-schema/adjudication/01_schema-decision-ledger.md, which is
      SUB-2's file. SUB-4 is sole writer of this file ONLY and cannot write the
      ledger without breaking the ownership rule that makes the parallel fan-out
      safe. The request is therefore carried here and surfaced in NEU-935's PR
      for SUB-2/OUT-7. Named gap, named owner — not a defect to be discovered.

