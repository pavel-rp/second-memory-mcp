  - id: "cl-2.item-selection-state-space"
    name: "Item-selection state space"
    node_kind: "knowledge"
    cluster: "CL-2"
    role: "technique"
    summary: >-
      The state space of a selection DP: a subproblem is identified by which
      items are still available to decide (canonically a prefix of the item
      list) together with how much of a bounded resource remains. The key fact
      is WHY a prefix suffices — the items already decided influence the future
      only through the resource consumed, so the exponential set of chosen
      subsets collapses to a two-axis table. Acquiring this is acquiring why
      2^n subsets need not be enumerated.
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.optimal-substructure"
        - "cl-1.root.overlapping-subproblems"
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-1"
      entry_gate: "gate-a"
      prerequisite_depth: 1
      state_formulation_load: 2
      transition_derivation_load: 1
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. The state space — items considered against a resource axis — is a
        modelling fact. The table's realization is recorded on
        cl-2.implement-knapsack-in-place-capacity-loop (JS-D2).
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    aliases: ["selection DP state", "prefix-and-capacity state"]
    contested_by: ["CL-1"]
    notes: >-
      contested_by CL-1: a T4 reading sees (i, w) as a plain index tuple over a
      rectangular domain. Carried, not smoothed. The T3 argument is that the
      collapse of subsets to a prefix IS the combinatorial content; see the
      section header. Route on disagreement: D-F4a challenge (U4).

  - id: "cl-2.zero-one-knapsack-recurrence"
    name: "0/1 knapsack recurrence"
    node_kind: "knowledge"
    cluster: "CL-2"
    role: "technique"
    summary: >-
      The take-or-leave recurrence over an item prefix and a remaining capacity,
      and the specific fact that makes it 0/1: the recurrence for item i reads
      only states computed for the prefix WITHOUT item i, so no optimal solution
      can contain the same item twice. The at-most-once constraint is enforced by
      the shape of the transition, not by a check.
    prerequisites:
      intra_cluster:
        - "cl-2.item-selection-state-space"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-2"
      entry_gate: "gate-c"
      prerequisite_depth: 2
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 1
      implementation_load: 2
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. The take-or-leave recurrence maximizes over two candidates. No
        multiplication, no recursion, no 2^53 approach.
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    aliases: ["binary knapsack", "0-1 knapsack"]
    contested_by: ["CL-1"]

  - id: "cl-2.formulate-zero-one-knapsack"
    name: "Formulate a 0/1 knapsack: choose the resource axis and the item order"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5. S1 no — no correctness argument is being made here,
      only a formulation chosen (the proof is cl-2.prove-zero-one-knapsack-
      correctness, a separate node per schema §1.1). S2 no — no correct
      recurrence exists yet, so there is nothing to accelerate; this is the exact
      S2/S5 boundary the schema §2.1 draws. S3 no — no symptom. S4 no — the
      problem is stated as a selection under a bound; nothing is hidden (that is
      cl-2.recognize-knapsack-under-an-unfamiliar-surface). S5 yes: deciding
      WHICH quantity becomes the bounded axis and which becomes the value is a
      choice among candidate formulations under a cost constraint, and it is the
      choice that makes the difference between a viable table and an intractable
      one.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Given a selection problem with one or more bounded resources, decide what
      the DP indexes: which quantity is the capacity axis (small, integral,
      bounded) and which is maximized (possibly large, possibly real). The
      canonical exercise is the knapsack whose weights are huge and whose values
      are small — where the naive axis choice is intractable and the swapped one
      is not. A learner acquires the judgment, not the table.
    prerequisites:
      intra_cluster:
        - "cl-2.zero-one-knapsack-recurrence"
        - "cl-2.pseudo-polynomial-complexity"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
        - "cl-1.root.recognize-optimal-substructure"
      boundary_anchors: []
    cross_cluster_attachments:
