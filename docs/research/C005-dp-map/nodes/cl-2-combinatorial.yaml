      — the DP is WRONG, not slow, so there is nothing correct to accelerate.
      S3 yes: the work starts from a SYMPTOM (the answer is too large; a trace
      shows one item taken twice; or the mirror symptom, an unbounded knapsack
      returning a 0/1 answer) and reasons back to the cause (the loop runs the
      wrong way). Later tests are never reached.
