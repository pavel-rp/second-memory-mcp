  - id: "cl-1.handle-grid-boundaries-and-obstacles"
    name: "Handle grid boundaries and obstacles"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6: the formulation is already chosen and the work is realizing
      it without the edges breaking it. S7 rejected on the schema §2.1 test — the
      sentinel value is a judgment about THIS recurrence (0 is the right absorbing
      value for a counting DP, infinity for a minimization, and getting it backwards
      produces a plausible wrong answer), so the step varies with the problem. S3
      rejected: this is building it right, not diagnosing it wrong. S2 rejected: no
      cost is being reduced.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Make a grid DP correct at its edges: choose the sentinel that makes an
      out-of-bounds or blocked cell absorb correctly under THIS recurrence's operator,
      decide between a padded border and explicit bounds checks, and place the base
      case so it is not itself overwritten by the transition. Worth a node because the
      failure is universal and specific — a grid DP with a wrong boundary produces
      correct-looking output on the interior and is wrong only at the margin, which is
      the hardest kind of wrong to see.
    prerequisites:
      intra_cluster:
        - "cl-1.formulate-grid-path-dp"
        - "cl-1.order-2d-table-evaluation"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 6
      state_formulation_load: 1
      transition_derivation_load: 1
      proof_obligation_load: 0
      implementation_load: 3
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E9", "JS-E5"]
      severity: "idiom-shift"
      rationale: >-
        MATERIAL — the guard idiom and the failure signature both differ from the C++ default.
        In C++ an out-of-range vector read is undefined behaviour, which is WHY the
        sentinel-padding idiom exists: the pad is not a convenience, it is what keeps the
        program defined. In JavaScript an out-of-range Array read is defined and returns
        undefined, which becomes NaN in arithmetic and then propagates through every downstream
        comparison silently (NaN < x is always false, so a max-fold quietly ignores it). So a
        JavaScript author CAN lean on the read returning undefined where a C++ author must not —
        but must then guard the NaN, a failure mode C++ does not have. JS-E5 compounds it: the
        same out-of-range read on an Int32Array is also undefined, but an uninitialized IN-range
        cell is 0, which for a path-counting grid is a legitimate value and therefore invisible.
        The correct JavaScript idiom (explicit bounds test, or sentinel padding chosen
        deliberately rather than inherited) must be written; it cannot be assumed from the C++
        default.
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"

  - id: "cl-1.counting-dp-over-linear-domain"
    name: "Counting DP over a linear or rectangular domain, modulo a prime"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      What changes when a linear or grid DP counts rather than optimizes: the
      transition becomes a SUM over cases instead of a min/max, which is why
      disjointness stops being free and becomes a real obligation (a min over
      overlapping cases is harmless; a sum over them is wrong). And because the counts
      are astronomically large, the answers are reported modulo a prime, so every
      combine is modular — which is a genuine non-DP prerequisite and is drawn onto the
      registered anchor rather than assumed away. The node exists to make the
      optimization/counting distinction explicit rather than leaving it implicit in
      each family: it changes the proof obligation, not just the operator.
    prerequisites:
      intra_cluster:
        - "cl-1.grid-path-dp"
        - "cl-1.linear-sequence-dp-1d"
        - "cl-1.dp-correctness-proof-obligations"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors:
        - "anchor.modular-arithmetic@1.0.0"
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 5
      state_formulation_load: 2
      transition_derivation_load: 3
      proof_obligation_load: 2
      implementation_load: 2
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E2", "JS-E3"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — the modulus is constitutive of this node (it draws
        anchor.modular-arithmetic), and the C++ one-liner it inherits is silently wrong in
        JavaScript. With the standard M = 1e9+7, two residues below M have a product up to
        ~1e18, which is ~111x past 2^53. So `(a * b) % 1000000007` — exact in C++ long long, and
        written without a thought — silently ROUNDS in JavaScript and returns a plausible, wrong
        residue. This is not a performance note: the direct translation of the C++ default
        produces wrong answers on most inputs. A correct JavaScript counting DP under a modulus
        requires BigInt for the multiply, or a split multiply keeping every partial product
        under 2^53 (decomposing one operand around 2^26, folding with Math.imul). Addition is
        safe (2M < 2^53); multiplication is not. This is the single highest-impact JavaScript
        effect in the map and it is invisible unless stated.
      mapper_note: >-
        Foreseen, NOT assessed — SUB-8 (OUT-5) owns the verdict. Observation only: modular
        multiplication of two values near a 1e9 prime exceeds JavaScript's exact-integer range
        for Number, so the C++ `long long` idiom every selected reference writes has no direct
        equivalent and forces a choice (BigInt, or splitting the multiply). This is an
        observation that a materiality question exists on this node's anchor edge, NOT a verdict
        — SUB-8 owns that.
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    aliases: ["counting DP", "path counting mod p"]
    notes: >-
