  - id: "cl-1.judge-dp-applicability"
    name: "Judge whether a problem admits a DP formulation"
    node_kind: "skill"
    skill_type: "conceptual"
    skill_type_rationale: >-
      Cascade reaches S8 as a CONFIDENT residual. S1 no — the learner is judging, not
      arguing; the formal argument that the properties hold is a separate obligation
      (cl-1.prove-recurrence-correctness). S2 no — no recurrence exists yet to
      accelerate. S3 no — the trigger is a problem statement, not a symptom. S4 no —
      this is applied to problems whose shape is readable; the unfamiliar-surface case
      is cl-1.recognize-dp-formulation-under-unfamiliar-surface. S5 no — this is a
      yes/no property judgment about DP as a class, not a choice AMONG formulations
      (that is cl-1.select-linear-dp-pattern). S6/S7 no — no code, no routine.
      Residual: understanding what the two properties MEAN well enough to see them
      together in a live problem. That is "conceptual".
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Given a problem statement, judge whether BOTH DP properties hold together — that
      an optimal solution decomposes into subproblem optima AND that those subproblems
      recur — and therefore whether DP is the right tool at all. Distinct from the two
      roots it stands on, which each check ONE property in isolation: the acquisition
      here is the JOINT judgment, including the two ways it goes wrong (substructure
      without overlap, which is divide-and-conquer; overlap without substructure, which
      is a search problem memoization cannot rescue). This is the first thing a learner
      does with a problem and the first thing that silently fails: a learner who cannot
      make it writes a correct-looking DP for a problem that does not have one.
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.recognize-optimal-substructure"
        - "cl-1.root.recognize-overlapping-subproblems"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"

  - id: "cl-1.linear-dp-pattern-catalogue"
    name: "The catalogue of linear/sequence DP state patterns"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      The small set of recurring state shapes that covers most linear and rectangular
      DP, held as a comparable set rather than as isolated facts: prefix-index state
      ("answer over the first i"), element-anchored state ("best ending exactly at i"),
      two-sequence index pair ("first i of A against first j of B"), grid coordinate,
      sequence-plus-mode (a small auxiliary dimension), and index-plus-count (partition
      into k parts). What makes this a node rather than a list is the CONTRASTS between
      them — which shapes are interchangeable, which are not, and what question each
      one answers — because the strategic skill that stands on it is a choice, and a
      choice needs a compared set of alternatives, not an enumeration.
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    aliases: ["DP state archetypes", "linear DP patterns"]

  - id: "cl-1.select-linear-dp-pattern"
    name: "Choose which linear/sequence DP pattern fits a problem's shape"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5. It is CHOOSING — among the compared alternatives in
      cl-1.linear-dp-pattern-catalogue — under a correctness constraint (the chosen
      state must be sufficient) and a cost constraint (its state space must be
      affordable). S1 no — the proof that the chosen state IS sufficient is the
      separate obligation cl-1.prove-prefix-state-sufficiency; this node picks, that
      one licenses. S2 no — nothing correct exists yet to accelerate; this is the
      boundary that keeps CL-4 distinct. S3 no — driven by a statement, not a symptom.
      S4 no — the pattern is recoverable from the statement's shape; the disguised case
      belongs to the transfer node.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Read a problem's shape and pick the state pattern that fits it: recognize that
      "count the ways to reach the end" wants a prefix-index state while "longest run
      ending somewhere" wants an element-anchored one, that two independent sequences
      want an index pair, and that a constraint the prefix index cannot remember wants
      an extra mode dimension rather than a cleverer transition. The specific,
      pattern-level instance of the root formulation skill: the root says "design a
      state", this says "and here is the compared menu you are choosing from, and the
      shape-features in the statement that discriminate between them".
    prerequisites:
      intra_cluster:
        - "cl-1.linear-dp-pattern-catalogue"
        - "cl-1.judge-dp-applicability"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"

  - id: "cl-1.derive-recurrence-routine"
    name: "Derive a state / transition / base case from a problem statement by routine"
    node_kind: "skill"
    skill_type: "procedural"
    skill_type_rationale: >-
      Cascade stops at S7, and this is the file's closest call — the rationale states
      the rival explicitly rather than hiding the tension (schema §3.1, Convention S).
      S1/S2/S3/S4 reject cleanly (no argument, no existing recurrence, no symptom, no
      unfamiliar surface). S5 "strategic" is the RIVAL and has a real claim: deriving a
      recurrence obviously involves judgment. The line drawn: the ROUTINE'S STEPS do
      not vary with the problem — always "name the last decision, ask what the answer
      depends on after that decision is fixed, promote exactly that into the state,
      write the transition as a case per decision option, read the base cases off the
      decisions that no longer exist, name the answer state" — which is S7's literal
      test. What varies is the routine's OUTPUT, not its steps. The JUDGMENT inside
      step three is real and is carried by a separate node (cl-1.select-linear-dp-
      pattern, S5), so this node is the drill and that node is the choice. S6 rejected:
      no code. Typed S7 with the rival named; see `notes` for the re-adjudication route.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Execute the fixed derivation drill that turns a problem statement into a
      candidate recurrence, reliably and without inspiration: identify the last
      decision, determine what must be remembered once it is fixed, promote exactly
      that into the state, enumerate the transition as one case per decision option,
      identify the base cases, and name the state that holds the answer. What a learner
      acquires is REPEATABILITY — the ability to get a candidate recurrence out of any
      tractable statement without waiting for insight. The candidate may be wrong; that
      is what the proof and debugging nodes are for.
    prerequisites:
      intra_cluster:
        - "cl-1.judge-dp-applicability"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    contested_by: []
    notes: >-
      SKILL-TYPE BOUNDARY, CARRIED NOT SMOOTHED. The S7/S5 line here is genuinely thin:
      the NEU-934 spec names this skill "procedural" and the cascade's S7 test (steps
      do not vary) supports that, but S5 fires on any reading where "promote exactly
      what must be remembered" is treated as a judgment about THIS problem rather than
      a step of a fixed drill. Typed S7 per the spec and the steps-do-not-vary test,
