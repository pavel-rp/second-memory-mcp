  # ---------------------------------------------------------------------------
  # SECTION 1 — 1D linear/sequence DP
  # ---------------------------------------------------------------------------

  - id: "cl-1.counting-dp-over-linear-domain"
    name: "Counting DP over a linear or rectangular domain, modulo a prime"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      What changes when a linear or grid DP counts rather than optimizes: the
      transition becomes a SUM over cases instead of a min/max, which is why
      disjointness stops being free and becomes a real obligation (a min over
      overlapping cases is harmless; a sum over them is wrong). And because the counts
      are astronomically large, the answers are reported modulo a prime, so every
      combine is modular — which is a genuine non-DP prerequisite and is drawn onto the
      registered anchor rather than assumed away. The node exists to make the
      optimization/counting distinction explicit rather than leaving it implicit in
      each family: it changes the proof obligation, not just the operator.
    prerequisites:
      intra_cluster:
        - "cl-1.grid-path-dp"
        - "cl-1.linear-sequence-dp-1d"
        - "cl-1.dp-correctness-proof-obligations"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors:
        - "anchor.modular-arithmetic@1.0.0"
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 5
      state_formulation_load: 2
      transition_derivation_load: 3
      proof_obligation_load: 2
      implementation_load: 2
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E2", "JS-E3"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — the modulus is constitutive of this node (it draws
        anchor.modular-arithmetic), and the C++ one-liner it inherits is silently wrong in
        JavaScript. With the standard M = 1e9+7, two residues below M have a product up to
        ~1e18, which is ~111x past 2^53. So `(a * b) % 1000000007` — exact in C++ long long, and
        written without a thought — silently ROUNDS in JavaScript and returns a plausible, wrong
        residue. This is not a performance note: the direct translation of the C++ default
        produces wrong answers on most inputs. A correct JavaScript counting DP under a modulus
        requires BigInt for the multiply, or a split multiply keeping every partial product
        under 2^53 (decomposing one operand around 2^26, folding with Math.imul). Addition is
        safe (2M < 2^53); multiplication is not. This is the single highest-impact JavaScript
        effect in the map and it is invisible unless stated.
      mapper_note: >-
        Foreseen, NOT assessed — SUB-8 (OUT-5) owns the verdict. Observation only: modular
        multiplication of two values near a 1e9 prime exceeds JavaScript's exact-integer range
        for Number, so the C++ `long long` idiom every selected reference writes has no direct
        equivalent and forces a choice (BigInt, or splitting the multiply). This is an
        observation that a materiality question exists on this node's anchor edge, NOT a verdict
        — SUB-8 owns that.
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    aliases: ["counting DP", "path counting mod p"]
    notes: >-
      The `anchor.modular-arithmetic@1.0.0` edge is this cluster's ONLY boundary-anchor
      draw, and it is a genuine one: modular arithmetic is not DP (it computes no
      recurrence), it is a real prerequisite of this node, and it sits above NEU-887's
      elementary floor — the register's own three-part test, satisfied. Drawn directly
      per schema §4.1 (anchors are a shared frozen floor); no AR-1 request was needed.

  # ---------------------------------------------------------------------------
  # SECTION 5 — Longest increasing subsequence (quadratic)
  # ---------------------------------------------------------------------------

  - id: "cl-1.longest-increasing-subsequence-quadratic"
    name: "Longest increasing subsequence, O(n^2) recurrence"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      The canonical element-anchored DP: dp[i] is the length of the longest increasing
      subsequence ENDING EXACTLY at i, computed by scanning every earlier j with
      a[j] < a[i] and taking the best, with the answer the maximum over all i. Its
      importance to the cluster is out of proportion to the problem itself, because it
      is where the prefix-index state VISIBLY fails: "the LIS of the first i elements"
      is not a sufficient state, since extending a subsequence requires knowing what it
      ends with, and the prefix-optimum has forgotten. LIS is the standard worked
      example of the sufficiency obligation, which is why it sits on the shared
      element-anchored pattern node rather than owning that insight privately.
    prerequisites:
      intra_cluster:
        - "cl-1.best-ending-at-index-state-pattern"
        - "cl-1.linear-sequence-dp-1d"
      roots:
        - "cl-1.root.optimal-substructure"
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-3"
      entry_gate: "gate-c"
      prerequisite_depth: 3
      state_formulation_load: 2
      transition_derivation_load: 3
      proof_obligation_load: 1
      implementation_load: 2
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. The O(n^2) recurrence compares elements and adds 1; it never
        multiplies, never approaches 2^53, and iterates rather than recursing. Deliberate
        non-claim: the O(n log n) LIS — where a JavaScript author would confront JS-E8's absent
        lower_bound-capable ordered container — is an adjudicated coverage gap (INC-C1), mapped
        by nobody, so there is no node here to audit. See JS-U3; not invented.
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    aliases: ["LIS", "longest increasing subsequence"]
    contested_by: []
    notes: >-
      SCOPE — THE CLUSTER LINE RUNS THROUGH THIS PROBLEM, BY DESIGN. This node is the
      O(n^2) RECURRENCE only. LIS in O(n log n) via a monotone structure is a DIFFERENT
      NODE IN A DIFFERENT CLUSTER (CL-4), and D-F4 §3.2 names this exact pair as its
      worked demonstration that same-problem/different-contribution splits across
      clusters: "LIS in O(n²) is CL-1; LIS in O(n log n) is CL-4. Same problem,
      different node." Recorded as EXC-5. Not a gap and not a contested assignment —
      the split is the partition working as specified, and `contested_by` is
      deliberately empty because CL-4 has no claim on the recurrence itself.

  - id: "cl-1.formulate-lis-best-ending-here"
    name: "Formulate LIS with an element-anchored state"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5: it is the CHOICE between two candidate states — prefix
      optimum versus element-anchored — under a correctness constraint, and it is the
      cluster's sharpest instance of that choice because the intuitive candidate is the
      wrong one. S1 no: proving the survivor correct is the adjacent proof node. S2 no:
      the O(n log n) acceleration presupposes this recurrence and is CL-4's. S4 no: LIS
      presented as LIS has no unfamiliar surface; the disguised case is its own node.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Reject the prefix-optimum state for LIS and choose the element-anchored one, for
      the right reason: the transition needs to compare the candidate's last element
      against a[i], so the state must remember it, and anchoring the endpoint is what
      makes it available. What a learner acquires is not "the LIS recurrence" but the
      DISCRIMINATION — the ability to notice that a state has forgotten something the
      transition needs, before writing code that silently returns wrong answers.
    prerequisites:
      intra_cluster:
