  - id: "cl-1.dp-failure-modes"
    name: "The taxonomy of DP failure modes and their symptoms"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      The mapping from what a broken DP DOES to what is wrong with it, held as a
      taxonomy: an insufficient state (wrong answer on a case where two histories
      reaching the same state were not actually interchangeable); a non-exhaustive
      transition (answer too small on optimization, too low on counting); an
      overlapping transition (double-counted answer, exact-multiple-of-something in the
      classic case); a wrong or missing base case (wrong answer at the smallest input,
      often only there); an evaluation order that reads a not-yet-computed state (order-
      dependent garbage, frequently zero); an off-by-one at the domain boundary. The
      knowledge is the CORRESPONDENCE, not the list — the reason a symptom narrows the
      search is that different causes produce different symptoms.
    prerequisites:
      intra_cluster:
        - "cl-1.dp-correctness-proof-obligations"
      roots:
        - "cl-1.root.memoization-vs-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-2"
      entry_gate: "gate-c"
      prerequisite_depth: 2
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E1", "JS-E2", "JS-E9"]
      severity: "idiom-shift"
      rationale: >-
        MATERIAL — this node's content IS the symptom list, and JavaScript's symptom list
        differs from the C++ one this taxonomy inherits. Three concrete divergences a downstream
        agent must write: (1) JS-E1 — a too-deep DP dies at ~10^4 frames with 'RangeError:
        Maximum call stack size exceeded', a named, catchable, immediate failure; the C++
        counterpart is a segfault an order of magnitude deeper, or silent stack corruption. (2)
        JS-E2 — arithmetic past 2^53 ROUNDS, producing a plausible near-miss; the C++
        counterpart WRAPS, often producing an obviously absurd or negative value. A learner
        debugging in JavaScript therefore gets a weaker signal from a wrong number than a C++
        learner does. (3) JS-E9 — reading an uncomputed state yields a spreading NaN (plain
        Array) or a silent, legitimate-looking 0 (typed array), where C++ yields UB. The
        taxonomy as inherited would under-describe all three.
      mapper_note: >-
        Foreseen, NOT assessed — SUB-8 (OUT-5) owns the verdict. Observation only: the "stack
        overflow" symptom that a C++-oriented reference attributes to deep top-down recursion
        presents differently in JavaScript (a RangeError at a non-tunable default depth reached
        at far smaller n), so the symptom→cause row for that failure mode may not transfer as
        written. An observation, not a verdict.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"

  - id: "cl-1.diagnose-wrong-state-transition-base-case"
    name: "Diagnose a wrong state, transition, or base case from a failing DP"
    node_kind: "skill"
    skill_type: "debugging"
    skill_type_rationale: >-
      Cascade stops at S3: the trigger is a SYMPTOM of an existing, broken DP — a wrong
      answer on a case, an answer that is a suspicious multiple of the truth, a value
      that is right for n=5 and wrong for n=1 — and the contribution is reasoning back
      from it to the defect. S1 no — the learner is localizing a fault, not arguing
      correctness (though the proof obligations are what make the search finite, which
      is why this node requires them). S2 no — the DP is wrong, not slow; a TLE-driven
      diagnosis on a correct DP is CL-4's territory by D-F4 T1. S4/S5 no — nothing is
      being recognized or chosen.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Take a DP that produces a wrong answer and find which of the four obligations it
      violates, without rewriting it from scratch: shrink to the smallest failing case,
      compare the table against a brute force to find the FIRST divergent state (the
      one whose inputs are all correct — the defect is in that transition, not
      downstream of it), and read the defect class off the symptom. What a learner
      acquires is that a wrong DP is LOCALIZABLE rather than something to be stared at
      or replaced. The single highest-value skill in the cluster for a competitor,
      because the failure is common and the naive response — rewrite and hope — is
      unbounded.
    prerequisites:
      intra_cluster:
        - "cl-1.dp-failure-modes"
        - "cl-1.dp-correctness-proof-obligations"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-3"
      entry_gate: "gate-c"
      prerequisite_depth: 3
      state_formulation_load: 2
      transition_derivation_load: 3
      proof_obligation_load: 1
      implementation_load: 3
      recognition_load: 4
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E2", "JS-E9"]
      severity: "idiom-shift"
      rationale: >-
        MATERIAL — the differential diagnosis gains two JavaScript-specific branches that must
        be excluded BEFORE concluding the state, transition, or base case is wrong. The symptom
        this node starts from is a wrong answer, and in JavaScript a wrong answer is produced by
        two language-level causes that cannot produce it in C++: JS-E2 silent rounding past 2^53
        (a correct recurrence returning a near-miss), and JS-E9 a NaN or a spurious 0 from an
        uncomputed cell. A learner who does not know to rule these out first will rewrite a
        correct recurrence. That changes what this node teaches.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    aliases: ["DP fault localization", "stress-testing a DP"]

