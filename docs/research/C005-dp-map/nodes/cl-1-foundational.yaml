  - id: "cl-1.prove-path-transition-partition"
    name: "Prove a path transition partitions the solution set exactly once"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1: the contribution is the ARGUMENT that the transition's cases
      are exhaustive and pairwise disjoint — that every path into a cell is counted by
      exactly one case. S3 rejected although double-counting is a famous SYMPTOM: this
      node is the argument made in advance, cl-1.diagnose-wrong-state-transition-base-
      case is the one that starts from the wrong number. Same subject matter, opposite
      direction, two nodes — a learner can routinely detect a doubled count and still
      not be able to argue a transition sound.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Discharge the exhaustiveness and disjointness obligations for a counting DP over
      paths: argue that classifying paths by their LAST MOVE covers every path (there
      is always a last move, except at the base case) and covers none twice (a path has
      exactly one last move). The last-move classification is the standard instrument
      and the reason it works is worth acquiring explicitly — it is a partition of the
      solution set induced by a function on it, which is the general move that makes
      counting DP sound and that recurs in every counting family in the map.
    prerequisites:
      intra_cluster:
        - "cl-1.formulate-grid-path-dp"
        - "cl-1.prove-recurrence-correctness"
        - "cl-1.dp-correctness-proof-obligations"
