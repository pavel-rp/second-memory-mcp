  - id: "cl-1.dp-correctness-proof-obligations"
    name: "What a DP recurrence must prove: the four obligations"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      A DP is correct only if four separable things hold, and knowing they are four
      rather than one vague "it works" is the content of this node: (1) STATE
      SUFFICIENCY — the state captures everything the future depends on, so two
      histories reaching the same state are genuinely interchangeable; (2) TRANSITION
      EXHAUSTIVENESS — every way of reaching a state is covered by some case; (3)
      TRANSITION DISJOINTNESS — for counting DP, no way is covered twice (for
      optimization DP this weakens to "no case is invalid"); (4) BASE-CASE CORRECTNESS
      — the given values are right and the derived values never depend on an undefined
      one. Knowledge, not skill: these are the obligations, stated. Discharging them is
      cl-1.prove-recurrence-correctness.
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.optimal-substructure"
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"

  - id: "cl-1.prove-recurrence-correctness"
    name: "Prove a DP recurrence correct and its optimal substructure sound"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1 immediately: the whole contribution is ESTABLISHING BY
      ARGUMENT that a recurrence computes what it claims. The two standard instruments
      are induction over the state's dependency order and the cut-and-paste exchange
      argument for optimal substructure. Contrast cl-1.judge-dp-applicability, which
      is typed S8 precisely because it JUDGES the same properties rather than arguing
      them — that pair is the schema's S1/S8 boundary made concrete in this cluster.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Discharge the four obligations for a specific recurrence: argue state sufficiency
      (typically by cut-and-paste — assume a better solution through this state, splice
      it in, contradict optimality), argue the transition's cases are exhaustive and
      non-overlapping, argue the base cases, and argue the state dependency order is
      acyclic so the induction is well-founded. The general act; the per-technique
      proof nodes below are this skill met again where a specific recurrence makes one
      obligation hard.
    prerequisites:
      intra_cluster:
        - "cl-1.dp-correctness-proof-obligations"
        - "cl-1.derive-recurrence-routine"
      roots:
        - "cl-1.root.optimal-substructure"
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
