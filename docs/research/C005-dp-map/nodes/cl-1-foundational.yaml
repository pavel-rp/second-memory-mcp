  - id: "cl-1.lcs-dp"
    name: "Longest common subsequence DP"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      The alignment DP with a restricted operation set: dp[i][j] is the length of the
      longest subsequence common to the two prefixes, with a match extending the
      diagonal and a mismatch taking the better of dropping from either string. Mapped
      as its own node rather than folded into edit distance because it is the OTHER
      pole of the same shape — a maximization over matches rather than a minimization
      over operations — and because the pair is what teaches that the shape is
      independent of the objective. Also the bridge to LIS: the LCS of a sequence and
      its sorted deduplicated self is its LIS, a relationship worth holding.
