      corpus_refs: []
    evidence_class: 1
    status: "settled"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-933"
    frozen: true

  # --- Principle 3: State / transition / base-case formulation ---------------

  - id: "cl-1.root.state-transition-base-case-formulation"
    name: "State, transition, and base-case formulation"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "root"
    summary: >-
      What a DP formulation IS: a state space (what a subproblem is identified by),
      a transition relation (how a state's value derives from other states'), and
      base cases (the states whose values are given, not derived). The vocabulary
      every DP technique in every cluster is expressed in.
    prerequisites:
      intra_cluster: []
      roots: []
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
