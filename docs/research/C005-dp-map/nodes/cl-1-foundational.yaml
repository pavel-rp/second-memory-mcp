      Cascade stops at S4: the trigger is a problem that does not mention subsequences
      at all — nesting boxes, stacking envelopes, chaining pairs, scheduling under a
      precedence — and the contribution is seeing the increasing-subsequence structure
      underneath. S5 rejected on the schema's own test: the mapping is HIDDEN, not
      readable from the statement. This is the LIS-specialized instance of the
      cluster's general transfer node, and it is separate because a learner can have
      the general stripping habit and still miss this specific structure, which is the
      most commonly disguised shape in the family.
