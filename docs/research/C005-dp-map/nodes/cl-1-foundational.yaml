  - id: "cl-1.dp-failure-modes"
    name: "The taxonomy of DP failure modes and their symptoms"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      The mapping from what a broken DP DOES to what is wrong with it, held as a
      taxonomy: an insufficient state (wrong answer on a case where two histories
      reaching the same state were not actually interchangeable); a non-exhaustive
      transition (answer too small on optimization, too low on counting); an
      overlapping transition (double-counted answer, exact-multiple-of-something in the
      classic case); a wrong or missing base case (wrong answer at the smallest input,
      often only there); an evaluation order that reads a not-yet-computed state (order-
      dependent garbage, frequently zero); an off-by-one at the domain boundary. The
      knowledge is the CORRESPONDENCE, not the list — the reason a symptom narrows the
      search is that different causes produce different symptoms.
    prerequisites:
      intra_cluster:
        - "cl-1.dp-correctness-proof-obligations"
      roots:
        - "cl-1.root.memoization-vs-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: >-
        Foreseen, NOT assessed — SUB-8 (OUT-5) owns the verdict. Observation only: the
        "stack overflow" symptom that a C++-oriented reference attributes to deep
        top-down recursion presents differently in JavaScript (a RangeError at a
        non-tunable default depth reached at far smaller n), so the symptom→cause row
        for that failure mode may not transfer as written. An observation, not a verdict.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"

  - id: "cl-1.diagnose-wrong-state-transition-base-case"
    name: "Diagnose a wrong state, transition, or base case from a failing DP"
    node_kind: "skill"
    skill_type: "debugging"
    skill_type_rationale: >-
      Cascade stops at S3: the trigger is a SYMPTOM of an existing, broken DP — a wrong
      answer on a case, an answer that is a suspicious multiple of the truth, a value
      that is right for n=5 and wrong for n=1 — and the contribution is reasoning back
      from it to the defect. S1 no — the learner is localizing a fault, not arguing
      correctness (though the proof obligations are what make the search finite, which
      is why this node requires them). S2 no — the DP is wrong, not slow; a TLE-driven
      diagnosis on a correct DP is CL-4's territory by D-F4 T1. S4/S5 no — nothing is
      being recognized or chosen.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Take a DP that produces a wrong answer and find which of the four obligations it
      violates, without rewriting it from scratch: shrink to the smallest failing case,
      compare the table against a brute force to find the FIRST divergent state (the
      one whose inputs are all correct — the defect is in that transition, not
      downstream of it), and read the defect class off the symptom. What a learner
      acquires is that a wrong DP is LOCALIZABLE rather than something to be stared at
      or replaced. The single highest-value skill in the cluster for a competitor,
      because the failure is common and the naive response — rewrite and hope — is
      unbounded.
    prerequisites:
      intra_cluster:
        - "cl-1.dp-failure-modes"
        - "cl-1.dp-correctness-proof-obligations"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    aliases: ["DP fault localization", "stress-testing a DP"]

  - id: "cl-1.recognize-dp-formulation-under-unfamiliar-surface"
    name: "Recognize that an unfamiliar problem admits a known DP formulation"
    node_kind: "skill"
    skill_type: "transfer"
    skill_type_rationale: >-
      Cascade stops at S4: the defining trigger is an UNFAMILIAR SURFACE — the problem
      does not mention sequences, subsequences, edits, or grids, and the contribution
      is seeing one of those underneath anyway. S1/S2/S3 reject cleanly (no argument,
      no existing recurrence, no symptom). S5 is the near miss and the schema's own
      test separates them: strategic choice operates when the mapping is READABLE from
      the statement, transfer when it is HIDDEN. That is why this node and
      cl-1.select-linear-dp-pattern are two nodes and not one — same destination,
      different trigger, and a learner routinely has the second without the first.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Strip a problem's surface story and see whether what remains is a shape this
      cluster already owns: that "minimum cost to make two configurations identical
      with insert/delete/replace-like operations" is an alignment DP however it is
      dressed, that a scheduling or chain-building constraint is an increasing-
      subsequence in disguise, that a linear scan with a reset condition is Kadane. The
      skill is the STRIPPING — reducing a statement to its state-and-decision skeleton
      and matching the skeleton, not the vocabulary. This is the cluster's transfer
      node and the graph's instantiation of the transfer skill type.
    prerequisites:
      intra_cluster:
        - "cl-1.linear-dp-pattern-catalogue"
        - "cl-1.judge-dp-applicability"
        - "cl-1.derive-recurrence-routine"
      roots:
        - "cl-1.root.recognize-optimal-substructure"
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C4", "C5"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    notes: >-
      TRANSFER-TO-DP UNCERTAINTY — CARRIED EXPLICITLY (NEU-887 R1; NEU-934 spec
      requires this node to carry it). This node asserts the skill EXISTS and belongs in
      the map. It does NOT assert that the skill is reliably teachable, that practising
      the cluster's other nodes produces it, or that it transfers from mapped
      techniques to unmapped surfaces. NEU-887 R1 (the DP-transfer gap) says the
      opposite is a live possibility: transfer is the DP skill most often assumed and
      least often evidenced. NEU-932 F-C-5 sharpens the point — no selected corpus is
      ordered by LEARNING dependency, and C2's authored ramp is one expert's design
      (class-1 evidence about a design, not about learning), so the prerequisite edges
      drawn into this node are a STRUCTURAL claim about what the skill presupposes, NOT
      an empirical claim that acquiring them yields it. Consequence for downstream
      consumers, stated so it is not rediscovered: a curriculum that teaches this
      cluster's nodes and expects transfer to follow is relying on an unevidenced step.
      The uncertainty is not resolvable inside NEU-889 — no evidence class available to
      this charter could settle it (it would need learner-outcome data, class 5/6, which
      NEU-887 records as absent). Recorded, owned, and left open rather than smoothed.
      Node stays `provisional`; `evidence_class: 1` describes the node's EXISTENCE claim
      (the references name the skill), not its acquisition claim, which has none.
      Same uncertainty applies undiminished to cl-1.transfer-lis-to-disguised-problems.

  - id: "cl-1.solution-reconstruction"
    name: "Solution reconstruction: the table holds more than the answer"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      A completed DP table does not merely hold the optimal VALUE — it holds enough
      information to recover an optimal SOLUTION, because the value at each state was
      achieved by some predecessor and that predecessor is identifiable after the fact.
      The two ways to exploit this and what each costs: store a parent pointer per state
      during evaluation (memory proportional to the state space, trivial recovery), or
      store nothing and recompute at recovery time which predecessor achieves the value
      (no extra memory, a second pass). Also the fact that makes reconstruction
      non-obvious: the answer is a PATH through the state space, not a state, so "the
      DP is correct" and "I can produce the thing it is optimal over" are different
      claims.
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
        - "cl-1.root.memoization-vs-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    aliases: ["path recovery", "traceback", "argmax recovery"]

  - id: "cl-1.reconstruct-optimal-solution-by-backtracking"
    name: "Reconstruct an optimal solution by backtracking the table"
    node_kind: "skill"
    skill_type: "procedural"
    skill_type_rationale: >-
      Cascade stops at S7. The routine's steps do not vary with the problem: start at
      the answer state, find the predecessor whose value plus this transition's cost
      equals this state's value, emit that transition's decision, move to the
      predecessor, stop at a base case, reverse the emitted list. That sequence is
      identical for edit distance, grid paths, LIS, and partition DP — only the
      transition set substituted into step two changes, and substituting a known
      transition set is not a judgment about the problem. S6 rejected on the schema's
      §2.1 test: no evaluation-order judgment arises, because the order is dictated by
      the table that already exists. S5 rejected: nothing is chosen. S1/S2/S3/S4 reject
      cleanly.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Walk a completed table backwards from the answer state to a base case, emitting
      the decision taken at each step, to produce the actual alignment / path /
      subsequence / partition rather than just its score. Includes the two boundary
      cases that break naive traceback: ties (several predecessors achieve the value —
      any one is a valid optimum, and picking deterministically matters when the judge
      demands a specific one) and the base-case stop condition.
    prerequisites:
      intra_cluster:
        - "cl-1.solution-reconstruction"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"

  - id: "cl-1.best-ending-at-index-state-pattern"
    name: "Element-anchored state: \"best ending exactly at i\""
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      The state pattern that fixes the last element rather than ranging over a prefix —
      dp[i] means "the best structure that ENDS EXACTLY AT i", and the global answer is
      a max over all i rather than dp[n]. Why it is a distinct pattern and not a variant
      of the prefix-index state: anchoring the endpoint is what makes the transition
      LOCAL, because the anchored element is available to compare against candidate
      predecessors, which a prefix-optimum state has forgotten. This is the single
      insight shared by LIS and Kadane and the reason both are in this cluster; it is
      factored out as one node so the two techniques below share a prerequisite instead
      of each re-teaching it. The cost of the pattern, which is the thing learners miss:
      dp[n] is NOT the answer, and forgetting the final max is a distinct bug class.
    prerequisites:
      intra_cluster:
        - "cl-1.linear-dp-pattern-catalogue"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    aliases: ["best ending here", "endpoint-anchored state", "suffix-anchored DP state"]
