      the best way to split the first i elements into j pieces, with a transition that
      ranges over where the last piece starts. Its two distinguishing properties: the
      second index is a COUNT rather than a position, and the transition is a
      linear scan rather than a bounded look-back — which makes the naive evaluation
      O(n^2 k) and makes this family the standard base for the divide-and-conquer and
      Knuth optimizations. Those optimizations are NOT this node and NOT this cluster
      (D-F4 T1 → CL-4; recorded as EXC-4). The base recurrence is CL-1 by T4: the
      domain is linear, the state is a plain tuple, and the difficulty is the
      recurrence itself.
