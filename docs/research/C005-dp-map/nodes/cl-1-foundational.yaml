      How the alignment shape deforms under different scoring rules, held as a compared
      set: arbitrary per-operation costs (weights change, state unchanged); local
      alignment, where a zero floor lets the alignment start anywhere and the answer
      becomes a max over all cells rather than a corner — the element-anchored pattern
      resurfacing in two dimensions; longest common SUBSTRING, where contiguity forces
      the same move; and affine gap costs, where a run of gaps costs less than its
      length and the state must therefore gain a small mode dimension recording which
