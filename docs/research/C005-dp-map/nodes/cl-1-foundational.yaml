    notes: >-
      `prerequisites.roots: []` is deliberate and is NOT an unexplained jump. This node
      is a consequence of cl-1.prefix-aggregate-recurrence, which is itself rooted; the
      chain to the floor runs through it. Adding a root edge here would be decorative —
