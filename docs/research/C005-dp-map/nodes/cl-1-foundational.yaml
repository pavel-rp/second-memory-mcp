      corpus_refs: []
    evidence_class: 1
    status: "settled"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-933"
    frozen: true

  - id: "cl-1.root.recognize-overlapping-subproblems"
    name: "Recognize overlapping subproblems and distinguish DP from divide-and-conquer"
    node_kind: "skill"
    skill_type: "conceptual"
    cluster: "CL-1"
    role: "root"
    summary: >-
      Given a recursive decomposition, judge whether subproblems recur — and
      therefore whether memoizing buys anything. The judgment that separates DP
      from divide-and-conquer, where subproblems are disjoint and reuse buys nothing.
    skill_type_rationale: >-
      Same cascade path as `recognize-optimal-substructure`: a confident residual at
      S8. It is a property judgment, not a selection among techniques (S5).
    prerequisites:
      intra_cluster: []
      roots: ["cl-1.root.overlapping-subproblems"]
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
