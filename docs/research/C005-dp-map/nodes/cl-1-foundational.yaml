  - id: "cl-1.formulate-sequence-partition-dp"
    name: "Formulate a sequence partition DP"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5: choosing the (prefix, pieces-used) state and the
      last-piece-start transition over rival formulations. S2 is the near miss and is
      rejected on the schema §2.1 test — accelerating this recurrence's inner scan is
      the textbook D&C-optimization case and presupposes the recurrence this node is
      still choosing. S1/S3/S4 reject cleanly.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Turn a "divide this sequence into k parts" problem into the index-plus-count
      recurrence: recognize that the last piece's start is the decision, that the state
      must count pieces used, and that the piece-cost function must be O(1)-queryable
      for the formulation to be workable at all — which is where prefix aggregates
      enter as a genuine prerequisite rather than an optimization.
    prerequisites:
      intra_cluster:
        - "cl-1.sequence-partition-dp"
        - "cl-1.formulate-2d-sequence-dp"
        - "cl-1.range-aggregate-by-difference"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 6
      state_formulation_load: 3
      transition_derivation_load: 3
      proof_obligation_load: 1
      implementation_load: 2
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
