  - id: "cl-1.difference-array-and-range-update"
    name: "The difference array: the prefix recurrence run backwards"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      The dual of the prefix array: store D[i] = a[i] - a[i-1], and a range update
      ("add v to every element of [l, r]") becomes two point writes, with the original
      array recovered by a prefix sweep. Why it belongs next to the prefix node rather
      than somewhere else: it is the SAME recurrence read in the other direction, and
      the pairing is the point — prefix turns point-updates plus range-queries into
      O(1) queries, difference turns range-updates plus a final read into O(1) updates.
      A learner who has one and not the other reaches for a segment tree on problems
      that do not need one.
    prerequisites:
      intra_cluster:
        - "cl-1.prefix-aggregate-recurrence"
        - "cl-1.range-aggregate-by-difference"
      roots: []
      boundary_anchors: []
