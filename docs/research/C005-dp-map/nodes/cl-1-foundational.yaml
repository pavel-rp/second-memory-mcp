  - id: "cl-1.grid-path-dp"
    name: "Grid / path DP"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      DP whose state is a cell coordinate on a rectangular grid and whose transition
      follows the permitted moves into that cell — counting paths, finding the
      cheapest path, or finding the best sub-rectangle anchored at a cell. What makes
      it distinct from a generic 2D sequence DP despite sharing the index-pair shape:
      the two indices are COUPLED by the movement rule rather than independent, so the
      transition is dictated by the geometry rather than chosen, and the dependency
      order follows the move directions. D-F4 places it in CL-1 by T4 — a plain index
      tuple over a rectangular domain. The restriction that keeps it here and out of
      CL-2: monotone moves only. A grid with unrestricted movement is a shortest-path
      problem on a graph, not a DP, because the state dependency stops being acyclic —
      that is the boundary, and it is the thing worth knowing about this family.
