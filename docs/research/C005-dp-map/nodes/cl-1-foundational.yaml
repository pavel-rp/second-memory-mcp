  - id: "cl-1.order-2d-table-evaluation"
    name: "Establish a valid evaluation order for a 2D table"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6. It is realizing an ALREADY-CHOSEN formulation as code, and
      the schema §2.1 test decides S6 over S7 explicitly: choosing a loop order that
      respects THIS recurrence's dependency pattern is a judgment about this specific
      problem, so it is not a fixed routine. S2 rejected on the boundary the frozen
      root `implement-memoization-and-tabulation` already draws inside CL-1: making the
      DP RUN CORRECTLY is not making it run FASTER — a wrong order yields a wrong
      answer, not a slow one. That keeps this node clear of D-F4 T1 and therefore of
      CL-4. S1/S3/S4/S5 reject cleanly.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Determine an iteration order in which every state's dependencies are already
      computed when it is reached, and write the loops that realize it: row-major when
      the transition looks up and left, reverse order when it looks forward, and the
      recognition that some recurrences admit no simple nested-loop order and want the
      top-down form instead. What a learner acquires is that evaluation order is a
      CORRECTNESS obligation in 2D rather than a stylistic choice — the 1D case gave it
      away for free and thereby hid the lesson.
    prerequisites:
      intra_cluster:
        - "cl-1.formulate-2d-sequence-dp"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
        - "cl-1.root.memoization-vs-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 5
      state_formulation_load: 1
      transition_derivation_load: 1
      proof_obligation_load: 0
      implementation_load: 3
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E5", "JS-E6"]
      severity: "performance"
      rationale: >-
        MATERIAL — this is the node that writes the 2D table, and JavaScript forces a decision
        C++ does not. The direct translation of the C++ default is an array-of-arrays, which in
        JavaScript is a boxed outer array of boxed inner arrays: a pointer chase per row plus
        per-element overhead. C++'s vector<vector<int>> is also row-indirect but the rows are
        unboxed contiguous ints, and the flat vector<int> is the reflexive idiom. The JavaScript
        idiom for a hot 2D table is therefore an explicit FLAT typed array with manual index
        arithmetic (i * W + j) — a choice a C++ author gets for free and a JavaScript author
        must make deliberately. JS-E6 is recorded here only in combination with that specific
        mitigable idiom, per JS-D1. Directional, not quantified (JS-U2).
      uncertainty: "JS-U2"
      mapper_note: >-
        Foreseen, NOT assessed — SUB-8 (OUT-5) owns the verdict. Observation only: allocating a
        2D table in JavaScript has no single obvious form (array of arrays vs a flat typed array
        with manual index arithmetic), and the choice has materially different performance and
        initialization semantics than the C++ `vector<vector<int>>` or raw 2D array the
        references assume. An observation that a materiality question EXISTS here, not a verdict
        on it.
    coverage:
      status: "unaudited"
      corpus_refs: ["C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"

