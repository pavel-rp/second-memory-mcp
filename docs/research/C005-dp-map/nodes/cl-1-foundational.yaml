  # DECOMPOSITION DISCIPLINE (schema §1.1)
  #   The spec names ~7 technique areas (1D linear, 2D linear, prefix-sum, grid/path,
  #   LIS, edit-distance/alignment, Kadane-and-kin). Emitting seven nodes would have
  #   been a topic list wearing a graph's clothes — the charter's #1 High risk. Each
  #   area is decomposed into the things a learner ACQUIRES SEPARATELY AND FAILS
  #   SEPARATELY: the knowledge of the shape, the strategic act of choosing it, the
  #   proof obligation it carries, and (where they genuinely differ from the general
  #   case) its implementation and debugging demands.
  #
  #   The test applied throughout: "can a learner have one of these and not the other,
  #   and can I tell which one they are missing by watching them fail?" Where the
  #   answer was no, the node was NOT split — mechanical 4x-per-technique splitting is
  #   the same failure as a topic list, just more expensive to read.
  #
  # NO CROSS-CLUSTER ATTACHMENTS — BY CONSTRUCTION, NOT BY OMISSION
  #   CL-1 is the base cluster. Every prerequisite here is intra-cluster or a root
  #   (both DRAWN, schema §4.1). `cross_cluster_attachments: []` on all 46 nodes is a
  #   POSITIVE ASSERTION, per the NEU-934 spec ("its techniques attach directly to the
  #   roots and it declares no cross-cluster prerequisites"). One anchor is drawn
  #   (`anchor.modular-arithmetic@1.0.0`, on the counting node) — a real, registered,
  #   sanctioned non-DP terminal, not a laundered dependency. No AR-1 request was
  #   needed: CL-1's non-DP prerequisites are elementary-floor (arrays, indexing) or
  #   already registered.
