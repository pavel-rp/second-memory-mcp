      transition_derivation_load: 1
      proof_obligation_load: 0
      implementation_load: 2
      recognition_load: 1
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E2"]
      severity: "correctness-risk"
      rationale: >-
        MATERIAL — the accumulator's exact range is three orders of magnitude smaller than the
        C++ default's, and this is the node that writes the accumulation. A C++ author
        reflexively declares the prefix array long long, exact to ~9.2e18, and stops thinking.
        JavaScript's Number is exact only to 2^53 ~ 9.0e15. A prefix sum over 1e6 elements of
        magnitude 1e9 lands at ~1e15 — INSIDE the bound, but within one order of magnitude of
        it, so the headroom a C++ author never has to reason about is nearly exhausted before
        the problem is even large. Past 2^53 the sum silently rounds rather than wrapping, so
        the array stays plausible while being wrong. Any prefix aggregate whose totals can
        exceed 2^53 requires BigInt. Recorded as correctness-risk, not blocking: the common case
        is correct, and a reachable one is not.
    coverage:
