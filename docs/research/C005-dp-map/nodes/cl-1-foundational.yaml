  - id: "cl-1.formulate-kadane-best-ending-here"
    name: "Formulate the maximum-subarray recurrence"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5: choosing the element-anchored state over the prefix-optimum
      state, exactly as in LIS, and choosing the two-case transition (start fresh or
      extend). S1 no — the exchange argument is the adjacent proof node. S2 no — the
      O(1)-space realization is not a cost reduction of a DIFFERENT correct DP, it is
      how this recurrence is written; and in any case nothing correct exists at the
      moment of choosing. S3/S4 no.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Derive Kadane from the element-anchored pattern rather than recalling it:
      recognize that "the best subarray in the first i" cannot transition (it has
      forgotten whether it reaches i), anchor the endpoint instead, and read off the
