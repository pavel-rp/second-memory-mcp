    summary: >-
      The canonical index-pair DP: dp[i][j] is the minimum number of insert / delete /
      replace operations converting the first i characters of A into the first j of B,
      with a transition that is a case analysis over the last operation and base cases
      along both empty-prefix edges. Its structural lesson, which outlives the problem:
      the state is a pair of INDEPENDENT prefixes and the transition moves the frontier
