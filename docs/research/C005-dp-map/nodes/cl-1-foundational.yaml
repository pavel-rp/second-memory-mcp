      progression_stage: "PS-3"
      entry_gate: "gate-c"
      prerequisite_depth: 3
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E1"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — recorded here on the mapper's evidence, against this audit's own
        default that a formulation node is pre-code and therefore neutral. NEU-934's observation
        on this node is that a 1D DP over n up to 1e5-1e6 is THE FIRST PLACE a learner meets
        JavaScript's recursion ceiling, because the top-down form recurses once per index; the
        audit checked it and it holds. n = 1e5-1e6 against a cap on the order of 1e4 frames is
        not marginal, it is one to two orders of magnitude over, and 1D sequence DP is the most
        common shape in the map — so this is the highest-frequency instance of JS-E1, not the
        most exotic. The reason it lands on a FORMULATION node rather than an implementation one
        is a real gap, not a filing convenience: the node that owns the top-down/bottom-up
        realization choice is cl-1.root.implement-memoization-and-tabulation, which is a FROZEN
        root (DR-S02) that this audit may not write, and which itself carries a mapper
        observation foreseeing exactly this finding. CL-1 has no unfrozen 1D-linear
        implementation node. Leaving this node neutral would therefore strand the map's most
        common recursion-depth hazard behind a frozen node — a silent C++ assumption of exactly
        the kind the second acceptance scenario forbids. The effect on what is written: in
        JavaScript the top-down/bottom-up choice is not the stylistic one the references
        present, because the bottom-up form is a loop and the top-down form does not run at this
        cluster's standard n. See JS-U1.
      uncertainty: "JS-U1"
      mapper_note: >-
        Foreseen, NOT assessed — SUB-8 (OUT-5) owns the verdict. Observation only: a 1D DP over
        n up to 1e5-1e6 is the first place a learner meets JavaScript's recursion-depth ceiling,
        since the top-down form recurses once per index. The references assume a C++ default
        where the same formulation survives. An observation about where the issue first BITES in
        this cluster, not a verdict.
