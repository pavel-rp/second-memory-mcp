  - id: "cl-1.prove-prefix-state-sufficiency"
    name: "Prove a prefix-index state is sufficient"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1: the contribution is ARGUING that the state forgets nothing
      the future needs — that any two histories arriving at the same index are
      interchangeable for everything that follows. Typically a cut-and-paste exchange:
      assume a better completion exists for one history, splice it onto the other,
      contradict optimality. S2/S3 no (nothing to accelerate, no symptom). S8 rejected
      deliberately: judging that a state "feels sufficient" is the conceptual node;
      this is the argument that settles it.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Establish the sufficiency obligation for a specific 1D formulation, which is the
      one that fails silently: a state that has forgotten something relevant still
      produces a table, still terminates, and still returns a plausible number. The
      skill is producing the interchangeability argument — and, when it cannot be
      produced, reading the failure as the signal that the state needs an extra
      dimension. That diagnostic direction is why this node is a prerequisite of the
      state-machine formulation below: a learner arrives at "this needs a mode
      dimension" by failing to prove sufficiency without one.
    prerequisites:
      intra_cluster:
        - "cl-1.formulate-1d-sequence-dp"
        - "cl-1.prove-recurrence-correctness"
