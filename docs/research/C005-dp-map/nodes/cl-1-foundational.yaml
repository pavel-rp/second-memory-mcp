  # ---------------------------------------------------------------------------
  # SECTION 3 — Prefix-sum DP
  # ---------------------------------------------------------------------------
  # 🔴 A BOUNDARY THIS SUB-TASK HAD TO ADJUDICATE, RECORDED RATHER THAN SMOOTHED.
  #   The NEU-934 spec assigns "prefix-sum DP" to CL-1. But D-F4's T1 test fires on the
  #   most famous thing wearing that name: using a prefix-sum array to collapse a
  #   transition that sums over a range from O(n) to O(1) takes an ALREADY-CORRECT
  #   recurrence and reduces its cost without changing what its states mean — that is
  #   T1, and T1 is CL-4's.
  #
  #   The resolution is that "prefix-sum DP" names TWO different things, and only one
  #   of them is contested:
  #     (a) The prefix-aggregate array AS a DP — S[i] = S[i-1] + a[i] is a 1D linear
  #         recurrence with a base case, and range aggregation by difference is what its
  #         table is FOR. Confident T4 residual → CL-1. THIS is what this section maps.
  #     (b) Prefix-sum ACCELERATION of another DP's transition — T1 → CL-4. NOT mapped
  #         here; recorded as EXC-2 in `residual_exclusions` with its rationale.
  #
  #   Mapping (a) and (b) as one node would have been the smoothing the charter
  #   forbids: it would put a CL-4-owned contribution inside CL-1 under cover of a
  #   shared name. The split is honest and it costs nothing — (a) is a real prerequisite
  #   of (b), so the chain is intact either way.
  # ---------------------------------------------------------------------------

  - id: "cl-1.prefix-aggregate-recurrence"
    name: "The prefix-aggregate array as a DP recurrence"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      S[i] = S[i-1] (+) a[i], with S[0] the identity — the smallest non-trivial DP in
      the map, and worth a node precisely because it is usually taught as an array
      trick rather than as what it is. Seeing it as a DP is load-bearing: it has a
      state (the prefix index), a transition (combine the previous prefix with the
      current element), a base case (the empty prefix maps to the operator's identity),
      and it earns its keep through overlapping subproblems exactly like every other
      DP here. It generalizes past sums to any associative operator with an identity —
      which is what makes prefix-xor, prefix-max-with-caveats, and prefix-count the
      same node rather than four tricks.
    prerequisites:
      intra_cluster:
        - "cl-1.linear-sequence-dp-1d"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
        - "cl-1.root.overlapping-subproblems"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-3"
      entry_gate: "gate-c"
      prerequisite_depth: 3
      state_formulation_load: 1
      transition_derivation_load: 1
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral as KNOWLEDGE: that a prefix-aggregate array IS a DP recurrence is the
        insight, and it is language-independent. The exactness headroom of the accumulator is
        recorded on cl-1.build-prefix-aggregate, the node that writes it (JS-D2).
    coverage:
      status: "unaudited"
      corpus_refs: ["C1"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    aliases: ["prefix sums", "cumulative sums", "partial sums", "scan"]
    contested_by: []
    notes: >-
      SCOPE, stated because the name invites a wider reading. This node is the prefix
      array AS a recurrence (D-F4 T4, confident residual). It is NOT prefix-sum
      acceleration of another DP's transition, which answers T1 and is CL-4's —
      excluded here as EXC-2 rather than absorbed. Also NOT claimed: that prefix sums
      are novel to a mastery-plus-competitive learner. The node's contribution is the
      REFRAME (array trick → DP), which is what the downstream nodes actually depend
      on, plus the associative-operator generalization. If SUB-9's audit judges the
      reframe to sit below NEU-887's elementary floor, the correct disposition is a
      ledger challenge, not deletion — the partition-DP nodes draw on it.

  - id: "cl-1.build-prefix-aggregate"
    name: "Build a prefix-aggregate array"
    node_kind: "skill"
    skill_type: "procedural"
    skill_type_rationale: >-
      Cascade stops at S7, and this is the cluster's cleanest S7 — the reason it is
      worth having as a node is that it CALIBRATES the type against the harder S7 call
      at cl-1.derive-recurrence-routine. The steps genuinely do not vary with the
      problem: allocate n+1, seed index 0 with the operator's identity, sweep forward
      combining. Nothing in that sequence asks a question about the problem. Contrast
      the schema §2.1 exemplar (submask iteration) — identical character. S6 rejected:
      no evaluation-order judgment arises, the order is forced. S1-S5 reject cleanly.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Execute the fixed construction: size n+1 rather than n, seed the identity at
      index 0, sweep forward. The off-by-one discipline is the entire content — the
      1-based-with-empty-prefix convention exists so that range queries need no special
      case at the left edge, and a learner who builds the n-sized version meets a
      boundary bug on every subsequent query rather than once.
    prerequisites:
      intra_cluster:
        - "cl-1.prefix-aggregate-recurrence"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 4
      state_formulation_load: 1
      transition_derivation_load: 1
      proof_obligation_load: 0
      implementation_load: 2
      recognition_load: 1
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E2"]
      severity: "correctness-risk"
      rationale: >-
        MATERIAL — the accumulator's exact range is three orders of magnitude smaller than the
        C++ default's, and this is the node that writes the accumulation. A C++ author
        reflexively declares the prefix array long long, exact to ~9.2e18, and stops thinking.
        JavaScript's Number is exact only to 2^53 ~ 9.0e15. A prefix sum over 1e6 elements of
        magnitude 1e9 lands at ~1e15 — INSIDE the bound, but within one order of magnitude of
        it, so the headroom a C++ author never has to reason about is nearly exhausted before
        the problem is even large. Past 2^53 the sum silently rounds rather than wrapping, so
        the array stays plausible while being wrong. Any prefix aggregate whose totals can
        exceed 2^53 requires BigInt. Recorded as correctness-risk, not blocking: the common case
        is correct, and a reachable one is not.
    coverage:
      status: "unaudited"
      corpus_refs: ["C1"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"

  - id: "cl-1.range-aggregate-by-difference"
    name: "Range aggregation by prefix difference (1D and 2D)"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      What the prefix table is for: any range's aggregate is recoverable in O(1) from
      prefix values alone — S[r] - S[l-1] in one dimension, and the four-term
      inclusion-exclusion S[r][c] - S[r][c'-1] - S[r'-1][c] + S[r'-1][c'-1] in two.
      The requirement the identity rests on and that learners skip: the operator must be
      INVERTIBLE, which sums and xor are and max is not — the reason prefix-max does not
      answer range-max queries and why that question routes to a different structure
      entirely (anchor.segment-tree's territory, not this cluster's). Held as knowledge
      because the identity is a fact; applying it is folded into the formulators that
      depend on it rather than split into a node that would fail with them.
    prerequisites:
      intra_cluster:
        - "cl-1.prefix-aggregate-recurrence"
        - "cl-1.build-prefix-aggregate"
