  - id: "cl-1.formulate-edit-distance-recurrence"
    name: "Formulate the edit-distance recurrence"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5: choosing the index-pair state and the last-operation case
      split, including the decision of which operations the cost model admits and what
      each costs. S1 no — the exhaustiveness argument is the adjacent proof node. S2 no
      — the linear-space and bit-parallel accelerations presuppose this recurrence and
      are CL-4's by T1 (EXC-6). S3/S4 no.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Derive the recurrence from the operation set: enumerate the last operation that
      could produce the (i, j) frontier, map each to the state it came from, and take
      the minimum, with the match case as the free transition. The judgment carried is
      that the operation set DEFINES the recurrence — drop replace and it becomes the
      LCS-complement, make the costs asymmetric and the case weights change — so the
      skill is deriving the recurrence FROM a cost model rather than recalling one
      recurrence.
    prerequisites:
      intra_cluster:
        - "cl-1.edit-distance-dp"
        - "cl-1.formulate-2d-sequence-dp"
