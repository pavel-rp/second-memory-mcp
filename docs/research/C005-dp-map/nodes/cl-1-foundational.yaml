    name: "Optimal substructure"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "root"
    summary: >-
      An optimal solution to the problem is composed of optimal solutions to its
      subproblems. The property that licenses solving a problem by combining
      subproblem optima rather than searching the whole solution space.
