  - id: "cl-1.reconstruct-optimal-solution-by-backtracking"
    name: "Reconstruct an optimal solution by backtracking the table"
    node_kind: "skill"
    skill_type: "procedural"
    skill_type_rationale: >-
      Cascade stops at S7. The routine's steps do not vary with the problem: start at
      the answer state, find the predecessor whose value plus this transition's cost
      equals this state's value, emit that transition's decision, move to the
      predecessor, stop at a base case, reverse the emitted list. That sequence is
      identical for edit distance, grid paths, LIS, and partition DP — only the
      transition set substituted into step two changes, and substituting a known
      transition set is not a judgment about the problem. S6 rejected on the schema's
      §2.1 test: no evaluation-order judgment arises, because the order is dictated by
      the table that already exists. S5 rejected: nothing is chosen. S1/S2/S3/S4 reject
      cleanly.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Walk a completed table backwards from the answer state to a base case, emitting
      the decision taken at each step, to produce the actual alignment / path /
      subsequence / partition rather than just its score. Includes the two boundary
      cases that break naive traceback: ties (several predecessors achieve the value —
      any one is a valid optimum, and picking deterministically matters when the judge
      demands a specific one) and the base-case stop condition.
    prerequisites:
      intra_cluster:
        - "cl-1.solution-reconstruction"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-2"
      entry_gate: "gate-c"
      prerequisite_depth: 2
      state_formulation_load: 1
      transition_derivation_load: 2
      proof_obligation_load: 0
      implementation_load: 2
      recognition_load: 1
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. The backtracking walk is iterative — it steps from cell to
        predecessor cell — so JS-E1 does not bind. It reads a table it did not build, so the
        JS-E5 container decision belongs to the node that builds it (JS-D2). Deliberate
        non-claim: the walk's length is O(n) but its stack depth is O(1).
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"

  - id: "cl-1.best-ending-at-index-state-pattern"
    name: "Element-anchored state: \"best ending exactly at i\""
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      The state pattern that fixes the last element rather than ranging over a prefix —
      dp[i] means "the best structure that ENDS EXACTLY AT i", and the global answer is
      a max over all i rather than dp[n]. Why it is a distinct pattern and not a variant
      of the prefix-index state: anchoring the endpoint is what makes the transition
      LOCAL, because the anchored element is available to compare against candidate
      predecessors, which a prefix-optimum state has forgotten. This is the single
      insight shared by LIS and Kadane and the reason both are in this cluster; it is
      factored out as one node so the two techniques below share a prerequisite instead
      of each re-teaching it. The cost of the pattern, which is the thing learners miss:
      dp[n] is NOT the answer, and forgetting the final max is a distinct bug class.
    prerequisites:
      intra_cluster:
        - "cl-1.linear-dp-pattern-catalogue"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-2"
      entry_gate: "gate-c"
      prerequisite_depth: 2
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
