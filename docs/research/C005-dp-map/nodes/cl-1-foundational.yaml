  - id: "cl-1.state-machine-over-sequence"
    name: "Sequence DP with an auxiliary mode dimension (state-machine DP)"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      The shape that appears when a prefix index alone is not a sufficient state: dp[i]
      becomes dp[i][m] where m ranges over a SMALL, FIXED set of modes the process can
      be in — holding or not holding an asset, in a cooldown, having used k of a
      resource, having taken or skipped element i-1. The transition becomes a small
      transition matrix between modes. Why it stays in CL-1 rather than moving to CL-3:
      the mode is a plain index in a tuple, not an encoding — nothing is packed,
      compressed, or reinterpreted (D-F4 T2 answers no), and the domain is still linear
      (T3 no), so T4 catches it. The family covers the non-adjacent-selection and
      buy/sell-with-constraints problems that are the cluster's most common exam
      material.
    prerequisites:
      intra_cluster:
        - "cl-1.linear-sequence-dp-1d"
        - "cl-1.linear-dp-pattern-catalogue"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-3"
      entry_gate: "gate-c"
      prerequisite_depth: 3
      state_formulation_load: 2
      transition_derivation_load: 3
      proof_obligation_load: 1
      implementation_load: 2
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. An auxiliary mode dimension is a modelling device. The mode count is
        small and the table stays 1D-by-small-k; no JavaScript effect binds.
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    aliases: ["state-machine DP", "DP with a mode dimension", "automaton-free multi-state DP"]
    contested_by: []
    notes: >-
      NAMING HAZARD, recorded for OUT-7 (X-D2 discipline). "State-machine DP" is a
      community name, not a taxonomy term, and it collides conceptually with CL-3's
      AUTOMATON DP, which is a different thing (there the state IS an automaton node
      built from the input — an encoding, D-F4 T2; here the mode set is small, fixed,
      and read straight off the problem statement). The two are not the same technique
      and this node makes no claim on CL-3's. Aliases carried so the audit does not read
      the name overlap either as a duplicate or as a coverage gap.

  - id: "cl-1.formulate-state-machine-over-sequence"
    name: "Formulate a sequence DP with an auxiliary mode dimension"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5: the choice is WHICH modes to carry and, critically, how few
      — a decision under a correctness constraint (too few modes and the state is
      insufficient) and a cost constraint (modes multiply the state space). S1 no —
      that is the sufficiency proof. S2 no — the recurrence does not exist yet;
      note this is exactly the boundary the schema §2.1 names, since collapsing modes
      to shrink an EXISTING correct DP would be CL-4's S2 optimization instead.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Recognize that a constraint cannot be remembered by the index alone and promote
      exactly it into a mode dimension — no more, no less. The two failures the skill
      exists to prevent: too few modes (an insufficient state that silently returns
      wrong answers) and too many (modes that encode information the transition never
      reads, multiplying the state space for nothing). Includes writing the mode
      transitions as a complete, disjoint case analysis.
    prerequisites:
