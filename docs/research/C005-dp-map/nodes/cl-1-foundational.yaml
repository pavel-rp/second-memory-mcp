    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-933"
    frozen: true

  - id: "cl-1.root.implement-memoization-and-tabulation"
    name: "Implement a DP both top-down and bottom-up"
    node_kind: "skill"
    skill_type: "implementation"
    cluster: "CL-1"
    role: "root"
    summary: >-
      Turn a correct formulation into working code either way: build the cache and
      recursion for memoization, or establish a valid evaluation order and iterate
      for tabulation.
    skill_type_rationale: >-
      Cascade stops at S6 "implementation": the formulation is given and the work is
      realizing it as code. Deliberately NOT S7 "procedural" — the order test in the
      cascade separates them, and this is the harder side of that line: choosing an
      evaluation order is a judgment about the specific recurrence, not the
      execution of a fixed routine. Not S2 "optimization": making it RUN is not
      making it FASTER; that boundary is what keeps CL-4 a separate cluster.
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.memoization-vs-tabulation"
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: >-
        Foreseen but NOT assessed here — OUT-5 (SUB-8) owns the verdict. Recorded as
        an observation only: recursion-depth limits and the absence of a tunable
        stack make the top-down side language-material in JavaScript in a way it is
        not in the C++ competitive default that every selected reference assumes
        (NEU-932 06_caps §2). SUB-8 must reach its own verdict; this note is not one.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "settled"
