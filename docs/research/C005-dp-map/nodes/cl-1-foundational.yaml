  # ---------------------------------------------------------------------------
  # SECTION 1 — 1D linear/sequence DP
  # ---------------------------------------------------------------------------

  - id: "cl-1.linear-sequence-dp-1d"
    name: "1D linear/sequence DP (prefix-index state)"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      The base shape of the whole cluster: a state indexed by a single position in a
      sequence, dp[i], whose value answers the problem restricted to the first i
      elements, and whose transition looks back a bounded distance. What makes it the
      simplest useful DP — the state space is linear, the dependency order is the index
      order itself (so evaluation order is free rather than a decision), and the
      transition is a small case analysis over what happens at position i. D-F4 assigns
      it here by T4, a confident residual: a plain index tuple over a linear domain,
      with no exotic encoding and no combinatorial structure to respect.
    prerequisites:
      intra_cluster:
        - "cl-1.linear-dp-pattern-catalogue"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
        - "cl-1.root.optimal-substructure"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-2"
      entry_gate: "gate-c"
      prerequisite_depth: 2
      state_formulation_load: 1
      transition_derivation_load: 2
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. A prefix-index state over one dimension is a single flat array in
        every language. It is the one table shape where JS-E5's array-of-arrays hazard cannot
        arise, and at 1D sizes the container choice does not decide feasibility. Recording a
        typed-array claim here would be JS-E6 dilution (JS-D1).
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    aliases: ["1D DP", "prefix DP", "linear DP"]

  - id: "cl-1.formulate-1d-sequence-dp"
    name: "Formulate a 1D sequence DP"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5: choosing what dp[i] MEANS is a choice among candidate
      formulations under a correctness constraint, specialized to the 1D shape. S1 no —
      proving the chosen meaning sufficient is cl-1.prove-prefix-state-sufficiency. S2
      no — nothing exists yet to accelerate. S3 no — statement-driven, not symptom-
      driven. S4 no — the 1D shape is readable from the statement here.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Turn a sequence problem into a concrete dp[i]: decide what the index ranges over
      (elements consumed? position reached?), decide what the value means (the optimum
      over the prefix? the optimum ending at i?), write the transition as a case
      analysis on the decision at position i, and fix dp at the empty prefix. The
      recurring judgment this node carries: whether looking back ONE position suffices
      or the transition must look back further, and what that costs.
    prerequisites:
      intra_cluster:
        - "cl-1.linear-sequence-dp-1d"
        - "cl-1.select-linear-dp-pattern"
        - "cl-1.derive-recurrence-routine"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-3"
      entry_gate: "gate-c"
      prerequisite_depth: 3
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E1"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — recorded here on the mapper's evidence, against this audit's own
        default that a formulation node is pre-code and therefore neutral. NEU-934's observation
        on this node is that a 1D DP over n up to 1e5-1e6 is THE FIRST PLACE a learner meets
        JavaScript's recursion ceiling, because the top-down form recurses once per index; the
        audit checked it and it holds. n = 1e5-1e6 against a cap on the order of 1e4 frames is
        not marginal, it is one to two orders of magnitude over, and 1D sequence DP is the most
        common shape in the map — so this is the highest-frequency instance of JS-E1, not the
        most exotic. The reason it lands on a FORMULATION node rather than an implementation one
        is a real gap, not a filing convenience: the node that owns the top-down/bottom-up
        realization choice is cl-1.root.implement-memoization-and-tabulation, which is a FROZEN
        root (DR-S02) that this audit may not write, and which itself carries a mapper
        observation foreseeing exactly this finding. CL-1 has no unfrozen 1D-linear
        implementation node. Leaving this node neutral would therefore strand the map's most
        common recursion-depth hazard behind a frozen node — a silent C++ assumption of exactly
        the kind the second acceptance scenario forbids. The effect on what is written: in
        JavaScript the top-down/bottom-up choice is not the stylistic one the references
        present, because the bottom-up form is a loop and the top-down form does not run at this
        cluster's standard n. See JS-U1.
      uncertainty: "JS-U1"
      mapper_note: >-
        Foreseen, NOT assessed — SUB-8 (OUT-5) owns the verdict. Observation only: a 1D DP over
        n up to 1e5-1e6 is the first place a learner meets JavaScript's recursion-depth ceiling,
        since the top-down form recurses once per index. The references assume a C++ default
        where the same formulation survives. An observation about where the issue first BITES in
        this cluster, not a verdict.
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"

  - id: "cl-1.prove-prefix-state-sufficiency"
    name: "Prove a prefix-index state is sufficient"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1: the contribution is ARGUING that the state forgets nothing
      the future needs — that any two histories arriving at the same index are
      interchangeable for everything that follows. Typically a cut-and-paste exchange:
      assume a better completion exists for one history, splice it onto the other,
      contradict optimality. S2/S3 no (nothing to accelerate, no symptom). S8 rejected
      deliberately: judging that a state "feels sufficient" is the conceptual node;
      this is the argument that settles it.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Establish the sufficiency obligation for a specific 1D formulation, which is the
      one that fails silently: a state that has forgotten something relevant still
      produces a table, still terminates, and still returns a plausible number. The
      skill is producing the interchangeability argument — and, when it cannot be
      produced, reading the failure as the signal that the state needs an extra
      dimension. That diagnostic direction is why this node is a prerequisite of the
      state-machine formulation below: a learner arrives at "this needs a mode
      dimension" by failing to prove sufficiency without one.
    prerequisites:
      intra_cluster:
        - "cl-1.formulate-1d-sequence-dp"
        - "cl-1.prove-recurrence-correctness"
      roots:
        - "cl-1.root.optimal-substructure"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 4
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 3
      implementation_load: 1
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. A sufficiency argument about a state is language-independent.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
