  - id: "cl-1.maximum-subarray-kadane"
    name: "Maximum subarray (Kadane's algorithm)"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      dp[i] is the maximum sum of a subarray ENDING EXACTLY at i, which is either a[i]
      alone or a[i] extending the best subarray ending at i-1 — whichever is larger —
      and the answer is the max over all i. Presented as a linear scan with a running
      variable, which is why it is usually taught as a trick and misfiled as greedy;
      mapped here as what it is, the minimal element-anchored DP, with the running
      variable a rolling window over a dp array that is never fully materialized.
      Understanding it AS a DP is the acquisition — a learner who has it as a trick
      cannot adapt it, and every one of its kin below is an adaptation.
    prerequisites:
      intra_cluster:
        - "cl-1.best-ending-at-index-state-pattern"
        - "cl-1.linear-sequence-dp-1d"
      roots:
        - "cl-1.root.optimal-substructure"
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-3"
      entry_gate: "gate-c"
      prerequisite_depth: 3
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 1
      implementation_load: 1
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. The recurrence is a running max of sums over one pass. The
        all-negative boundary is where JavaScript does bind, and that verdict is on
        cl-1.diagnose-empty-subarray-and-all-negative-boundary (JS-D2).
    coverage:
      status: "unaudited"
