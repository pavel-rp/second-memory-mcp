  - id: "cl-1.formulate-1d-sequence-dp"
    name: "Formulate a 1D sequence DP"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5: choosing what dp[i] MEANS is a choice among candidate
      formulations under a correctness constraint, specialized to the 1D shape. S1 no —
      proving the chosen meaning sufficient is cl-1.prove-prefix-state-sufficiency. S2
      no — nothing exists yet to accelerate. S3 no — statement-driven, not symptom-
      driven. S4 no — the 1D shape is readable from the statement here.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Turn a sequence problem into a concrete dp[i]: decide what the index ranges over
      (elements consumed? position reached?), decide what the value means (the optimum
      over the prefix? the optimum ending at i?), write the transition as a case
      analysis on the decision at position i, and fix dp at the empty prefix. The
      recurring judgment this node carries: whether looking back ONE position suffices
      or the transition must look back further, and what that costs.
    prerequisites:
      intra_cluster:
        - "cl-1.linear-sequence-dp-1d"
        - "cl-1.select-linear-dp-pattern"
        - "cl-1.derive-recurrence-routine"
