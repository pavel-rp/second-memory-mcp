  # ---------------------------------------------------------------------------
  # SECTION 0 — Cross-cutting foundational DP skills
  # ---------------------------------------------------------------------------
  # These are the six skill types the NEU-934 spec makes this cluster responsible
  # for, plus the knowledge nodes they stand on. They sit directly on the roots and
  # are prerequisites of the per-technique nodes below: a learner acquires the
  # general act first, then meets it again specialized to each shape.
