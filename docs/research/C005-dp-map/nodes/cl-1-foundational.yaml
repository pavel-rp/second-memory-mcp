  # --- Principle 1: Optimal substructure ------------------------------------

  - id: "cl-1.root.optimal-substructure"
    name: "Optimal substructure"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "root"
    summary: >-
      An optimal solution to the problem is composed of optimal solutions to its
      subproblems. The property that licenses solving a problem by combining
      subproblem optima rather than searching the whole solution space.
    prerequisites:
      intra_cluster: []
      roots: []                 # A floor node. Bottoms out by construction.
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}   # Dimension SET is unresolved — owner SUB-7 (OUT-3). Do not invent.
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "settled"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-933"
    frozen: true

  - id: "cl-1.root.recognize-optimal-substructure"
    name: "Recognize optimal substructure in a problem"
    node_kind: "skill"
    skill_type: "conceptual"
    cluster: "CL-1"
    role: "root"
    summary: >-
      Given a problem statement, judge whether optimal substructure holds — and,
      just as importantly, recognize when it does NOT and DP is therefore the wrong
      tool.
    skill_type_rationale: >-
      Cascade (schema §3) reaches S8 as a CONFIDENT residual: no proof obligation
      (S1 — this is a judgment, not a formal argument), no cost reduction (S2), no
      symptom diagnosis (S3), no cross-domain recognition (S4), no choice among
      alternatives (S5 — it is a property check, not a selection), no code (S6), no
      fixed routine to execute (S7). What remains is understanding what the property
      MEANS well enough to see it. That is "conceptual".
    prerequisites:
      intra_cluster: []
      roots: ["cl-1.root.optimal-substructure"]
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "settled"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-933"
    frozen: true

  # --- Principle 2: Overlapping subproblems ---------------------------------

  - id: "cl-1.root.overlapping-subproblems"
    name: "Overlapping subproblems"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "root"
    summary: >-
      The recursive decomposition revisits the same subproblems many times, so the
      subproblem count is far smaller than the recursion-tree size. The property
      that makes reuse pay — and that separates DP from plain divide-and-conquer.
    prerequisites:
      intra_cluster: []
      roots: []
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
