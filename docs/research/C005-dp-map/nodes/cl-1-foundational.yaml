    owner: "NEU-933"
    frozen: true

  - id: "cl-1.root.formulate-state-transition-base-case"
    name: "Formulate a DP: design the state, derive the transition, fix the base cases"
    node_kind: "skill"
    skill_type: "strategic"
    cluster: "CL-1"
    role: "root"
    summary: >-
      Turn a problem statement into a concrete correct DP formulation: choose what
      the state must capture (and what it may safely forget), derive the transition,
      and identify the base cases. The single highest-leverage skill in the map.
    skill_type_rationale: >-
      Cascade stops at S5 "strategic": designing a state IS choosing among candidate
      formulations under a correctness constraint — the defining act of selection.
      Earlier tests reject cleanly: no proof obligation (S1), no cost reduction (S2 —
      the recurrence does not yet exist, so there is nothing to accelerate; this is
      the exact boundary that keeps CL-4's optimizations distinct from formulation),
      no symptom (S3), no cross-domain recognition (S4).
    prerequisites:
      intra_cluster: []
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
        - "cl-1.root.recognize-optimal-substructure"
        - "cl-1.root.recognize-overlapping-subproblems"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
    javascript_materiality:
      assessed: false
      note: ""
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "settled"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-933"
    frozen: true

  # --- Principle 4: Memoization vs tabulation -------------------------------

  - id: "cl-1.root.memoization-vs-tabulation"
    name: "Memoization vs tabulation"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "root"
    summary: >-
      The two ways to evaluate a DP formulation — top-down with a cache, or
      bottom-up over an explicit order — and what actually differs between them:
      evaluation order, which states get computed, stack behaviour, and what each
      makes easy or hard. The same recurrence, two evaluation strategies.
    prerequisites:
      intra_cluster: []
      roots: ["cl-1.root.state-transition-base-case-formulation"]
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions: {}
