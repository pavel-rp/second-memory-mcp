      Cascade stops at S1: the contribution is the exchange argument — an optimal
      subarray ending at i either has length one or its prefix is itself an optimal
      subarray ending at i-1, since replacing that prefix with a better one would
      improve the whole, contradicting optimality. The cleanest cut-and-paste in the
      cluster, which is why it is worth proving explicitly rather than asserting.
    cluster: "CL-1"
