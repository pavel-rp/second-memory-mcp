  - id: "cl-1.linear-sequence-dp-1d"
    name: "1D linear/sequence DP (prefix-index state)"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      The base shape of the whole cluster: a state indexed by a single position in a
      sequence, dp[i], whose value answers the problem restricted to the first i
      elements, and whose transition looks back a bounded distance. What makes it the
      simplest useful DP — the state space is linear, the dependency order is the index
      order itself (so evaluation order is free rather than a decision), and the
      transition is a small case analysis over what happens at position i. D-F4 assigns
      it here by T4, a confident residual: a plain index tuple over a linear domain,
      with no exotic encoding and no combinatorial structure to respect.
    prerequisites:
      intra_cluster:
