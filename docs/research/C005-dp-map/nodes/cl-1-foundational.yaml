# =============================================================================
# RESIDUAL EXCLUSIONS
# =============================================================================
# NEU-934 acceptance scenario 3: "Given a technique the selected references disagree
# about or that this cluster excludes, when the node set is reviewed, then the
# exclusion is recorded with a rationale rather than silently dropped."
#
# Every entry below is a technique a reader might reasonably expect to find in a
# cluster called "foundational / linear-sequence" and does not. None is a gap: each
# is either owned by a named sibling cluster under D-F4's cascade, or is a scoping
# decision recorded with its reasoning. This block is the audit's evidence that the
# omissions are decisions.
#
# NOT a coverage claim. OUT-7 (SUB-9..11) owns coverage verdicts; this records what
# this sub-task decided and why, which is the input that audit needs.
# =============================================================================
residual_exclusions:

  - id: "EXC-1"
    subject: "Problem-level corpus references"
    disposition: "scoped-out-with-rationale"
    owner_if_reassigned: "SUB-9..11 (OUT-7)"
    rationale: >-
      `coverage.corpus_refs` asserts corpus-level ids ("C1", "C2") rather than the
      problem-level ids the template illustrates ("C1:1635"). NEU-932 F-C-1 verified
      only the CSES section counts at the 2026-07-16 cutoff; no per-problem id in any
      corpus was verified by this sub-task, and CAP-2 marks C4's ids unverified
      outright. Asserting a specific problem id would be an invented value wearing a
      citation's clothes — forbidden by NEU-887's discipline and by the template's own
      CAP-2 warning. A corpus-level ref is the strongest claim this sub-task can stand
      behind. OUT-7 resolves refs to problems when it audits coverage.

  - id: "EXC-2"
    subject: "Prefix-sum ACCELERATION of a DP transition"
    disposition: "owned-by-sibling-cluster"
    owner_if_reassigned: "CL-4 (SUB-6, NEU-937)"
    rationale: >-
      Collapsing a transition that sums over a range from O(n) to O(1) by precomputing
      prefix sums takes an ALREADY-CORRECT recurrence and reduces its evaluation cost
      without changing what any state means. That is D-F4 T1, and T1 stops at CL-4.
      This cluster maps the prefix-aggregate array AS a recurrence
      (cl-1.prefix-aggregate-recurrence, confident T4 residual) and the range-difference
      identity it licenses — the prerequisite the acceleration stands on. Mapping both
      under the shared name "prefix-sum DP" would have imported a CL-4 contribution into
      CL-1, which is the smoothing the charter forbids. The NEU-934 spec assigns
      "prefix-sum DP" to this cluster; this sub-task reads that as (a) and not (b), and
      records the reading here rather than deciding it silently. If SUB-6 does not map
      the acceleration, that is a coverage finding for OUT-7 — not a reason for CL-1 to
      absorb it. If CL-4's mapper disagrees with this split the route is a ledger
      challenge against D-F4, per U4; the base node stays mapped meanwhile.

  - id: "EXC-3"
    subject: "Rolling-array / memory compression of a linear or 2D DP"
    disposition: "owned-by-sibling-cluster"
    owner_if_reassigned: "CL-4 (SUB-6, NEU-937)"
    rationale: >-
      Keeping two rows instead of n, or one row updated in place, reduces the MEMORY
      cost of an already-correct recurrence without changing what its states mean —
      D-F4 T1 → CL-4. The temptation to keep it here is real, because the technique is
      taught alongside the 2D recurrences it compresses and feels foundational. It is
      not: the recurrence is correct before the compression and correct after it, which
      is exactly T1's test. Note the deliberate contrast with
      cl-1.order-2d-table-evaluation, which IS in this cluster: a wrong evaluation order
      makes the DP WRONG, not slow, so it fails T1 and lands at T4 — the same boundary
      the frozen root `implement-memoization-and-tabulation` already draws.

  - id: "EXC-4"
    subject: "Divide-and-conquer optimization and Knuth optimization of the partition recurrence"
    disposition: "owned-by-sibling-cluster"
    owner_if_reassigned: "CL-4 (SUB-6, NEU-937)"
    rationale: >-
      D-F4 §3.2 names both explicitly as CL-4 (T1). cl-1.sequence-partition-dp maps the
      base recurrence they accelerate and stops there. No cross-cluster attachment is
      declared from this side: per schema §4.3 a mapper declares from its OWN side only,
      and the dependency runs optimization→base (CL-4 requires CL-1), so it is CL-4's to
      declare and SUB-12's to resolve. Declaring it here would be declaring on a
      sibling's behalf — prohibited — and would fabricate a cycle for the audit to trip
      over. Recorded so the absence reads as a decision, not an oversight.

  - id: "EXC-5"
    subject: "LIS in O(n log n) via a monotone structure"
    disposition: "owned-by-sibling-cluster"
    owner_if_reassigned: "CL-4 (SUB-6, NEU-937)"
    rationale: >-
      D-F4 §3.2 uses this exact pair as its worked demonstration of the partition rule:
      "LIS in O(n²) is CL-1; LIS in O(n log n) is CL-4. Same problem, different node."
      cl-1.longest-increasing-subsequence-quadratic maps the recurrence; the patience/
      tails acceleration is a different node in a different cluster. Not a gap and not a
      contested assignment — the split is the partition working as specified.

  - id: "EXC-6"
    subject: "Hirschberg linear-space alignment; bit-parallel edit distance"
    disposition: "owned-by-sibling-cluster"
    owner_if_reassigned: "CL-4 (SUB-6, NEU-937)"
    rationale: >-
      Both take the already-correct edit-distance recurrence and reduce its cost —
      Hirschberg trades time for O(min(n,m)) memory via divide-and-conquer over the
      alignment; bit-parallel methods pack the DP row into machine words. D-F4 T1 → CL-4
      in both cases. Neither is enumerated in D-F4 §3.2's worked examples, so this is an
      application of the rule rather than a citation of it — recorded here explicitly so
      the reasoning is auditable and so SUB-6 can see the claim being made on its
      cluster. If SUB-6 judges bit-parallel edit distance to be out of the technique
      space entirely, that is a coverage question for OUT-7, not a reason for CL-1 to
      absorb it.

  - id: "EXC-7"
    subject: "Knapsack and its family (0/1, unbounded, bounded, subset-sum, coin change)"
    disposition: "owned-by-sibling-cluster"
    owner_if_reassigned: "CL-2 (SUB-4, NEU-935)"
    rationale: >-
      Named out of scope by the NEU-934 spec ("Combinatorial/structural families —
      knapsack, interval, tree, DAG DP") and assigned to CL-2 by D-F4. Recorded because
      the exclusion is genuinely surprising: knapsack's state is an index-plus-capacity
      tuple over what looks like a linear domain, which reads like a T4 residual and
      therefore like CL-1's. The spec's assignment governs, and the substantive reason
      it is right: the capacity index is not a position in a sequence but a coordinate
      over the combinatorial structure of achievable subset sums — the structure is what
      the DP must respect, which is T3. This sub-task does not re-decide it; recorded so
      the boundary is visible to the audit rather than looking like an oversight, and so
      that a reader who expects knapsack here finds the reason instead of a hole.

  - id: "EXC-8"
    subject: "Interval DP, tree DP, DAG DP"
    disposition: "owned-by-sibling-cluster"
    owner_if_reassigned: "CL-2 (SUB-4, NEU-935)"
    rationale: >-
      Named out of scope by the NEU-934 spec and assigned to CL-2 by D-F4 §3.2 (T3 —
      the state is indexed over a nontrivial combinatorial structure). Interval DP in
      particular is adjacent to this cluster's 2D index-pair shape and a reader may
      expect it here; the discriminator is that an interval's [l, r] indices are coupled
      as a SUBSTRUCTURE of the sequence rather than as two independent prefixes, and the
      transition ranges over split points inside it. Recorded, not re-decided.

  - id: "EXC-9"
    subject: "Bitmask/subset DP, digit DP, probability/expectation DP, automaton DP"
    disposition: "owned-by-sibling-cluster"
    owner_if_reassigned: "CL-3 (SUB-5, NEU-936)"
    rationale: >-
      Named out of scope by the NEU-934 spec and assigned to CL-3 by D-F4 §3.2 (T2 —
      the state ENCODING or a specialized domain's semantics is the contribution). Noted
      specifically because cl-1.state-machine-over-sequence carries the community alias
      "state-machine DP", which collides conceptually with CL-3's automaton DP: they are
      different techniques (a small fixed mode set read off the statement, versus a state
      space built from the input by an automaton construction), and this cluster makes no
      claim on CL-3's. The alias is carried on that node per X-D2 so OUT-7 reads the name
      overlap as naming instability rather than as a duplicate or a gap.

  - id: "EXC-10"
    subject: "An `optimization`-typed skill node in CL-1"
    disposition: "scoped-out-with-rationale"
    owner_if_reassigned: "CL-4 (SUB-6, NEU-937; SUB-13, NEU-938)"
    rationale: >-
      This cluster emits no node typed `optimization` (S2), by construction rather than
      by omission. S2 presupposes a correct recurrence and reduces its cost — which is
      D-F4 T1, which is CL-4's cluster. A CL-1 node typed S2 would be a node whose skill
      type and whose cluster assignment contradict each other, and schema §2.1 states
      that the two tests are deliberately the same test so that they agree by
      construction. The NEU-934 spec confirms the disposition: implementation and
      optimization are "the types the optimization clusters note feature heavily in
      their own nodes". Two `implementation` (S6) nodes ARE emitted here
      (cl-1.order-2d-table-evaluation, cl-1.handle-grid-boundaries-and-obstacles)
      because making a DP RUN CORRECTLY is not making it run FASTER — the boundary the
      frozen root `implement-memoization-and-tabulation` already draws inside CL-1.
      SUB-9's union-completeness check finds `optimization` in CL-4, as designed.

  - id: "EXC-11"
    subject: "A ledger entry for the S7/S5 skill-type boundary at cl-1.derive-recurrence-routine"
    disposition: "blocked-by-file-ownership"
    owner_if_reassigned: "SUB-9 (OUT-7 audit) or the D-S1 owner (NEU-933)"
    rationale: >-
      Schema Convention S asks that an indeterminate skill type be carried as
      `provisional` PLUS a `D-S1a` ledger entry with a named re-adjudication trigger.
      The first two are done on that node. The ledger entry is NOT filed: the ledger
      lives in the NEU-933 package and NEU-934 is sole writer of this file only —
      writing another sub-task's file is prohibited by the schema's own rule 3, and four
      sibling mappers are writing concurrently. Recording the omission here rather than
      breaking file ownership or letting the requirement lapse silently. The rationale
      and the trigger are carried in that node's `notes` in full, so the audit has
      everything the ledger entry would have contained. Consequence, stated plainly: if
      SUB-9 counts `D-S1a` entries against D-S1's ">10 triggers cascade revision"
      threshold by reading the ledger alone, this one will not be counted. Recorded as
      an EXCLUSION rather than a note precisely so that undercount is visible.

