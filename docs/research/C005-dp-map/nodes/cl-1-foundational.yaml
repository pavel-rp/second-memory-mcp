  - id: "cl-1.diagnose-empty-subarray-and-all-negative-boundary"
    name: "Diagnose the all-negative / empty-subarray boundary failure"
    node_kind: "skill"
    skill_type: "debugging"
    skill_type_rationale: >-
      Cascade stops at S3: the trigger is a SYMPTOM — a Kadane that returns 0 on an
      all-negative array, or a variant that disagrees with brute force only on inputs
      with no positive element — and the contribution is reasoning back to the cause (a
      base case initialized to 0, which silently asserts the empty subarray is
      admissible). S1 no: this is localization, not argument. S2 no: it is wrong, not
      slow. Kept SEPARATE from the general debugging node deliberately: it is the
      cluster's most-instantiated single bug, it is invisible on the random tests a
      learner writes (which almost surely contain a positive number), and a learner can
      have the general fault-localization skill and still never generate the input that
      exposes it — which is a distinct failure worth a distinct node.
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Recognize the family of boundary failures created by an implicit empty-solution
      assumption: a max-subarray seeded at 0 returns 0 for an all-negative input, and
      the same defect recurs wherever a base case encodes "nothing selected" as an
      admissible answer that the problem does not admit. Includes the diagnostic habit
      that finds it — testing the degenerate input class (all-negative, single element,
      empty) rather than only the random one — and the fix (seed from the first element
      and let the recurrence, not the initializer, decide).
    prerequisites:
      intra_cluster:
        - "cl-1.maximum-subarray-kadane"
        - "cl-1.diagnose-wrong-state-transition-base-case"
        - "cl-1.dp-failure-modes"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 4
      state_formulation_load: 1
      transition_derivation_load: 1
      proof_obligation_load: 1
      implementation_load: 2
      recognition_load: 4
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E9"]
      severity: "idiom-shift"
      rationale: >-
        MATERIAL, and material in the direction that JavaScript REMOVES the C++ hazard —
        recorded because materiality is symmetric (JS-D5) and because the C++-derived version of
        this node teaches a bug that does not exist in JavaScript. The C++ idiom seeds the
        running maximum with INT_MIN or LLONG_MIN, and the classic failure this node exists to
        diagnose is that INT_MIN + a[i] UNDERFLOWS, so the sentinel is not a safe identity for
        max-plus. JavaScript's -Infinity is a TOTAL identity: -Infinity + x is -Infinity for any
        finite x, it compares correctly against every finite value, and it cannot underflow. So
        the all-negative boundary in JavaScript is handled by seeding -Infinity and nothing else
        goes wrong. A downstream agent inheriting the C++ failure taxonomy would teach a guard
        against a bug JavaScript cannot have, and would miss that the JavaScript sentinel is
        simply correct. The one JavaScript-specific residue: -Infinity is a Number, so an
        Int32Array cannot hold it — the sentinel forces a plain Array or Float64Array for the
        accumulator.
    coverage:
      status: "unaudited"
      corpus_refs: ["C1"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"

  - id: "cl-1.max-product-subarray-two-value-state"
    name: "Maximum product subarray: when one value per state is not enough"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Kadane's shape with multiplication instead of addition, and the reason it is a
      separate node rather than a footnote: the substitution BREAKS the state. A
      negative element turns the smallest product ending at i-1 into the largest ending
      at i, so the maximum alone is not a sufficient state and the DP must carry the
      running minimum ALONGSIDE the maximum. This is the cluster's clearest
      demonstration that state sufficiency depends on the OPERATOR and not only on the
      problem's shape — the same recurrence skeleton, one operator changed, and the
      state must grow. Worth its node for that lesson more than for the problem.
    prerequisites:
      intra_cluster:
        - "cl-1.maximum-subarray-kadane"
        - "cl-1.prove-prefix-state-sufficiency"
        - "cl-1.best-ending-at-index-state-pattern"
      roots:
        - "cl-1.root.state-transition-base-case-formulation"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 5
      state_formulation_load: 3
      transition_derivation_load: 3
      proof_obligation_load: 2
      implementation_load: 2
      recognition_load: 3
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. The acquisition is that one value per state is insufficient and the
        state must carry both the running minimum and maximum, because a negative flips them.
        That is a modelling fact about sign, not about width; a downstream agent writes the same
        two-value state in either language. Deliberate non-claim: subarray products do exceed
        2^53 quickly, but they exceed C++'s long long just as quickly, so the effect is not
        DIFFERENTIAL against the C++ default and recording it here would be an invented
        materiality claim. The problems this node meets bound the product; where they do not,
        both languages need a bignum.
    coverage:
      status: "unaudited"
      corpus_refs: ["C4"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-934"
    aliases: ["maximum product subarray", "min-max paired state"]

  - id: "cl-1.circular-maximum-subarray"
    name: "Circular maximum subarray: the complement reduction"
    node_kind: "knowledge"
    cluster: "CL-1"
    role: "technique"
    summary: >-
      Maximum subarray on a circular array, solved not by a new recurrence but by a
      case split: the optimal subarray either does not wrap (plain Kadane) or does, in
      which case its COMPLEMENT is a non-wrapping subarray and is minimal, so the
      answer is total-minus-minimum-subarray. Mapped because the technique on display
      is REDUCTION rather than formulation — turning a new problem into two runs of a
      solved one — and because it carries a real degenerate trap: when every element is
      negative the wrap case's complement is the whole array, leaving an empty
      subarray, so that branch must be excluded rather than trusted. The same
      empty-solution defect as the Kadane boundary node, met in a place where it is
      much harder to see.
    prerequisites:
      intra_cluster:
        - "cl-1.maximum-subarray-kadane"
        - "cl-1.prefix-aggregate-recurrence"
        - "cl-1.diagnose-empty-subarray-and-all-negative-boundary"
      roots:
        - "cl-1.root.optimal-substructure"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 5
      state_formulation_load: 1
      transition_derivation_load: 2
      proof_obligation_load: 2
      implementation_load: 2
      recognition_load: 4
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. The complement reduction — maximum circular subarray is the total
        minus the minimum subarray — is an arithmetic identity over the same magnitudes Kadane
        already handles.
    coverage:
      status: "unaudited"
      corpus_refs: ["C4"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
