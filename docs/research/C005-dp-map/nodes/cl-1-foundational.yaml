      progression_stage: "PS-3"
      entry_gate: "gate-c"
      prerequisite_depth: 3
      state_formulation_load: 2
      transition_derivation_load: 3
      proof_obligation_load: 3
      implementation_load: 1
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. The argument is about the recurrence, not its realization. Note the
        deliberate boundary: JS-E2 can make a CORRECT recurrence produce wrong output in
        JavaScript, but that is an implementation defect, not a gap in the proof — and treating
        it as one would be exactly the invented claim the third acceptance scenario forbids. The
        precision hazard is recorded where it is written: cl-1.counting-dp-over-linear-domain.
