      179 nodes across all five files by id, by name, and by summary. This is not a
      naming miss that `to_name` could rescue — the technique is genuinely unmapped.
    root_cause: >-
      SOS DP FELL THROUGH THE CLUSTER PARTITION. Every cluster that could have owned it
      declined, each for its own defensible reason: CL-3 (SUB-5) declined it as
      link-not-own and declared THIS attachment instead; CL-4-mainstream (SUB-6)
      declined it as outside its five nominated areas; CL-4-frontier (SUB-13) declined
      it under RX-3. CL-2's exclusion note E9 records the same technique being pushed
      out of CL-2 ("cl-2.subset-sum-feasibility is over integer totals, SOS DP is over
      a subset lattice"). Four declines, zero owners. The declaration is therefore
      CORRECT AND VALUABLE: it is the only surviving evidence in the graph that the
      dependency, and the technique, exist at all.
    interacts_with: "D-F4a (unresolved cluster-partition dispute)"
    explicitly_not_done: >-
      D-F4a is NOT resolved here and no SOS node is minted here. Whether SOS DP is CL-3
      or CL-4 is precisely the live dispute; an integration pass picking a side by
      minting a node would settle an open adjudication by fait accompli, in a file that
      owns no nodes, using the weakest possible evidence. Left standing for the audits.

