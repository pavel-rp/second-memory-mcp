# =============================================================================
# CROSS-CLUSTER PREREQUISITE EDGES
# =============================================================================
# Sole writer: NEU-939 (SUB-12) — the cross-cluster integration pass
#
# *** THIS FILE IS EMPTY DURING THE MAPPING PHASE AND THAT IS CORRECT. ***
#   NEU-932 D-F3 §4 rule 4: a mapper writing here breaks per-cluster file ownership
#   and serializes the parallel fan-out that the whole layout exists to enable.
#   SUB-3/4/5/6/13: this file is not yours. Declare in your own node file.
#
#   The mapping phase is CLOSED. All five family clusters are merged (179 nodes),
#   and SUB-12 has run. What follows is its output.
#
# =============================================================================
# WHAT SUB-12 DID
# =============================================================================
# Mappers DECLARE attachment points; SUB-12 RESOLVES them into edges. Every
# mapper's node file carries `cross_cluster_attachments` entries shaped like:
#
#   cross_cluster_attachments:
#     - attachment_id: "xc.cl-4.knuth-optimization->cl-2.interval-dp"
#       from: "cl-4.knuth-optimization"
#       to_cluster: "CL-2"
#       to_node: "cl-2.interval-dp"      # A GUESS. See the warning below.
#       to_name: "Interval DP"           # The mapper's human name for the target.
#       relation: "requires"
#       rationale: "..."
#       confidence: "named"              # "named" | "conjectured"
#       status: "declared"
#
# *** THE WARNING THAT MATTERS MOST ***
#   `to_node` IS A GUESS AND SUB-12 TREATED IT AS ONE.
#   The five mappers ran in PARALLEL. When SUB-6 declared an attachment onto
#   "cl-2.interval-dp", the CL-2 file did not exist yet — SUB-4 had not written it.
#   The mapper could not look the id up, so it predicted one from the naming grammar.
#   => Resolution ran on `to_name` + `rationale` + `to_cluster` FIRST. `to_node` was
#      used as a hint only. An exact-id-match-only resolver would have silently
#      dropped real dependencies — see the audit trail in §RESOLUTION OUTCOME below:
#      **11 of 27 declared `to_node` ids did not resolve, while every one of those
#      11 resolved unambiguously on `to_name` + `rationale`.**
#
# RESOLUTION RULES (as applied)
#   R1. One declaration -> one edge. Mappers declare from ONE side, so a genuine
#       mutual dependency shows up as two declarations; they are NOT merged into one
#       edge — a real bidirectional prerequisite is a CYCLE and the dependency audit
#       must see it. (No mutual pair occurs in this pass; see §CYCLE NOTE.)
#   R2. An UNRESOLVABLE declaration (no plausible target exists in the named
#       cluster) is reported as a GAP with its `attachment_id`. NEVER deleted.
#       A mapper's declaration is evidence that a dependency exists; failure to find
#       the target is a finding about the MAP, not about the declaration.
#   R3. `confidence: "conjectured"` means the mapper believed a target SHOULD exist
#       but was not sure it would. If no target exists, that is a COVERAGE finding
#       for OUT-7, not a silent drop.
#   R4. Edges drawn here set `status: "realized"` and carry `realized_from`
#       (the attachment_id). Traceability runs backwards from every edge to the
#       declaration that produced it.
#
#   R5. *** ROOT AND ANCHOR EDGES ARE NOT RE-DRAWN HERE. ***
#       `prerequisites.roots` and `prerequisites.boundary_anchors` are ALREADY DRAWN
#       by the mappers, directly, in their own files. Root edges point into CL-1 and
#       therefore LOOK cross-cluster by a naive endpoint-span test — they are not
#       SUB-12's job. Roots and anchors are a SHARED FROZEN FLOOR that existed before
#       any mapper started, so there was nothing to resolve and the mapper drew
#       straight onto it. Re-drawing them here would DUPLICATE every floor edge in the
#       graph and corrupt the dependency and path audits.
#       => SUB-12's input was `cross_cluster_attachments` ONLY. Nothing else.
#       ** CONFIRMED: this file contains ZERO root edges and ZERO anchor edges. **
#       Every `realized_from` below names an `xc.`-prefixed attachment_id, which is
#       structurally impossible for a root or anchor edge to carry. Audits classify
#       by FIELD, not by endpoint span (D-S4 / X-S1).
#       Full argument: ../../C005-dp-map-schema/01_node-and-edge-schema.md §4 (D-S4).
#
# =============================================================================
# RESOLUTION OUTCOME — the numbers, stated up front so an audit need not count
# =============================================================================
#   Attachments collected from the five merged node files ..... 27
#   Realized into validated cross-cluster edges ............... 25
#   Unresolvable — reported as findings for SUB-9 (NEU-943) ....  2
#   Root/anchor edges re-drawn ................................  0
#   Node files edited by SUB-12 ...............................  0
#
#   Resolution key that actually carried the pass:
#     to_node matched a real node as declared ................. 16 / 27
#     to_node was STALE; resolved on to_name + rationale ...... 11 / 27   <-- the point
#       of which: id wrong, cluster right ..................... 9
#       of which: id AND to_cluster both wrong ................ 2  (see §CLUSTER CORRECTIONS)
#
# =============================================================================
# HOW TO READ AN EDGE
# =============================================================================
#   `from` is the DEPENDENT node; `to` is the PREREQUISITE.
#   The edge asserts: a learner cannot acquire `from` without first having `to`
#   (01_node-and-edge-schema.md §4).
#
#   A declaration with `relation: "requires"` yields  from=declaring node, to=target.
#   A declaration with `relation: "required-by"` yields the REVERSE: from=target,
#   to=declaring node. Both `"required-by"` declarations in this pass are
#   unresolvable (both name CL-4 targets that no mapper owns), so every realized
#   edge below happens to run declaring-node -> target. This is an accident of the
#   corpus, not a rule; the direction is derived from `relation` in every case.
#
#   `edge_id` grammar: `xce.<from>-><to>` over the RESOLVED endpoints.
#     Distinct from `attachment_id` (`xc.<from>-><predicted-to>`) on purpose: the
#     attachment id is frozen at what the mapper GUESSED, the edge id records what the
#     graph actually contains. When a prediction was correct the two agree apart from
#     the prefix; when it was stale they differ, and that difference is the audit
#     trail. `realized_from` is the join key back to the declaration.
#
#   `resolution.key` records WHAT resolved the target:
#     "to_node"  — the mapper's predicted id matched a real node. Nothing to report.
#     "to_name"  — the predicted id was stale; the human name + rationale resolved it.
#     Both are validated resolutions. "to_name" is not a weaker edge — it is the
#     schema's designed primary key (§4.3), and it carried 11 of 27.
#
# YAML: 1.2 core schema. All string enums quoted.
# =============================================================================

