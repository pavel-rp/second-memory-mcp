# pnpm 12 fails install on unreviewed dependency build scripts (it no longer
# reads onlyBuiltDependencies). esbuild is allowed, as before; better-sqlite3
# is only an auto-installed optional peer of drizzle-orm (this app uses pg and
# nothing imports better-sqlite3), so its native build is explicitly denied.
allowBuilds:
  esbuild: true
  better-sqlite3: false
