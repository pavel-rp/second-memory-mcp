        from: "cl-2.formulate-zero-one-knapsack"
        to_cluster: "CL-1"
        to_node: "cl-1.linear-sequence-dp-1d"
        to_name: "1D linear/sequence DP (prefix-index state)"
        relation: "requires"
        rationale: >-
          The knapsack state's item axis IS a prefix index — "having decided the
          first i items". A learner cannot design that axis without already
          holding the plain prefix-indexed linear DP that CL-1 owns; the
          knapsack adds the resource axis on top of it, it does not introduce
          the prefix idea. Declared, not drawn: SUB-12 owns realization.
        confidence: "named"
        status: "declared"
    difficulty_dimensions:
