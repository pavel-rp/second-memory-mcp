      prerequisite_depth: 3
      state_formulation_load: 3
      transition_derivation_load: 2
      proof_obligation_load: 1
      implementation_load: 2
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. Choosing the resource axis and the item order is a modelling act
        driven by the statement's structure, not the language.
    coverage:
      status: "unaudited"
      corpus_refs: ["C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    contested_by: ["CL-1"]
    notes: >-
      PREDICTION VERIFIED POST-HOC, and the provenance is stated rather than
