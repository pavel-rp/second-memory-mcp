      transition_derivation_load: 2
      proof_obligation_load: 0
      implementation_load: 3
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E5", "JS-E6"]
      severity: "performance"
      rationale: >-
        MATERIAL — this is the node that writes the n^2 table and the O(n^3) loop nest, and the
        container decision is JavaScript's to make. C++'s vector<vector<int>> gives unboxed
        contiguous rows for free; the direct JavaScript translation gives a boxed outer array of
        boxed inner arrays, read in the innermost loop of a cubic algorithm — the worst place to
        pay a pointer chase and an unboxing. The JavaScript idiom is a flat Int32Array with i *
        n + j addressing. Recorded here rather than on cl-2.interval-evaluation-order-by-length
        because the order is a dependency fact and the table is a written artifact (JS-D2).
        Deliberate non-claim on JS-E1: the length-major loop is ITERATIVE, so it is exactly the
        realization that sidesteps the recursion cap — which is worth stating, because the
        memoized top-down alternative a C++ author might reach for instead does not sidestep it.
