  # ===========================================================================
  # A. KNAPSACK / SUBSET-SUM / COUNTING DP
  # ===========================================================================
  # CLUSTER ASSIGNMENT, ARGUED — because a T4 reading is available and a reader
  # will reach for it. Knapsack's state LOOKS like a plain index tuple (i, w),
  # which would fire T4 -> CL-1. The NEU-935 spec assigns the family to CL-2, and
  # the rule agrees on the merits: the DP's difficulty is not the rectangular
  # table, it is respecting the SELECTION STRUCTURE over the item set — "each
  # item at most once" (0/1) vs "any multiplicity" (unbounded) vs "at most k"
  # (bounded). That structure, not the capacity axis, is what the recurrence must
  # respect and what the loop direction encodes. T3 fires. The rival T4 reading
  # is real and is carried on the affected nodes as `contested_by: ["CL-1"]`
  # rather than smoothed (NEU-889: conflicts preserved). If SUB-3 claims these,
  # the route is a D-F4a ledger challenge (U4) — not a local re-decision.
