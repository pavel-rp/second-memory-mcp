  - id: "cl-2.implement-counting-dp-under-a-modulus"
    name: "Implement a counting DP under a modulus"
    node_kind: "skill"
    skill_type: "implementation"
    skill_type_rationale: >-
      Cascade stops at S6. S1 no, S2 no (correctness of magnitude, not speed),
      S3 no, S4 no, S5 no (the recurrence is fixed). S6 rather than S7: where to
      reduce is a judgment about THIS recurrence's accumulation width, not a
      fixed routine — a transition summing two values may reduce lazily, one
      summing many must reduce inside the loop, and a subtraction (inclusion-
      exclusion in a counting transition) must be corrected into range before
      it is stored. That is the S6/S7 test in schema §2.1.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Keep a counting DP's values in range throughout: reduce at the right
      points, handle the negative results of subtractive transitions, and know
      that reduction hides overflow rather than preventing it. Separated from
      the modular arithmetic itself, which is a registered boundary anchor and
      not this map's to teach — what this node adds is where the reductions go
      in a DP, which the anchor says nothing about.
    prerequisites:
      intra_cluster:
        - "cl-2.implement-counting-dp-loop-nesting"
      roots:
        - "cl-1.root.implement-memoization-and-tabulation"
      boundary_anchors:
        - "anchor.modular-arithmetic@1.0.0"
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-4"
      entry_gate: "gate-c"
      prerequisite_depth: 9
      state_formulation_load: 1
      transition_derivation_load: 2
      proof_obligation_load: 0
      implementation_load: 3
      recognition_load: 1
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E2", "JS-E3"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — the highest-impact single finding in this cluster. This is the
        node that writes the modular arithmetic, and the C++ idiom it inherits is silently wrong
        in JavaScript. With M = 1e9+7 (the modulus essentially every counting problem uses), two
        residues below M multiply to ~1e18, which is ~111x past 2^53. C++'s `(a * b) % M` in
        long long is exact and is written reflexively. JavaScript's identical line silently
        ROUNDS and returns a plausible wrong residue — it does not throw, does not wrap to a
        negative, and does not announce itself. The addition folds are fine (2M is far below
        2^53); it is multiplication alone that breaks, which is why the bug survives casual
        testing on small inputs where products stay under 2^53. Correct JavaScript requires
        either BigInt for the multiply-and-reduce (correct, and materially slower — JS-E3), or a
        split multiply that decomposes one operand around 2^26 so no partial product leaves the
        exact range (Math.imul-based). A downstream agent authoring this node in JavaScript MUST
        write one of them; inheriting the C++ default produces a wrong solution that looks
        right.
      mapper_note: >-
        Observation only, NOT a verdict — OUT-5 (SUB-8) owns it. Recorded because it is the
        sharpest JavaScript divergence SUB-4 met: every selected reference assumes a 64-bit
        integer type in which a product of two values below 10^9 is exact. JavaScript's Number
        is not that type, so the standard "multiply then reduce" step is unsound above 2^53 and
        needs BigInt or a split-multiply. This is a language-level break in a step the
        references treat as trivial. SUB-8 must reach its own verdict; this note is not one.
    coverage:
      status: "unaudited"
      corpus_refs: ["C1", "C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"

