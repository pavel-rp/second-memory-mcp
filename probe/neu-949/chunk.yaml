  - id: "cl-2.child-aggregation"
    name: "Child aggregation"
    node_kind: "knowledge"
    cluster: "CL-2"
    role: "technique"
    summary: >-
      That a tree DP's transition is a fold over an arbitrary-arity child list
      rather than a fixed-arity expression, and what follows: the combining
      operation must be associative and commutative in the child order (the
      children have no order), and the identity of that fold is the leaf base
      case. Recognizing the fold is what lets a learner write the transition
      once for binary and general trees alike.
