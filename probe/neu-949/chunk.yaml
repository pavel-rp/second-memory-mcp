  - id: "cl-2.prove-zero-one-knapsack-correctness"
    name: "Prove the 0/1 knapsack recurrence correct, and prove greedy is not"
    node_kind: "skill"
    skill_type: "proof"
    skill_type_rationale: >-
      Cascade stops at S1, the first test. The contribution IS the argument:
      induction on the item prefix establishes that the table holds the true
      optimum for every (prefix, capacity), and an exchange argument on
      value-density shows why the greedy that solves fractional knapsack fails
      the 0/1 case. No later test is reached — the cascade stops on the first
      yes.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Establish by argument that the take-or-leave recurrence yields the optimum:
      induction over the item prefix with the induction hypothesis stated on
      every capacity simultaneously. And, as the same skill's other half,
      construct the counterexample-plus-exchange argument that shows
      value-density greedy is wrong for indivisible items but right when items
      may be split. Separated from the formulation node per schema §1.1: a
      learner routinely holds a working knapsack without being able to argue it.
    prerequisites:
      intra_cluster:
        - "cl-2.zero-one-knapsack-recurrence"
      roots:
        - "cl-1.root.optimal-substructure"
        - "cl-1.root.recognize-optimal-substructure"
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-3"
      entry_gate: "gate-c"
      prerequisite_depth: 3
      state_formulation_load: 2
      transition_derivation_load: 2
      proof_obligation_load: 3
      implementation_load: 1
      recognition_load: 2
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: false
      effects: []
      rationale: >-
        JavaScript-neutral. The exchange argument and the greedy counterexample are
        language-independent.
    coverage:
      status: "unaudited"
      corpus_refs: []
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    notes: >-
      corpus_refs empty and that is a finding, not an omission: no selected
      corpus (C1..C6) grades a proof. Competitive judges score output. This node
      is class-1 [literature] from the taxonomies alone. OUT-7 should read an
