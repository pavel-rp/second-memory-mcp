  - id: "cl-2.root-an-unrooted-tree"
    name: "Root an unrooted tree"
    node_kind: "skill"
    skill_type: "procedural"
    skill_type_rationale: >-
      Cascade runs to S7, and S7 is asserted rather than defaulted to — the
      schema §2.1 warns that S7 is the stronger claim and that doubt should send
      a node to S6, so the claim is made deliberately. S1 no, S2 no, S3 no, S4
      no, S5 no (which vertex is picked does not matter — that is precisely the
      point). S6 no: nothing here varies with the problem. Pick any vertex, run
      one traversal, record parent and children, never revisit the parent. The
      steps are identical for every tree DP ever written; no judgment about this
      specific problem enters. That invariance IS the S7 test.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Turn an undirected acyclic input into the rooted structure the DP needs:
      pick an arbitrary vertex, traverse, and record each vertex's parent so the
      adjacency list can be read as a child list. Small, mechanical, and its own
      node because it is a real precondition a learner executes before every
      tree DP and can execute wrongly — most commonly by recursing back into the
      parent and turning a tree into an infinite walk.
    prerequisites:
      intra_cluster:
        - "cl-2.subtree-indexed-state-space"
      roots: []
      boundary_anchors: []
    cross_cluster_attachments: []
    difficulty_dimensions:
      dimension_set_version: "1.0.0"
      progression_stage: "PS-2"
      entry_gate: "gate-c"
      prerequisite_depth: 2
      state_formulation_load: 1
      transition_derivation_load: 1
      proof_obligation_load: 0
      implementation_load: 2
      recognition_load: 1
      creator_review: "deferred-provisional"
    javascript_materiality:
      assessed: true
      rule_version: "1.0.0"
      material: true
      effects: ["JS-E1"]
      severity: "blocking"
      rationale: >-
        MATERIAL AND BLOCKING — rooting is a traversal, and the recursive traversal that is the
        C++ default does not survive the JavaScript stack at competitive tree sizes. The C++
        idiom is a recursive DFS assigning parents and depths; on a path-shaped tree with n =
        2e5 it descends 2e5 frames, which the default 8 MB process stack absorbs and which
        judges routinely raise further. JavaScript's cap is on the order of 1e4 frames and there
        is NO equivalent knob a submitted solution can set — V8's --stack-size is a host flag,
        not something the program controls. A path-shaped tree is the standard adversarial
        input, not an exotic one, so the failure is expected rather than unlucky. The JavaScript
        realization must therefore root the tree with an EXPLICIT stack (or a BFS order) — not
        as a stylistic preference but as the only form that runs. This node is upstream of every
        tree-DP node in the cluster, so the effect propagates.
    coverage:
      status: "unaudited"
      corpus_refs: ["C2"]
    evidence_class: 1
    status: "provisional"
    adjudicated_at_map_version: "0.1.0"
    owner: "NEU-935"
    aliases: ["parent assignment", "orienting a tree"]
    notes: >-
      Depends on a general graph traversal, which is NOT a registered anchor.
      Not routed through AR-1: unlike topological order (see
      cl-2.impose-topological-evaluation-order), a single DFS over an adjacency
      list sits AT OR BELOW NEU-887's elementary-data-structures floor, and the
      register's rule admits an anchor only if it is ABOVE that floor. Recorded
      here so the floor audit can see the judgment was made rather than missed.
      If SUB-2 disagrees, this becomes a third AR-1 request.

  - id: "cl-2.formulate-subtree-recurrence"
    name: "Formulate a subtree recurrence: decide what a subtree must summarize"
    node_kind: "skill"
    skill_type: "strategic"
    skill_type_rationale: >-
      Cascade stops at S5. S1 no (that is the proof nodes), S2 no (nothing
      correct exists yet to accelerate), S3 no, S4 no (the tree is given in the
      statement). S5 yes and it is the heart of the family: choosing WHAT a
      subtree reports upward — a single optimum, an optimum per boundary
      condition, a whole vector indexed by size — is choosing among candidate
      formulations under a correctness-and-cost constraint, and it is where tree
      problems are actually won or lost.
    cluster: "CL-2"
    role: "technique"
    summary: >-
      Decide the contract between a subtree and its parent: what a child must
      report so that the parent can decide without looking inside it. The
      discipline a learner acquires is to ask "what does my parent need to know
      about me, and what may it safely not know" — which is the
      forget-what-you-can principle of state design, made concrete by a
      structure that enforces it.
    prerequisites:
      intra_cluster:
        - "cl-2.subtree-indexed-state-space"
        - "cl-2.child-aggregation"
      roots:
        - "cl-1.root.formulate-state-transition-base-case"
        - "cl-1.root.recognize-optimal-substructure"
