  - id: "cl-2.combination-vs-permutation-loop-order"
    name: "Loop nesting decides whether a counting DP counts combinations or permutations"
    node_kind: "knowledge"
    cluster: "CL-2"
    role: "technique"
    summary: >-
      In an unbounded counting DP, putting the item loop outside the amount loop
      counts each multiset once (combinations); putting the amount loop outside
      counts every ordering of the same multiset (permutations/sequences). The
      two loops are the same three lines in a different order and neither errors.
      The underlying fact is that the outer loop is what imposes a canonical
      order on the choices, and imposing one is exactly what makes each
      combination counted once.
